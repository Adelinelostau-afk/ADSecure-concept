<script>
if(/\/test[^/]*\.html$/i.test(location.pathname)){
  document.title="🧪 TEST — AD Management";
  var m=document.createElement("meta");m.name="robots";m.content="noindex,nofollow";document.head.appendChild(m);
  document.addEventListener("DOMContentLoaded",function(){
    var b=document.createElement("div");
    b.id="bandeau-test";
    b.style.cssText="position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:99999;background:#ea580c;color:#fff;font:700 11px/1 Inter,-apple-system,sans-serif;padding:6px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap";
    b.textContent="🧪 VERSION TEST";
    b.title="Vos essais ici ne modifient pas les vraies données";
    b.onclick=function(){
      if(confirm("🧪 Version de test\n\nVos essais ici ne modifient pas les vraies données, et les e-mails partent vers votre propre adresse.\n\nVoulez-vous remplacer les données de test par une copie des vraies données actuelles ?")) copierVraiesDonneesVersTest(false).then(function(ok){ if(ok){ applyTheme();renderNav();renderPage(); alert("✓ Données de test remplacées par une copie des vraies données."); } else alert("Copie impossible. Connectez-vous d'abord."); });
    };
    document.body.appendChild(b);
  });
}
</script>
<!-- ══ ÉCRAN DE CONNEXION ══ -->
<div id="login-screen" style="display:flex">
  <div class="login-card">
    <!-- Logo -->
    <div style="text-align:center;margin-bottom:32px">
      <div id="login-logo" style="width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#475569,#64748b);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px;box-shadow:0 12px 32px rgba(15,23,42,0.25)">🛡️</div>
      <div class="eyebrow" style="justify-content:center">Connexion</div>
      <div style="font-family:'Lora',Georgia,serif;font-weight:700;font-size:24px;color:#1A2118;line-height:1.1">AD Management<br/><span style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#64748b;font-family:'Inter',-apple-system,sans-serif;font-weight:700">Logiciel de gestion</span></div>
    </div>
    <!-- Form -->
    <div style="margin-bottom:16px">
      <label style="display:block;font-size:11px;font-weight:700;color:rgba(26,33,24,0.38);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:7px">Email</label>
      <input id="login-input" type="email" placeholder="votre@email.fr" autocomplete="username"
        style="width:100%;padding:12px 16px;border-radius:11px;border:1.5px solid rgba(26,33,24,0.15);font-size:14px;color:#1A2118;background:#F7F4ED;outline:none;font-family:'Inter',-apple-system,sans-serif;box-sizing:border-box;transition:border-color 0.2s"
        onfocus="this.style.borderColor='#475569'" onblur="this.style.borderColor=''"
        onkeydown="if(event.key==='Enter')document.getElementById('pwd-input').focus()"/>
    </div>
    <div style="margin-bottom:14px">
      <label style="display:block;font-size:11px;font-weight:700;color:rgba(26,33,24,0.38);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:7px">Mot de passe</label>
      <input id="pwd-input" type="password" placeholder="Votre mot de passe"
        style="width:100%;padding:12px 16px;border-radius:11px;border:1.5px solid rgba(26,33,24,0.15);font-size:14px;color:#1A2118;background:#F7F4ED;outline:none;font-family:'Inter',-apple-system,sans-serif;box-sizing:border-box;transition:border-color 0.2s"
        onfocus="this.style.borderColor='#475569'" onblur="this.style.borderColor=''"
        onkeydown="if(event.key==='Enter')doLogin()"/>
      <div style="text-align:right;margin-top:8px"><a href="#" onclick="motDePasseOublie();return false" style="font-size:12.5px;font-weight:600;color:#475569;text-decoration:underline;cursor:pointer">Mot de passe oublié ?</a></div>
    </div>
    <div id="login-error" style="display:none;color:#991b1b;font-size:12px;font-weight:600;margin-bottom:14px;padding:9px 14px;background:#fef2f2;border-radius:9px;border:1px solid #fecaca">⚠️ Identifiants incorrects</div>
    <button onclick="doLogin()"
      style="width:100%;padding:14px;border-radius:999px;border:none;background:#1A2118;color:#F7F4ED;cursor:pointer;font-weight:700;font-size:14.5px;font-family:'Inter',-apple-system,sans-serif;transition:background 0.2s,transform 0.2s;display:flex;align-items:center;justify-content:center;gap:8px"
      onmouseover="this.style.background='#475569';this.style.transform='translateY(-1px)'"
      onmouseout="this.style.background='#1A2118';this.style.transform=''">
      Se connecter <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:#64748b">Pas encore de compte ? <a id="lien-essai" href="inscription.html" style="font-weight:700;color:#3286A0;text-decoration:underline">Essai gratuit de 14 jours</a></div>
    <div style="text-align:center;margin-top:20px;padding-top:20px;border-top:1px solid rgba(26,33,24,0.1)">
      <a href="index.html" style="font-size:13px;font-weight:600;color:rgba(26,33,24,0.38);display:inline-flex;align-items:center;gap:6px;transition:color 0.2s"
        onmouseover="this.style.color='#475569'" onmouseout="this.style.color='rgba(26,33,24,0.38)'">← Retour au site</a>
    </div>
  </div>
</div>
