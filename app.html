function cptPas(c,d){const i=document.getElementById("cpt-"+c);if(!i)return;i.value=Math.max(0,(parseInt(i.value)||0)+d)||"";cptMaj();}
function cptLire(){
  const det={};let tb=0,tp=0;
  CAISSE_BILLETS.forEach(c=>{const n=Math.max(0,parseInt(document.getElementById("cpt-"+c).value)||0);if(n)det[c]=n;tb+=n*c;});
  CAISSE_PIECES.forEach(c=>{const n=Math.max(0,parseInt(document.getElementById("cpt-"+c).value)||0);if(n)det[c]=n;tp+=n*c;});
  return {det,tb,tp,total:tb+tp};
}
function cptMaj(){
  const r=cptLire();
  [...CAISSE_BILLETS,...CAISSE_PIECES].forEach(c=>{const n=r.det[c]||0;const e=document.getElementById("cpt-st-"+c);if(e){e.textContent=n?cEur(n*c/100):"—";e.style.color=n?"#1A2118":"#94a3b8";e.style.fontWeight=n?"700":"400";}});
  document.getElementById("cpt-tb").textContent=cEur(r.tb/100);
  document.getElementById("cpt-tp").textContent=cEur(r.tp/100);
  document.getElementById("cpt-total").textContent=cEur(r.total/100);
  const ec=r.total-(window._cptTheo||0);
  const e=document.getElementById("cpt-ecart");
  e.textContent=ec===0?"✓ Aucun écart":(ec>0?"+":"")+cEur(ec/100)+(ec>0?" (excédent)":" (manquant)");
  e.style.color=ec===0?"#15803d":"#991b1b";
  document.getElementById("cpt-adj-wrap").style.display=ec===0?"none":"flex";
}
function saveComptage(){
  caisseNorm();
  const r=cptLire();
  const theo=window._cptTheo||0;
  const ecart=r.total-theo;
  if(r.total===0&&!confirm("Le total compté est de 0 €. Enregistrer quand même ?"))return;
  const now=new Date();
  const c={id:uid(),ts:now.toISOString(),type:document.getElementById("cpt-type").value,
    date:document.getElementById("cpt-date").value||getToday(),
    heure:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),
    par:document.getElementById("cpt-par").value.trim(),note:document.getElementById("cpt-note").value.trim(),
    detail:r.det,totalBillets:r.tb/100,totalPieces:r.tp/100,total:r.total/100,theorique:theo/100,ecart:ecart/100,ajustementId:""};
  if(ecart!==0&&document.getElementById("cpt-adj").checked){
    const aid=uid();
    CAISSE.mouvements.push({id:aid,ts:now.toISOString(),par:c.par,sens:ecart>0?"entree":"sortie",montant:Math.abs(ecart)/100,
      date:c.date,mode:"Espèces",cat:"Ajustement de caisse",libelle:`Écart constaté au comptage (${(CAISSE_TYPES_CPT[c.type]||"").toLowerCase()})`,
      tiers:"",ref:"",note:"",comptageId:c.id});
    c.ajustementId=aid;
  }
  CAISSE.comptages.push(c);
  logActivity("Caisse — comptage "+(CAISSE_TYPES_CPT[c.type]||"").toLowerCase(),`${cEur(c.total)} compté · écart ${c.ecart>0?"+":""}${cEur(c.ecart)}`);
  saveData();closeModal();caisseOnglet="comptage";renderPage();
}
function supprComptage(id){
  const c=CAISSE.comptages.find(x=>x.id===id);if(!c)return;
  const adj=c.ajustementId&&CAISSE.mouvements.find(m=>m.id===c.ajustementId);
  if(!confirm(`Supprimer ce comptage du ${cDateLong(c.date)} ?${adj?"\nL'ajustement de caisse qu'il avait créé sera aussi supprimé.":""}`))return;
  CAISSE.comptages=CAISSE.comptages.filter(x=>x.id!==id);
  if(adj) CAISSE.mouvements=CAISSE.mouvements.filter(m=>m.id!==c.ajustementId);
  logActivity("Caisse — comptage supprimé",`${cDateLong(c.date)} · ${cEur(c.total)}`);
  saveData();renderPage();
}

function caisseExportCSV(){

  const csv="﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  const [du,au]=caisseBornes();
  a.download=`journal-caisse_${caisseFiltre.periode==="tout"?"complet":du+"_"+au}.csv`;

// ══════════════════════════════════════════════════════════
// ── RAPPROCHEMENT BANCAIRE QONTO ──────────────────────────
// ══════════════════════════════════════════════════════════
// RAPPRO[idTransaction] = {type:"fac"|"bcc"|"ff"|"ignore", id, ref, ts}
// Associer un crédit Qonto à une facture client y ajoute le règlement (mode Virement) ;
// associer un débit à une facture fournisseur y ajoute le règlement fournisseur.
let rapproFiltre="arapprocher";
function rpE(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function rpNorm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
function rpCents(n){return Math.round((Number(n)||0)*100);}
function rpDate(t){return String(t.date||"").slice(0,10)||getToday();}
// Documents encore à régler, dans le sens de la transaction
function rpCandidats(t){
  if(t.sens==="debit"){
    return FACFOURN.filter(f=>f.statut!=="brouillon"&&ffReste(f)>0).map(f=>({type:"ff",id:f.id,ref:f.num,tiers:f.four||"",reste:ffReste(f),refs:[f.num,f.numFour].filter(Boolean),date:f.date||""}));
  }
  const L=FACTURES.filter(f=>facEnCompta(f)&&!["brouillon","annulee"].includes(f.statut)&&facStatutReel(f)!=="payee"&&facReste(f)>0).map(f=>{
    const cli=CLIENTS.find(c=>c.id===f.clientId)||CLIENTS.find(c=>c.nom===f.client);
    return {type:"fac",id:f.id,ref:f.num,tiers:f.client||(cli&&cli.nom)||"",contact:cli&&cli.contact||"",reste:facReste(f),refs:[f.num],date:facDate(f)||""};});
  BCCLIENTS.filter(b=>b.statut!=="facture"&&bccReste(b)>0).forEach(b=>{const cli=CLIENTS.find(c=>c.id===b.clientId);
    L.push({type:"bcc",id:b.id,ref:b.num,tiers:cli?cli.nom:"",contact:cli&&cli.contact||"",reste:bccReste(b),refs:[b.num,b.devisNum].filter(Boolean),date:b.date||""});});
  return L;
}
// Score de ressemblance : référence citée dans le libellé, montant identique, nom du client
function rpSuggestions(t){
  const lib=rpNorm(t.libelle),libC=lib.replace(/ /g,"");
  const m=rpCents(t.montant);
  return rpCandidats(t).map(d=>{
    let s=0;const raisons=[];
    if(d.refs.some(r=>r&&libC.includes(rpNorm(r).replace(/ /g,"")))){s+=100;raisons.push("référence");}
    else{const num=(d.ref.match(/(\d+)$/)||[])[1];if(num&&num.length>=3&&new RegExp("(^|\\D)0*"+Number(num)+"(\\D|$)").test(lib)&&d.ref.slice(0,3)&&lib.includes(rpNorm(d.ref.split("-")[0]))){s+=60;raisons.push("n°");}}
    if(rpCents(d.reste)===m){s+=60;raisons.push("montant");}
    const mots=[...rpNorm(d.tiers).split(" "),...rpNorm(d.contact).split(" ")].filter(w=>w.length>=4&&!["sarl","sas","eurl","maison","societe","entreprise"].includes(w));
    if(mots.some(w=>lib.includes(w))){s+=40;raisons.push("nom");}
    return {...d,score:s,raisons};
  }).filter(d=>d.score>0).sort((a,b)=>b.score-a.score);
}
function rpLibelleDoc(r){
  if(!r) return "";
  if(r.type==="ignore") return "Ignorée";
  return r.ref||"";
}
function rpEtat(t){return RAPPRO[t.id]||null;}

function renderRapprochement(transactions){
  const tx=transactions.filter(t=>t.id&&t.statut!=="refusée"&&dateEnCompta(String(t.date||"").slice(0,10)));
  const nonRap=tx.filter(t=>!rpEtat(t));
  const credits=nonRap.filter(t=>t.sens!=="debit");
  const sure=credits.map(t=>({t,s:rpSuggestions(t)[0]})).filter(o=>o.s&&o.s.score>=100&&o.s.raisons.includes("montant")||o.s&&o.s.score>=160);
  const L=rapproFiltre==="arapprocher"?nonRap:rapproFiltre==="rapproches"?tx.filter(t=>rpEtat(t)&&rpEtat(t).type!=="ignore"):tx;
  const chip=(v,l,n)=>`<button onclick="rapproFiltre='${v}';document.getElementById('content').innerHTML=renderBanque()" style="padding:6px 12px;border-radius:999px;border:1.5px solid ${rapproFiltre===v?TH.c1:"#e2e8f0"};background:${rapproFiltre===v?TH.c1:"#fff"};color:${rapproFiltre===v?"#fff":"#475569"};cursor:pointer;font-size:12px;font-weight:700;font-family:'Inter',sans-serif">${l}${n!=null?` · ${n}`:""}</button>`;
  return `<div class="section-card">
    <div class="section-head">
      <div><div class="section-title">🔗 Rapprochement bancaire</div><div class="section-sub">Associez chaque opération Qonto à sa facture : le règlement est enregistré automatiquement</div></div>
      ${sure.length?`<button class="btn-add" style="background:#15803d;color:#fff" onclick="rapproAuto()">⚡ Valider ${sure.length} correspondance(s) sûre(s)</button>`:""}
    </div>
    <div style="padding:10px 20px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)">
      ${chip("arapprocher","À rapprocher",nonRap.length)}${chip("rapproches","Rapprochées",tx.filter(t=>rpEtat(t)&&rpEtat(t).type!=="ignore").length)}${chip("toutes","Toutes",tx.length)}
    </div>
    <div style="padding:4px 20px 14px">
      ${L.length===0?`<div style="padding:22px 0;text-align:center;color:#94a3b8;font-size:13px">${rapproFiltre==="arapprocher"?"✓ Tout est rapproché.":"Aucune opération."}</div>`:L.map(rpLigneHTML).join("")}
    </div>
  </div>`;
}
function rpLigneHTML(t){
  const r=rpEtat(t);
  const sug=r?null:rpSuggestions(t)[0];
  const debit=t.sens==="debit";
  let action;
  if(r&&r.type==="ignore") action=`<button class="btn-sm" onclick="rapproDefaire('${rpE(t.id)}')">Ignorée · annuler</button>`;
  else if(r) action=`<button class="btn-sm" style="border-color:#86efac;background:#f0fdf4;color:#15803d" onclick="rapproDetail('${rpE(t.id)}')">✓ ${rpE(r.ref)}</button>`;
  else action=`${sug?`<button class="btn-sm" style="border-color:${TH.c1}55;background:${TH.c1}12;color:${TH.c1};font-weight:700" onclick="rapproAssocier('${rpE(t.id)}','${sug.type}','${sug.id}')" title="${rpE(sug.raisons.join(", "))}">${sug.score>=100?"⚡":"?"} ${rpE(sug.ref)}${sug.tiers?" · "+rpE(sug.tiers.slice(0,18)):""}</button>`:""}
    <button class="btn-sm" onclick="rapproChoisir('${rpE(t.id)}')">${sug?"Autre…":"Associer…"}</button>`;
  return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap">
    <div style="min-width:0;flex:1 1 180px">
      <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${rpE(t.libelle||"—")}</div>
      <div style="font-size:11px;color:#64748b">${fDateTrans(t.date)}${t.statut?" · "+rpE(t.statut):""}${t.compte?" · "+rpE(t.compte):""}</div>
    </div>
    <div style="font-weight:800;font-size:13.5px;color:${debit?"#991b1b":"#15803d"};white-space:nowrap">${fMontantSigne(t)}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">${action}</div>
  </div>`;
}
function rpTrouverTx(id){return ((BANQUE_DATA&&BANQUE_DATA.transactions)||[]).find(t=>String(t.id)===String(id));}
// Enregistre le règlement dans le document et note le rapprochement
function rapproAssocier(txId,type,docId,silencieux){
  const t=rpTrouverTx(txId);if(!t)return false;
  if(RAPPRO[txId]&&RAPPRO[txId].type!=="ignore"){if(!silencieux)alert("Cette opération est déjà rapprochée.");return false;}
  const montant=Math.round(Number(t.montant)*100)/100,date=rpDate(t);
  let doc,ref,reste;
  if(type==="fac"){doc=FACTURES.find(x=>x.id===docId);reste=doc&&facReste(doc);}
  else if(type==="bcc"){doc=BCCLIENTS.find(x=>x.id===docId);reste=doc&&bccReste(doc);}
  else if(type==="ff"){doc=FACFOURN.find(x=>x.id===docId);reste=doc&&ffReste(doc);}
  if(!doc)return false;
  ref=doc.num;
  if(!silencieux&&rpCents(montant)>rpCents(reste)+1&&!confirm(`Le virement (${fMoney(montant)}) dépasse le reste dû sur ${ref} (${fMoney(reste)}).\nL'associer quand même ?`))return false;
  doc.paiements=doc.paiements||[];
  doc.paiements.push({date,montant,mode:type==="ff"?(t.categorie&&/card|carte/i.test(t.categorie)?"CB":"Virement"):"Virement",qontoId:String(txId)});
  if(type==="fac"){if(facEstPayee(doc))doc.statut="payee";else if(facPaye(doc)>0&&doc.statut!=="payee")doc.statut="partiel";}
  RAPPRO[txId]={type,id:docId,ref,ts:new Date().toISOString()};
  logActivity("Rapprochement bancaire",`${fMoney(montant)} du ${fDate(date)} → ${ref}`);
  if(!silencieux){saveData();closeModal();document.getElementById("content").innerHTML=renderBanque();renderNav();}
  return true;
}
function rapproAuto(){
  const credits=((BANQUE_DATA&&BANQUE_DATA.transactions)||[]).filter(t=>t.id&&t.sens!=="debit"&&!rpEtat(t)&&t.statut!=="refusée");
  const plan=credits.map(t=>({t,s:rpSuggestions(t)[0]})).filter(o=>o.s&&o.s.score>=100&&o.s.raisons.includes("montant")||o.s&&o.s.score>=160);
  // un document ne reçoit qu'un seul virement automatique
  const pris=new Set();const ok=plan.filter(o=>{const k=o.s.type+o.s.id;if(pris.has(k))return false;pris.add(k);return true;});
  if(!ok.length)return;
  if(!confirm(`Valider ces ${ok.length} rapprochement(s) ?\n\n`+ok.map(o=>`• ${fMoney(o.t.montant)} « ${String(o.t.libelle).slice(0,40)} » → ${o.s.ref}`).join("\n")))return;
  let n=0;ok.forEach(o=>{if(rapproAssocier(o.t.id,o.s.type,o.s.id,true))n++;});
  saveData();document.getElementById("content").innerHTML=renderBanque();renderNav();
  alert(`✅ ${n} règlement(s) enregistré(s).`);
}
function rapproChoisir(txId){
  const t=rpTrouverTx(txId);if(!t)return;
  const sugg=rpSuggestions(t);
  const tous=rpCandidats(t).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const ids=new Set(sugg.map(s=>s.type+s.id));
  const ligne=d=>`<button onclick="rapproAssocier('${rpE(txId)}','${d.type}','${d.id}')" style="display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:10px;border:1.5px solid ${d.score>=100?TH.c1+"66":"#e2e8f0"};background:#fff;cursor:pointer;text-align:left;font-family:'Inter',sans-serif">
      <span style="font-size:16px">${d.type==="ff"?"📥":d.type==="bcc"?"📋":"🧾"}</span>
      <span style="flex:1;min-width:0"><span style="font-weight:700;font-size:13px;color:${TH.c1}">${rpE(d.ref)}</span> <span style="font-size:12.5px;color:#1A2118">${rpE(d.tiers)}</span>
        ${d.raisons&&d.raisons.length?`<br/><span style="font-size:11px;color:#15803d">Correspond : ${rpE(d.raisons.join(", "))}</span>`:""}</span>
      <span style="font-weight:700;font-size:13px;white-space:nowrap">reste ${fMoney(d.reste)}</span></button>`;
  showModal(`${t.sens==="debit"?"Débit":"Crédit"} de ${fMontantSigne(t)}`,`
    <div style="background:#F7F4ED;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px"><strong>${rpE(t.libelle)}</strong><br/><span style="color:#64748b">${fDateTrans(t.date)}${t.compte?" · "+rpE(t.compte):""}</span></div>
    ${sugg.length?`<div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Suggestions</div>${sugg.slice(0,5).map(ligne).join("")}`:""}
    <div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em;margin:12px 0 6px">${t.sens==="debit"?"Factures fournisseurs à payer":"Factures et acomptes clients à encaisser"}</div>
    <input placeholder="🔍 Filtrer…" oninput="const q=this.value.toLowerCase();document.querySelectorAll('#rp-liste>button').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'flex':'none')" style="width:100%;padding:9px 12px;border-radius:9px;border:1.5px solid #e2e8f0;font-size:13px;margin-bottom:8px;box-sizing:border-box"/>
    <div id="rp-liste" style="max-height:40vh;overflow-y:auto">${tous.filter(d=>!ids.has(d.type+d.id)).map(d=>ligne({...d,raisons:[]})).join("")||`<div style="padding:14px;text-align:center;color:#94a3b8;font-size:13px">Aucun document en attente de règlement.</div>`}</div>`,
    `<button class="btn-cancel" style="margin-right:auto" onclick="rapproIgnorer('${rpE(txId)}')">Ignorer cette opération</button>
     <button class="btn-cancel" onclick="closeModal()">Fermer</button>`);
}
function rapproIgnorer(txId){
  RAPPRO[txId]={type:"ignore",ts:new Date().toISOString()};
  saveData();closeModal();document.getElementById("content").innerHTML=renderBanque();
}
function rapproDetail(txId){
  const t=rpTrouverTx(txId),r=RAPPRO[txId];if(!t||!r)return;
  showModal("Opération rapprochée",`
    <div style="background:#F7F4ED;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px"><strong>${rpE(t.libelle)}</strong><br/><span style="color:#64748b">${fDateTrans(t.date)} · ${fMontantSigne(t)}</span></div>
    <div style="font-size:14px">Associée à <strong style="color:${TH.c1}">${rpE(r.ref)}</strong> le ${fDate((r.ts||"").slice(0,10))}.</div>
    <div style="font-size:12px;color:#64748b;margin-top:6px">Dissocier supprime aussi le règlement enregistré sur ce document.</div>`,
    `<button class="btn-cancel" style="color:#991b1b;border-color:#fecaca;margin-right:auto" onclick="rapproDefaire('${rpE(txId)}')">Dissocier</button>
     <button class="btn-cancel" onclick="closeModal()">Fermer</button>
     ${r.type==="fac"?`<button class="btn-save" style="background:${TH.c1}" onclick="modalPaiement('${r.id}')">Voir la facture</button>`:r.type==="ff"?`<button class="btn-save" style="background:${TH.c1}" onclick="modalPaiementFF('${r.id}')">Voir la facture</button>`:""}`);
}
function rapproDefaire(txId){
  const r=RAPPRO[txId];if(!r)return;
  if(r.type!=="ignore"){
    const doc=r.type==="fac"?FACTURES.find(x=>x.id===r.id):r.type==="bcc"?BCCLIENTS.find(x=>x.id===r.id):FACFOURN.find(x=>x.id===r.id);
    if(doc&&doc.paiements){doc.paiements=doc.paiements.filter(p=>String(p.qontoId||"")!==String(txId));
      if(r.type==="fac"&&!facEstPayee(doc)&&doc.statut==="payee")doc.statut=facPaye(doc)>0?"partiel":"envoyee";}
    logActivity("Rapprochement annulé",r.ref||"");
  }
  delete RAPPRO[txId];
  saveData();closeModal();document.getElementById("content").innerHTML=renderBanque();renderNav();
}

function addPaiement(id){
  const montant=parseFloat(document.getElementById("pay-montant").value)||0;
  const date=document.getElementById("pay-date").value||TODAY;
  const mode=document.getElementById("pay-mode").value;
  if(montant<=0){alert("Montant invalide");return;}
  const f=FACTURES.find(x=>x.id===id);if(!f)return;
  if(!f.paiements)f.paiements=[];
  f.paiements.push({date,montant,mode});
  // Mise à jour automatique du statut
  if(facEstPayee(f))f.statut="payee";
  else if(facPaye(f)>0&&f.statut!=="payee")f.statut="partiel";
  logActivity("Paiement enregistré",`${fMoney(montant)} sur ${f.num} (${mode})`);
  // Le modal reste ouvert pour permettre d'enchaîner plusieurs règlements (modes différents)
  modalPaiement(id);renderPage();renderNav();
}
function delPaiement(id,idx){
  const f=FACTURES.find(x=>x.id===id);if(!f||!f.paiements)return;
  if(!confirm("Supprimer ce paiement ?"))return;
  f.paiements.splice(idx,1);
  if(!facEstPayee(f)&&f.statut==="payee")f.statut=facPaye(f)>0?"partiel":"envoyee";
  logActivity("Paiement supprimé",f.num);
  modalPaiement(id);renderPage();renderNav();
}

// ── RELANCES AUTOMATIQUES : moteur commun (appli + serveur) ──
// ══════════════════════════════════════════════════════════
// Même code dans app.html (aperçu) et dans la fonction Supabase « relances-auto »
// (envoi). Ne dépend de rien : reçoit les données, la date du jour et les clés
// déjà envoyées, et renvoie la liste des e-mails à envoyer aujourd'hui.
// ── SIGNATURE DES E-MAILS : même code dans app.html (aperçu) et dans « relances-auto » (envoi) ──
const SigMail=(function(){
  const e=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  function cfg(TH,uid){
    TH=TH||{};
    const s=Object.assign({},TH.sigMail||{});
    // signature personnelle de l'utilisateur qui envoie (nom, fonction, téléphones, e-mail)
    const u=uid&&TH.sigMailUsers&&TH.sigMailUsers[uid];
    if(u&&u.actif!==false) ["nom","poste","tel1","tel2","email"].forEach(k=>{if(u[k]!==undefined&&String(u[k]).trim()!=="")s[k]=u[k];else if(k==="tel2"&&u.tel1)s.tel2=u.tel2||"";});
    return {actif:s.actif!==false&&!!TH.sigMail,nom:s.nom||"",poste:s.poste||"",
      societe:s.societe||((TH.nom||"")+" "+(TH.sous||"")).trim(),
      tel1:s.tel1!==undefined?s.tel1:(TH.tel||""),tel2:s.tel2||"",
      email:s.email!==undefined?s.email:(TH.email||""),site:s.site!==undefined?s.site:(TH.site||""),
      adresse:s.adresse!==undefined?s.adresse:(TH.adresse||""),logoUrl:s.logoUrl||"",slogan:s.slogan||"",
      couleur:TH.c1||"#3286A0"};
  }
  // Nom placé sous « Cordialement, » dans le texte quand la signature riche est active
  function court(TH,uid){const c=cfg(TH,uid);return c.nom||c.societe;}
  function lienSite(u){u=String(u||"").trim();if(!u)return"";return /^https?:\/\//i.test(u)?u:"https://"+u;}
  function siteAffiche(u){return String(u||"").replace(/^https?:\/\//i,"").replace(/\/$/,"");}
  function html(TH,uid){
    const c=cfg(TH,uid);if(!c.actif)return"";
    const a=(href,txt)=>`<a href="${e(href)}" style="color:#1A2118;text-decoration:none">${e(txt)}</a>`;
    const tels=[c.tel1,c.tel2].filter(Boolean).map(t=>a("tel:"+t.replace(/[^\d+]/g,""),t)).join(" &nbsp;·&nbsp; ");
    const lignes=[
      tels?`<div>📞 ${tels}</div>`:"",
      c.email?`<div>✉️ ${a("mailto:"+c.email,c.email)}</div>`:"",
      c.site?`<div>🌐 <a href="${e(lienSite(c.site))}" style="color:${c.couleur};text-decoration:none;font-weight:bold">${e(siteAffiche(c.site))}</a></div>`:"",
      c.adresse?`<div style="color:#64748b;font-size:12px">📍 ${e(c.adresse)}</div>`:""
    ].join("");
    return `<table cellpadding="0" cellspacing="0" border="0" style="margin-top:22px;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#1A2118">
<tr>${c.logoUrl?`<td style="padding:4px 16px 4px 0;border-right:3px solid ${c.couleur};vertical-align:middle"><img src="${e(c.logoUrl)}" alt="${e(c.societe)}" width="80" style="display:block;width:80px;height:auto;border:0"></td>`:""}
<td style="padding:4px 0 4px ${c.logoUrl?16:0}px;vertical-align:middle${c.logoUrl?"":";border-left:3px solid "+c.couleur+";padding-left:14px"}">
${c.nom?`<div style="font-weight:bold;font-size:15px">${e(c.nom)}</div>`:""}
<div style="color:${c.couleur};font-weight:bold;font-size:${c.nom?12:15}px">${e([c.poste,c.societe].filter(Boolean).join(" · "))}</div>
${c.slogan?`<div style="color:#64748b;font-size:12px;font-style:italic">${e(c.slogan)}</div>`:""}
<div style="margin-top:6px">${lignes}</div>
</td></tr></table>`;
  }
  function texte(TH,uid){
    const c=cfg(TH,uid);if(!c.actif)return"";
    return ["--",c.nom,[c.poste,c.societe].filter(Boolean).join(" · "),[c.tel1,c.tel2].filter(Boolean).join(" · "),c.email,siteAffiche(c.site),c.adresse].filter(Boolean).join("\n");
  }
  return {cfg,court,html,texte};
})();

const RelancesCore=(function(){
  const DEFAUT={
    actif:false,
    copie:true,
    factures:{actif:true,j1:7,j2:15,j3:15,miseEnDemeure:false},
    contrats:{reconduction:true,visites:true,visitesJours:7},
    prospects:{actif:true},
    clients:{actif:true},
    objetSuivi:"Nous revenons vers vous",
    texteSuivi:"Bonjour {contact},\n\nNous revenons vers vous suite à notre dernier échange et souhaitions savoir si vous aviez des questions ou des besoins concernant votre projet.\n\nNous restons à votre disposition pour en parler.\n\nCordialement,"
  };
  const FENETRE=3; // jours de rattrapage pour une relance datée (si l'envoi d'un jour a été manqué)
  const MAX_PAR_PASSAGE=40;

  function config(TH){
    const c=(TH&&TH.relancesAuto)||{};
    return {...DEFAUT,...c,
      factures:{...DEFAUT.factures,...(c.factures||{})},
      contrats:{...DEFAUT.contrats,...(c.contrats||{})},
      prospects:{...DEFAUT.prospects,...(c.prospects||{})},
      clients:{...DEFAUT.clients,...(c.clients||{})}};
  }

  // ── Dates (chaînes AAAA-MM-JJ, midi local pour éviter les décalages) ──
  function ymd(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
  function addDays(d,n){const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return ymd(x);}
  function diff(a,b){return Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/86400000);} // a - b en jours
  function shiftMonths(d,n){if(!d)return"";const x=new Date(d+"T12:00:00");const j=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const dern=new Date(x.getFullYear(),x.getMonth()+1,0,12).getDate();x.setDate(Math.min(j,dern));return ymd(x);}
  function addMonths(d,n){if(!d)return"";const x=new Date(d+"T12:00:00");const j=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const dern=new Date(x.getFullYear(),x.getMonth()+1,0,12).getDate();if(j>dern){x.setDate(dern);}else{x.setDate(j);x.setDate(x.getDate()-1);}return ymd(x);}
  const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  function dateLongue(d){if(!d)return"—";const [y,m,j]=d.split("-").map(Number);return (j===1?"1er":j)+" "+MOIS[m-1]+" "+y;}
  function euros(n){const v=Math.round(Number(n||0)*100)/100;const [e,c]=v.toFixed(2).split(".");return e.replace(/\B(?=(\d{3})+(?!\d))/g," ")+(c==="00"?"":","+c)+" €";}

  // ── Factures ──
  function tauxTVA(f){return(f.tva!==undefined&&f.tva!==null)?f.tva:20;}
  function ht(f){if(f.lignes&&f.lignes.length)return f.lignes.reduce((s,l)=>s+(l.qte||0)*(l.pu||0),0);return Math.round((f.ttc||0)/(1+tauxTVA(f)/100));}
  function ttc(f){if(f.lignes&&f.lignes.length)return ht(f)*(1+tauxTVA(f)/100);return f.ttc||0;}
  function paye(f){return(f.paiements||[]).reduce((s,p)=>s+(p.montant||0),0);}
  function reste(f){return Math.max(0,Math.round((ttc(f)-paye(f))*100)/100);}
  const LIB_FAC=["","1ère relance","2ème relance","Mise en demeure"];

  // ── Contrats (mêmes règles que la fiche client) ──
  function echeance(x,today){let fin=x.dateFin;if(!fin)return"";for(let i=0;i<30&&!x.resilie&&fin<today;i++)fin=addMonths(addDays(fin,1),12);return fin;}
  function infoL215(x,today){
    if(x.version!=="part"||x.resilie||!x.dateFin)return null;
    const ech=echeance(x,today),limite=shiftMonths(ech,-1);
    const debut=shiftMonths(limite,-3),fin=shiftMonths(limite,-1);
    const envoye=(x.infoReconduction||{})[ech];
    if(envoye)return{ech,limite,debut,fin,etat:"envoye"};
    if(today<debut)return null;
    return{ech,limite,debut,fin,etat:today<=fin?"afaire":"retard"};
  }

  function signature(TH){
    if(SigMail.cfg(TH).actif) return SigMail.court(TH); // la signature complète est ajoutée sous le message
    const nom=((TH.nom||"")+" "+(TH.sous||"")).trim();
    const coord=[TH.tel,TH.email].filter(Boolean).join(" · ");
    return nom+(coord?"\n"+coord:"");
  }
  function trouverClient(data,id,nom){
    const L=data.CLIENTS||[];
    return L.find(c=>id&&c.id===id)||L.find(c=>nom&&c.nom===nom)||null;
  }
  function emailOk(e){return typeof e==="string"&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim());}

  // data : objet app_data · today : "AAAA-MM-JJ" · envoyees : Map clé → date d'envoi (AAAA-MM-JJ) des relances déjà parties
  // Renvoie {aEnvoyer:[…], sansEmail:[…]}
  function calculer(data,today,envoyees){
    const TH=data.TH||{};
    const cfg=config(TH);
    const sig=signature(TH);
    const out=[],sansEmail=[];
    const deja=k=>envoyees&&envoyees.has(k);
    const ajouter=(r,email)=>{if(deja(r.cle))return;if(!emailOk(email)){sansEmail.push(r);return;}out.push({...r,email:email.trim()});};

    // 1. Factures impayées
    if(cfg.factures.actif){
      (data.FACTURES||[]).forEach(f=>{
        if(["brouillon","annulee","payee"].includes(f.statut)||!f.ech||f.ech>=today)return;
        const r=reste(f);if(r<=0)return;
        // Relances déjà faites : saisies à la main (f.relances) ou envoyées automatiquement
        const faites=(f.relances||[]).map((x,i)=>({n:x.niveau||i+1,date:x.date||""}));
        [1,2,3].forEach(n=>{const k=`fac:${f.id}:${n}`;if(deja(k)&&!faites.some(x=>x.n===n))faites.push({n,date:(envoyees.get&&envoyees.get(k))||today});});
        const nMax=faites.reduce((m,x)=>Math.max(m,x.n),0);
        const derniere=faites.reduce((m,x)=>x.date>m?x.date:m,"");
        const n=nMax+1;
        if(n>3||(n===3&&!cfg.factures.miseEnDemeure))return;
        const due=n===1?addDays(f.ech,cfg.factures.j1):addDays(derniere||f.ech,n===2?cfg.factures.j2:cfg.factures.j3);
        if(today<due)return;
        const cli=trouverClient(data,f.clientId,f.client);
        const contact=cli&&cli.contact?cli.contact:"Madame, Monsieur";
        const retard=diff(today,f.ech);
        let sujet,texte;
        if(n===1){
          sujet=`Relance amiable — Facture ${f.num}`;
          texte=`Bonjour ${contact},\n\nSauf erreur ou omission de notre part, il nous semble que la facture ${f.num} d'un montant de ${euros(r)} (échéance du ${dateLongue(f.ech)}) n'a pas encore été réglée.\n\nNous vous remercions de bien vouloir procéder à son règlement dans les meilleurs délais ou de nous contacter si vous avez la moindre question. Si votre règlement a été effectué entre-temps, merci de ne pas tenir compte de ce message.\n\nCordialement,\n${sig}`;
        }else if(n===2){
          sujet=`2ème relance — Facture ${f.num} impayée`;
          texte=`Bonjour ${contact},\n\nNous revenons vers vous concernant la facture ${f.num} d'un montant de ${euros(r)}, dont l'échéance est dépassée depuis ${retard} jour(s) (${dateLongue(f.ech)}).\n\nMalgré notre première relance, nous n'avons pas reçu votre règlement. Merci de procéder au paiement sans délai ou de nous contacter pour convenir d'un arrangement.\n\nÀ défaut de réponse sous 8 jours, nous serons contraints d'engager une procédure de recouvrement.\n\nCordialement,\n${sig}`;
        }else{
          sujet=`Mise en demeure — Facture ${f.num}`;
          texte=`Bonjour ${contact},\n\nEn l'absence de règlement de la facture ${f.num} d'un montant de ${euros(r)} malgré nos relances successives, nous vous mettons en demeure de procéder au paiement de cette somme dans un délai de 8 jours à compter de la réception de ce message.\n\nPassé ce délai, nous nous réservons le droit d'engager toute procédure judiciaire nécessaire au recouvrement de cette créance.\n\nCordialement,\n${sig}`;
        }
        ajouter({cle:`fac:${f.id}:${n}`,type:"facture",niveau:n,libelle:LIB_FAC[n],refId:f.id,client:f.client||(cli&&cli.nom)||"",sujet,texte},cli&&cli.email);
      });
    }

    // 2. Contrats : information avant reconduction (particuliers) + rappel des visites
    if(cfg.contrats.reconduction){
      (data.CLIENTS||[]).forEach(c=>(c.contratsSignes||[]).forEach(x=>{
        const i=infoL215(x,today);if(!i||i.etat==="envoye")return;
        const prest=((TH.nom||"")+" "+(TH.sous||"")).trim();
        const moyens=`par lettre recommandée avec accusé de réception adressée à ${prest}${TH.contratSiege?", "+TH.contratSiege:""}${TH.email?", ou par courrier électronique à "+TH.email:""}`;
        const prix=Number(x.prixHT||0),prixTTC=Math.round(prix*1.085*100)/100;
        const sujet="Information sur la reconduction de votre contrat de maintenance";
        const texte=`Madame, Monsieur,\n\nLe contrat de maintenance de votre système de vidéosurveillance${x.forfaitLabel?` (forfait ${x.forfaitLabel})`:""}, conclu le ${dateLongue(x.dateSignature)}, arrive au terme de sa période en cours le ${dateLongue(i.ech)}.\n\nSauf refus de votre part, il sera reconduit tacitement pour une durée de douze (12) mois, conformément à son article 2, aux conditions en vigueur, soit actuellement ${euros(prix)} HT, soit ${euros(prixTTC)} TTC par mois.\n\nConformément à l'article L. 215-1 du Code de la consommation, nous vous informons que vous pouvez refuser cette reconduction. Il vous suffit de nous faire part de votre décision ${moyens}, au plus tard le :\n\n    ${dateLongue(i.limite).toUpperCase()}\n\nSi vous ne faites rien, votre contrat se poursuivra et nous continuerons à assurer la maintenance de votre installation, dont les visites préventives semestrielles.\n\nNous restons à votre disposition pour toute question et vous prions d'agréer, Madame, Monsieur, l'expression de nos salutations distinguées.\n\n${TH.contratRepresentant||""}${TH.contratQualite?", "+TH.contratQualite:""}\n${sig}`;
        ajouter({cle:`l215:${x.id}:${i.ech}`,type:"reconduction",refId:x.id,clientId:c.id,ech:i.ech,libelle:"Information reconduction",client:c.nom,sujet,texte},c.email);
      }));
    }
    if(cfg.contrats.visites){
      const j=Number(cfg.contrats.visitesJours)||7;
      (data.EVENTS||[]).forEach(e=>{
        if(!e.contratId||!e.date||e.date<today||diff(e.date,today)>j||e.rappelEnvoye===e.date)return;
        const c=trouverClient(data,e.clientId,e.client);
        const contact=c&&c.contact?c.contact:"Madame, Monsieur";
        const sujet=`Rappel : visite de maintenance le ${dateLongue(e.date)}`;
        const texte=`Bonjour ${contact},\n\nDans le cadre de votre contrat de maintenance, notre technicien passera pour la visite préventive de votre système de vidéosurveillance le ${dateLongue(e.date)}${e.heure?" à "+e.heure.replace(":","h"):""}.\n\nMerci de vous assurer que l'accès au matériel (enregistreur, caméras) sera possible. Si ce créneau ne vous convient pas, contactez-nous pour le déplacer.\n\nCordialement,\n${sig}`;
        ajouter({cle:`visite:${e.id}:${e.date}`,type:"visite",refId:e.id,libelle:"Rappel de visite",client:(c&&c.nom)||e.client||"",sujet,texte},c&&c.email);
      });
    }

    // 3. Prospects et clients : à la date de relance prévue
    const suivi=(nom,contact)=>({sujet:cfg.objetSuivi||DEFAUT.objetSuivi,
      texte:String(cfg.texteSuivi||DEFAUT.texteSuivi).replace(/\{contact\}/g,contact||"Madame, Monsieur").replace(/\{entreprise\}/g,nom||"")+"\n"+sig});
    const dansFenetre=d=>d&&d<=today&&diff(today,d)<=FENETRE;
    if(cfg.prospects.actif){
      (data.PROSPECTS||[]).forEach(p=>{
        if(["gagne","perdu"].includes(p.stage)||!dansFenetre(p.date)||p.relanceEnvoyee===p.date)return;
        const m=suivi(p.company||p.name,p.name);
        ajouter({cle:`prosp:${p.id}:${p.date}`,type:"prospect",refId:p.id,libelle:"Relance prospect",client:p.company||p.name||"",...m},p.email);
      });
    }
    if(cfg.clients.actif){
      (data.CLIENTS||[]).forEach(c=>{
        if(!dansFenetre(c.dateRelance)||c.relanceEnvoyee===c.dateRelance)return;
        const m=suivi(c.nom,c.contact);
        ajouter({cle:`cli:${c.id}:${c.dateRelance}`,type:"client",refId:c.id,libelle:"Relance client",client:c.nom||"",...m},c.email);
      });
    }
    return{aEnvoyer:out.slice(0,MAX_PAR_PASSAGE),sansEmail,cfg};
  }

  // Reporte dans les données de l'appli les relances envoyées par le serveur.
  // Renvoie le nombre de modifications (0 = rien de nouveau).
  function reporter(data,lignes){
    let n=0;
    (lignes||[]).forEach(l=>{
      if(l.statut!=="envoye")return;
      const d=(l.created_at||"").slice(0,10);
      const [type,ref,extra]=l.cle.split(":");
      if(type==="fac"){
        const f=(data.FACTURES||[]).find(x=>x.id===ref);if(!f)return;
        f.relances=f.relances||[];
        if(f.relances.some(r=>r.cle===l.cle))return;
        const niv=Number(extra);
        f.relances.push({date:d,niveau:niv,label:LIB_FAC[niv]||"Relance",auto:true,cle:l.cle});n++;
      }else if(type==="l215"){
        (data.CLIENTS||[]).forEach(c=>(c.contratsSignes||[]).forEach(x=>{
          if(x.id!==ref)return;x.infoReconduction=x.infoReconduction||{};
          if(!x.infoReconduction[extra]){x.infoReconduction[extra]=d;n++;}
        }));
      }else if(type==="visite"){
        const e=(data.EVENTS||[]).find(x=>x.id===ref);
        if(e&&e.rappelEnvoye!==extra){e.rappelEnvoye=extra;n++;}
      }else if(type==="prosp"){
        const p=(data.PROSPECTS||[]).find(x=>x.id===ref);
        if(p&&p.relanceEnvoyee!==extra){p.relanceEnvoyee=extra;n++;}
      }else if(type==="cli"){
        const c=(data.CLIENTS||[]).find(x=>x.id===ref);
        if(c&&c.relanceEnvoyee!==extra){c.relanceEnvoyee=extra;n++;}
      }
    });
    return n;
  }

  return{DEFAUT,config,calculer,reporter,dateLongue};
})();


// ── Relances automatiques : historique serveur + réglages ──
let RELANCES_LOG=[];      // lignes de la table relances_log (envoyées par le serveur)
let relancesBusy="";      // "test" | "run" pendant un appel à la fonction

// Récupère l'historique des envois et le reporte dans les factures, contrats, prospects…
async function syncRelancesLog(){
  try{
    if(!currentUser||!currentUser.tenant_id) return 0;
    const {data,error}=await sbClient.from("relances_log")
      .select("cle,statut,created_at,type,niveau,client,email,sujet,erreur")
      .eq("tenant_id",currentUser.tenant_id)
      .order("created_at",{ascending:false}).limit(300);
    if(error){ console.warn("relances_log indisponible:",error.message); return 0; }
    RELANCES_LOG=data||[];
    const n=RelancesCore.reporter(getDataObject(),RELANCES_LOG);
    if(n){ logActivity("Relances automatiques",`${n} envoi(s) reporté(s) dans les fiches`); saveData(); }
    return n;
  }catch(e){ console.warn("syncRelancesLog:",e); return 0; }
}

function relCfg(){ return RelancesCore.config(TH); }
function relSet(chemin,valeur){
  const c=JSON.parse(JSON.stringify(relCfg()));
  const k=chemin.split(".");
  let o=c; for(let i=0;i<k.length-1;i++) o=o[k[i]];
  o[k[k.length-1]]=valeur;
  TH.relancesAuto=c;
  if(chemin==="actif") logActivity("Relances automatiques",valeur?"Activées":"Désactivées");
  saveData(); renderPanel();
}
function relApercu(){
  const envoyees=new Map(RELANCES_LOG.filter(l=>l.statut==="envoye").map(l=>[l.cle,(l.created_at||"").slice(0,10)]));
  return RelancesCore.calculer(getDataObject(),getToday(),envoyees);
}
async function relAppel(action){
  if(relancesBusy) return;
  relancesBusy=action; renderPanel();
  try{
    await syncPush(); // le serveur lit les données en ligne : on envoie d'abord les dernières modifications
    const {data,error}=await sbClient.functions.invoke("relances-auto",{body:{action}});
    let msg=data&&data.error;
    if(error){
      try{ const b=await error.context.json(); msg=b.error||error.message; }catch(_){ msg=error.message; }
    }
    if(msg){ alert("⚠️ "+msg); }
    else if(action==="test"){ alert(`✅ E-mail de test envoyé à ${data.destinataire}. Vérifiez la boîte de réception (et les indésirables).`); }
    else{
      await syncRelancesLog();
      alert(data.detail?`ℹ️ ${data.detail}`:`✅ ${data.envoyes||0} relance(s) envoyée(s)${data.erreurs?` · ${data.erreurs} erreur(s)`:""}.`);
      renderPage();
    }
  }catch(e){ alert("⚠️ "+(e.message||e)); }
  relancesBusy=""; renderPanel();
}

// ── NIVEAUX DE RELANCE ──────────────────────────────────
function niveauRelance(f){
  const retard=Math.abs(daysDiff(f.ech));
  const nb=(f.relances||[]).length;
  if(nb===0&&retard<=15) return 1;
  if(nb<=1&&retard<=30) return 2;
  return 3;
}
function labelRelance(n){return["","1ère relance","2ème relance","Mise en demeure"][n]||"Mise en demeure";}
function colorRelance(n){return["","#b45309","#c2410c","#991b1b"][n]||"#991b1b";}
function bgRelance(n){return["","#fef9c3","#fff7ed","#fef2f2"][n]||"#fef2f2";}
function bordRelance(n){return["","#fcd34d","#fb923c","#fca5a5"][n]||"#fca5a5";}

function texteRelance(f,niveau){
  const cli=CLIENTS.find(c=>c.id===f.clientId)||CLIENTS.find(c=>c.nom===f.client);
  const contact=cli&&cli.contact?cli.contact:"Madame, Monsieur";
  const reste=facReste(f);
  const retard=Math.abs(daysDiff(f.ech));
  const emetteur=TH.nom+(TH.sous?" "+TH.sous:"");
  const email=TH.email||"";
  const tel=TH.tel||"";
  const coordonnees=email||tel?`\n${email}${tel?" · "+tel:""}\n`:"\n";
  if(niveau===1) return `Objet : Relance amiable — Facture ${f.num}\n\nBonjour ${contact},\n\nSauf erreur ou omission de notre part, il nous semble que la facture ${f.num} d'un montant de ${fMoney(reste)} (échéance du ${fDate(f.ech)}) n'a pas encore été réglée.\n\nNous vous remercions de bien vouloir procéder à son règlement dans les meilleurs délais ou de nous contacter si vous avez la moindre question.\n\nCordialement,\n${emetteur}${coordonnees}`;
  if(niveau===2) return `Objet : 2ème relance — Facture ${f.num} impayée\n\nBonjour ${contact},\n\nNous revenons vers vous concernant la facture ${f.num} d'un montant de ${fMoney(reste)}, dont l'échéance est dépassée depuis ${retard} jour(s) (${fDate(f.ech)}).\n\nMalgré notre première relance, nous n'avons pas reçu votre règlement. Merci de procéder au paiement sans délai ou de nous contacter pour convenir d'un arrangement.\n\nÀ défaut de réponse sous 8 jours, nous serons contraints d'engager une procédure de recouvrement.\n\nCordialement,\n${emetteur}${coordonnees}`;
  return `Objet : Mise en demeure — Facture ${f.num}\n\nBonjour ${contact},\n\nEn l'absence de règlement de la facture ${f.num} d'un montant de ${fMoney(reste)} malgré nos relances successives, nous vous mettons en demeure de procéder au paiement de cette somme dans un délai de 8 jours à compter de la réception de ce message.\n\nPassé ce délai, nous nous réservons le droit d'engager toute procédure judiciaire nécessaire au recouvrement de cette créance.\n\nCordialement,\n${emetteur}${coordonnees}`;
}

function modalRelancesImpayes(){
  const enRetard=FACTURES.filter(f=>facEnCompta(f)&&facStatutReel(f)==="retard");
  if(enRetard.length===0){alert("Aucune facture en retard");return;}
  showModal("📨 Relances impayés",`
    <div class="info-box" style="margin-bottom:14px">Sélectionnez une facture pour générer le texte de relance adapté au niveau de retard.</div>
    ${enRetard.map(f=>{
      const reste=facReste(f);
      const retard=Math.abs(daysDiff(f.ech));
      const n=niveauRelance(f);
      const derniereRelance=(f.relances||[]).slice(-1)[0];
      return`<div style="border:1.5px solid ${bordRelance(n)};border-radius:12px;margin-bottom:10px;background:${bgRelance(n)};overflow:hidden">
        <div style="display:flex;align-items:center;gap:10px;padding:12px 14px">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="font-size:13px;font-weight:700;color:${colorRelance(n)}">${f.num} · ${f.client}</span>
              <span style="font-size:10px;font-weight:700;background:${colorRelance(n)};color:#fff;padding:2px 8px;border-radius:20px;text-transform:uppercase">${labelRelance(n)}</span>
            </div>
            <div style="font-size:12px;color:${colorRelance(n)};margin-top:3px">${fMoney(reste)} · Retard de ${retard} jour(s)${derniereRelance?" · Dernière relance : "+fDate(derniereRelance.date):""}</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap">
          <button onclick="voirTexteRelance('${f.id}')" style="padding:7px 12px;border-radius:8px;border:1.5px solid ${colorRelance(n)};background:#fff;color:${colorRelance(n)};cursor:pointer;font-size:12px;font-weight:700;font-family:'Inter',sans-serif">📋 Voir & copier</button>
          <button onclick="envoyerRelanceMail('${f.id}')" style="padding:7px 12px;border-radius:8px;border:none;background:${colorRelance(n)};color:#fff;cursor:pointer;font-size:12px;font-weight:700;font-family:'Inter',sans-serif">✉️ Ouvrir dans Mail</button>
          <button onclick="marquerRelanceEnvoyee('${f.id}')" style="padding:7px 12px;border-radius:8px;border:1.5px solid #94a3b8;background:#fff;color:#475569;cursor:pointer;font-size:12px;font-weight:700;font-family:'Inter',sans-serif">✅ Marquer envoyée</button>
        </div>
      </div>`;
    }).join("")}`,
    `<button class="btn-cancel" onclick="closeModal()">Fermer</button>`
  );
}

function voirTexteRelance(id){
  const f=FACTURES.find(x=>x.id===id);if(!f)return;
  const n=niveauRelance(f);
  const texte=texteRelance(f,n);
  const ta=document.createElement("textarea");
  ta.value=texte;ta.style.cssText="width:100%;height:260px;font-size:13px;font-family:'Inter',sans-serif;padding:12px;border-radius:10px;border:1.5px solid #e2e8f0;resize:vertical;line-height:1.6;color:#1A2118;background:#f8fafc";
  const copyBtn=document.createElement("button");
  copyBtn.textContent="📋 Copier le texte";
  copyBtn.style.cssText="margin-top:10px;padding:9px 16px;border-radius:9px;border:none;background:#3286A0;color:#fff;cursor:pointer;font-size:13px;font-weight:700;font-family:'Inter',sans-serif;width:100%";
  copyBtn.onclick=function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(texte).then(()=>{copyBtn.textContent="✅ Copié !";setTimeout(()=>{copyBtn.textContent="📋 Copier le texte";},2000);});
    } else {ta.select();document.execCommand("copy");copyBtn.textContent="✅ Copié !";}
  };
  const wrap=document.createElement("div");wrap.appendChild(ta);wrap.appendChild(copyBtn);
  showModal("📋 "+labelRelance(n)+" — "+f.num,wrap.innerHTML,`<button class="btn-cancel" onclick="closeModal()">Fermer</button>`);
  logActivity("Relance visualisée",f.num);
}

function envoyerRelanceMail(id){
  const f=FACTURES.find(x=>x.id===id);if(!f)return;
  const cli=CLIENTS.find(c=>c.id===f.clientId)||CLIENTS.find(c=>c.nom===f.client);
  const n=niveauRelance(f);
  const texte=texteRelance(f,n);
  const sujet=encodeURIComponent((["","Relance amiable","2ème relance","Mise en demeure"][n]||"Relance")+" — Facture "+f.num);
  const corps=encodeURIComponent(texte);
  const dest=cli&&cli.email?encodeURIComponent(cli.email):"";
  window.open(`mailto:${dest}?subject=${sujet}&body=${corps}`,"_blank");
  logActivity("Relance mail ouvert",f.num);
}

function marquerRelanceEnvoyee(id){
  const f=FACTURES.find(x=>x.id===id);if(!f)return;
  const n=niveauRelance(f);
  if(!f.relances) f.relances=[];
  f.relances.push({date:TODAY,niveau:n,label:labelRelance(n)});
  FACTURES=FACTURES.map(x=>x.id===id?f:x);
  saveData();
  logActivity("Relance marquée envoyée",f.num+" — "+labelRelance(n));
  closeModal();
  setTimeout(()=>modalRelancesImpayes(),100);
}

function copierRelance(id){voirTexteRelance(id);}

function saveTache(id){

function delTache(id){confirmDel("Supprimer cette tâche ?",function(){TACHES=TACHES.filter(t=>t.id!==id);renderPage();renderNav();});}

// ════════════════════════════════════════════════════════
const DBW_DEF={
  hero:      {icon:"👋", label:"En-tête & indicateurs", col:"full"},
  alertes:   {icon:"⚠️", label:"Alertes",               col:"full"},
  agenda:    {icon:"📅", label:"Agenda",                col:"half"},
  taches:    {icon:"✅", label:"Tâches urgentes",       col:"half"},
  trans:     {icon:"🗒️", label:"Transmissions",         col:"full"},
  pipeline:  {icon:"🎯", label:"Pipeline prospects",    col:"full"},
  raccourcis:{icon:"🚀", label:"Accès rapides",         col:"full"}
};
const DBW_ORDRE=["hero","alertes","agenda","taches","trans","pipeline","raccourcis"];
let DBWIDGETS=[];
let dbEditMode=false;

// La disposition est stockée en local, par utilisateur connecté
function dbwKey(){
  const u=(typeof currentUser!=="undefined"&&currentUser&&(currentUser.id||currentUser.login||currentUser.email))||"local";
  return "adsecure_dbwidgets_"+u;
}
function dbwDefaut(){ return DBW_ORDRE.map(id=>({id,on:true,col:DBW_DEF[id].col,reduit:false})); }
// Fusionne la config enregistrée avec les widgets connus (ajoute les nouveaux, retire les obsolètes)
function mergeWidgets(saved){
  const out=[];
  (Array.isArray(saved)?saved:[]).forEach(w=>{
    if(w&&DBW_DEF[w.id]&&!out.some(x=>x.id===w.id))
      out.push({id:w.id,on:w.on!==false,col:(w.col==="half"||w.col==="full")?w.col:DBW_DEF[w.id].col,reduit:!!w.reduit});
  });
  DBW_ORDRE.forEach(id=>{ if(!out.some(x=>x.id===id)) out.push({id,on:true,col:DBW_DEF[id].col,reduit:false}); });
  return out;
}
function loadWidgets(){
  try{ DBWIDGETS=mergeWidgets(JSON.parse(localStorage.getItem(dbwKey())||"null")); }
  catch(e){ DBWIDGETS=dbwDefaut(); }
  if(!DBWIDGETS.length) DBWIDGETS=dbwDefaut();
  return DBWIDGETS;
}
function saveWidgets(){
  try{ localStorage.setItem(dbwKey(),JSON.stringify(DBWIDGETS)); }
  catch(e){ console.warn("Disposition non enregistrée :",e); }
}
function dbwConf(){ if(!DBWIDGETS.length) loadWidgets(); return DBWIDGETS; }
function dbwMove(id,delta){
  const L=dbwConf();
  const i=L.findIndex(w=>w.id===id);
  const j=i+delta;
  if(i<0||j<0||j>=L.length) return;
  [L[i],L[j]]=[L[j],L[i]];
  saveWidgets();renderPage();
}
function dbwToggle(id){
  const w=dbwConf().find(x=>x.id===id); if(!w)return;
  w.on=!w.on; saveWidgets(); renderPage();
}
function dbwLargeur(id){
  const w=dbwConf().find(x=>x.id===id); if(!w)return;
  w.col=w.col==="full"?"half":"full"; saveWidgets(); renderPage();
}
function dbwReduire(id){
  const w=dbwConf().find(x=>x.id===id); if(!w)return;
  w.reduit=!w.reduit; saveWidgets(); renderPage();
}
function dbwReset(){
  confirmDel("Rétablir la disposition par défaut du tableau de bord ?",function(){
    DBWIDGETS=dbwDefaut(); saveWidgets(); renderPage();
  });
}
function dbwEdit(){ dbEditMode=!dbEditMode; renderPage(); }

// ── Barre d'outils d'un widget en mode personnalisation ───────────────────
function dbwBarre(w,i,n){
  return `<div class="db-w-bar">
    <button class="db-w-btn" onclick="dbwMove('${w.id}',-1)" title="Monter"${i===0?" disabled":""}>↑</button>
    <button class="db-w-btn" onclick="dbwMove('${w.id}',1)" title="Descendre"${i===n-1?" disabled":""}>↓</button>
    <button class="db-w-btn" onclick="dbwLargeur('${w.id}')" title="${w.col==="full"?"Passer en demi-largeur":"Passer en pleine largeur"}">${w.col==="full"?"⬛":"◧"}</button>
    <button class="db-w-btn" onclick="dbwToggle('${w.id}')" title="Masquer" style="background:#fee2e2;color:#991b1b">✕</button>
  </div>`;
}

// Les widgets en demi-largeur s'apparient deux par deux ; un demi resté seul
// sur sa ligne s'étire sur toute la largeur pour ne pas laisser de trou.
function dbwClasseLargeur(visibles,i){
  if(visibles[i].col!=="half") return "full";
  let debut=i;
  while(debut>0 && visibles[debut-1].col==="half") debut--;
  // position du widget dans sa série de demis
  const rang=i-debut;
  const serieFin=(()=>{let j=i;while(j+1<visibles.length && visibles[j+1].col==="half") j++;return j;})();
  const taille=serieFin-debut+1;
  // un demi orphelin en fin de série impaire passe en pleine largeur
  if(rang===taille-1 && taille%2===1) return "full";
  return "half";
}
// Mosaïque : chaque widget occupe le nombre de rangées de 8px correspondant à sa
// hauteur réelle, si bien qu'un widget court ne laisse plus de trou sous lui.
let _masonryRaf=null;
function dbwMasonry(){
  const grid=document.querySelector(".db-grid");
  if(!grid) return;
  const uneCol=window.matchMedia("(max-width:620px)").matches;
  grid.querySelectorAll(".db-w").forEach(el=>{
    if(uneCol){ el.style.gridRowEnd=""; return; }
    const h=el.getBoundingClientRect().height;
    el.style.gridRowEnd="span "+Math.max(1,Math.ceil(h/8));
  });
}
function planifierMasonry(){
  if(_masonryRaf) cancelAnimationFrame(_masonryRaf);
  _masonryRaf=requestAnimationFrame(()=>{ dbwMasonry(); requestAnimationFrame(dbwMasonry); });
}
window.addEventListener("resize",()=>{ if(currentPage==="db") planifierMasonry(); });

function pipeFilter(list){
  const q=pipeSearch.toLowerCase().trim();
  if(!q) return list;
  return list.filter(p=>[p.name,p.company,p.email,p.notes].join(" ").toLowerCase().includes(q));
}
function pipeStats(){
  const active=PROSPECTS.filter(p=>p.stage!=="perdu"&&p.stage!=="gagne");
  const won=PROSPECTS.filter(p=>p.stage==="gagne");
  const pipeline=active.reduce((s,p)=>s+p.amount,0);
  const wonAmt=won.reduce((s,p)=>s+p.amount,0);
  const total=PROSPECTS.filter(p=>p.stage==="gagne"||p.stage==="perdu").length;
  const txConv=total>0?Math.round(won.length/total*100):0;
  const urgent=PROSPECTS.filter(p=>p.date&&p.date<=TODAY&&p.stage!=="gagne"&&p.stage!=="perdu").length;
  return{active,won,pipeline,wonAmt,txConv,urgent,total:PROSPECTS.length};
}

function pipeOnDrop(e,stageId){
  e.preventDefault();
  if(!pipeDragId) return;
  PROSPECTS=PROSPECTS.map(p=>p.id===pipeDragId?{...p,stage:stageId}:p);
  pipeDragId=null;saveData();renderPage();

// ── Drag tactile (iPad / mobile) ──────────────────────────────
let pipeTouchMoved=false;
function pipeTouchStart(e,id){
  pipeDragId=id;
  pipeTouchMoved=false;
  const card=e.currentTarget;
  card._holdTimer=setTimeout(()=>{
    card.classList.add("dragging");
    pipeTouchMoved=true; // active le mode déplacement après appui long
    if(navigator.vibrate)navigator.vibrate(30);
  },180);
}
function pipeTouchMove(e){
  if(!pipeDragId)return;
  if(!pipeTouchMoved)return; // pas encore en mode drag → laisser le scroll
  e.preventDefault();
  const t=e.touches[0];
  document.querySelectorAll(".pipe-cards").forEach(c=>c.classList.remove("pipe-drop-over"));
  const el=document.elementFromPoint(t.clientX,t.clientY);
  const col=el&&el.closest?el.closest(".pipe-cards"):null;
  if(col)col.classList.add("pipe-drop-over");
}
function pipeTouchEnd(e){
  const card=e.currentTarget;
  if(card._holdTimer)clearTimeout(card._holdTimer);
  card.classList.remove("dragging");
  if(!pipeDragId||!pipeTouchMoved){pipeDragId=null;return;}
  const t=e.changedTouches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);
  const col=el&&el.closest?el.closest(".pipe-cards"):null;
  document.querySelectorAll(".pipe-cards").forEach(c=>c.classList.remove("pipe-drop-over"));
  if(col){
    const stageId=col.getAttribute("data-stage");
    if(stageId){PROSPECTS=PROSPECTS.map(p=>p.id===pipeDragId?{...p,stage:stageId}:p);saveData();}
  }
  pipeDragId=null;pipeTouchMoved=false;renderPage();
}

                ${b.statut==="en_cours"?`<button class="btn-sm" onclick="bccLivre('${b.id}')" title="Marquer le chantier livré" style="border-color:#fde68a;background:#fffbeb;color:#b45309">🚚</button>`:""}

                <button class="btn-sm btn-danger" onclick="delBCC('${b.id}')">🗑️</button>

    </div>`;

const INPUT_L="padding:8px 10px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:13px;background:#fff;outline:none;font-family:'Inter',sans-serif;min-width:0";
// Bascule l'affichage du descriptif détaillé d'une ligne
function toggleLigneDet(i){
  const l=window._devisLignes[i];
  l._det=!l._det;
  renderDevisLignes();
}
function renderDevisLignes(){
  const box=document.getElementById("dv-lignes");
  if(!box)return;
  const L=window._devisLignes;
  if(L.length===0){box.innerHTML=`<div style="padding:16px;text-align:center;color:#94a3b8;font-size:12.5px">Aucune ligne. Choisissez un produit ci-dessus ou ajoutez une ligne vide.</div>`;updateDevisTotaux();return;}
  box.innerHTML=L.map((l,i)=>{
    const total=(l.qte||0)*(l.pu||0);
    const cout=(l.qte||0)*(l.pa||0);
    const marge=total-cout;
    const pct=total>0?(marge/total*100):0;
    const mCol=marge>0?"#15803d":marge<0?"#991b1b":"#94a3b8";
    const ouvert=l._det||!!(l.det||"").trim();
    return `<div style="border:1.5px solid #e2e8f0;border-radius:10px;padding:9px;margin-bottom:8px;background:#fff">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
        <input value="${(l.ref||"").replace(/"/g,'&quot;')}" placeholder="Réf." oninput="window._devisLignes[${i}].ref=this.value" style="width:82px;${INPUT_L};font-size:11.5px;font-weight:700;color:#64748b;flex-shrink:0"/>
        <input value="${(l.desc||"").replace(/"/g,'&quot;')}" placeholder="Désignation" oninput="window._devisLignes[${i}].desc=this.value;updateDevisTotaux()" style="flex:1;${INPUT_L}"/>
        <button type="button" onclick="toggleLigneDet(${i})" title="Descriptif détaillé" style="width:30px;height:30px;border-radius:7px;border:1.5px solid ${ouvert?TH.c1:"#e2e8f0"};background:${ouvert?TH.c1+"12":"#fff"};color:${ouvert?TH.c1:"#94a3b8"};cursor:pointer;flex-shrink:0;font-size:12px">📄</button>
        <button type="button" onclick="window._devisLignes.splice(${i},1);renderDevisLignes()" style="width:30px;height:30px;border-radius:7px;border:1.5px solid #fecaca;background:#fef2f2;color:#991b1b;cursor:pointer;flex-shrink:0;font-size:13px">✕</button>
      </div>
      ${ouvert?`<textarea placeholder="Descriptif détaillé (imprimé sous la désignation)" oninput="window._devisLignes[${i}].det=this.value" style="width:100%;box-sizing:border-box;${INPUT_L};font-size:12px;min-height:54px;resize:vertical;margin-bottom:6px">${(l.det||"")}</textarea>`:""}
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <input type="number" step="any" value="${l.qte}" placeholder="Qté" oninput="window._devisLignes[${i}].qte=parseFloat(this.value)||0;updateDevisTotaux()" style="width:58px;${INPUT_L};text-align:center;flex-shrink:0"/>
        <input list="dv-unites" value="${(l.unite||"unité").replace(/"/g,'&quot;')}" placeholder="Unité" oninput="window._devisLignes[${i}].unite=this.value" style="width:76px;${INPUT_L};font-size:12px;flex-shrink:0"/>
        <input type="number" step="any" value="${l.pa||0}" placeholder="P.A." title="Prix d'achat HT (interne, non imprimé)" oninput="window._devisLignes[${i}].pa=parseFloat(this.value)||0;updateDevisTotaux()" style="width:70px;${INPUT_L};text-align:right;background:#f8fafc;color:#64748b;flex-shrink:0"/>
        <input type="number" step="any" value="${l.pu}" placeholder="P.U." oninput="window._devisLignes[${i}].pu=parseFloat(this.value)||0;updateDevisTotaux()" style="width:82px;${INPUT_L};text-align:right;font-weight:700;flex-shrink:0"/>
        <div style="flex:1;min-width:110px;text-align:right;font-size:12.5px">
          <span style="font-weight:800;color:${TH.txt}">${fMoney(total)}</span>
          ${cout>0?`<span style="margin-left:7px;font-size:11px;font-weight:700;color:${mCol}">${marge>=0?"+":""}${fMoney(marge)} · ${pct.toFixed(0)} %</span>`:""}
        </div>
      </div>
    </div>`;
  }).join("")+`<datalist id="dv-unites">${UNITES.map(u=>`<option value="${u}"></option>`).join("")}</datalist>`;
  updateDevisTotaux();
}

// Affiche la marge estimée d'un document (devis / facture)
function ligneMarge(ht,cout){
  const m=ht-cout, pct=ht>0?(m/ht*100):0;
  const col=pct>=40?"#15803d":(pct>=20?"#b45309":"#991b1b");
  const bg =pct>=40?"#f0fdf4":(pct>=20?"#fffbeb":"#fef2f2");
  return `<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px;padding:6px 9px;border-radius:8px;background:${bg}">
    <span style="color:#64748b;font-weight:600">Marge estimée</span>
    <span style="font-weight:800;color:${col}">${fMoney(m)} · ${pct.toFixed(0)} %</span>
  </div>`;
}
function updateDevisTotaux(){
  const box=document.getElementById("dv-totaux");
  if(!box)return;
  const tva=parseFloat(document.getElementById("dv-tva")?.value)||0;
  const ht=window._devisLignes.reduce((s,l)=>s+(l.qte||0)*(l.pu||0),0);
  const cout=window._devisLignes.reduce((s,l)=>s+(l.qte||0)*(l.pa||0),0);
  const mtva=ht*tva/100;
  box.innerHTML=`${cout>0?ligneMarge(ht,cout):""}<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="color:#64748b">Total HT</span><span style="font-weight:600">${fMoney(ht)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:#64748b">TVA ${fTaux(tva)}</span><span style="font-weight:600">${fMoney(mtva)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:15px;padding-top:6px;border-top:1px solid #ddd"><span style="font-weight:700;color:${TH.txt}">Total TTC</span><span style="font-weight:800;color:${TH.c1}">${fMoney(ht+mtva)}</span></div>`;
}
function saveDevis(id){
  const clientId=document.getElementById("dv-client").value;
  if(!clientId){alert("Veuillez choisir un client");return;}
  const lignes=window._devisLignes.filter(l=>l.desc||l.pu).map(l=>{const c={...l};delete c._det;return c;});
  if(lignes.length===0){alert("Ajoutez au moins une ligne");return;}
  const obj={

    clientId,
    date:document.getElementById("dv-date").value,

function devisVersFacture(id){
  const d=DEVIS.find(x=>x.id===id);if(!d)return;
  const cli=CLIENTS.find(c=>c.id===d.clientId);
  if(!confirm("Créer une facture à partir de ce devis ?"))return;
  const num=prochainNumero("FAC",FACTURES);
  FACTURES.push({
    id:uid(),num,date:TODAY,
    client:cli?cli.nom:"",
    clientId:d.clientId,
    ech:addDays(TODAY,30),
    statut:"envoyee",
    tva:(d.tva!==undefined&&d.tva!==null)?d.tva:TVA_DEFAUT,
    lignes:JSON.parse(JSON.stringify(d.lignes||[])),  // reprend TOUTES les lignes du devis
    ttc:Math.round(devisTTC(d))
  });
  logActivity("Conversion devis→facture",`${d.num} → ${num} (${(d.lignes||[]).length} ligne(s))`);
  alert(`Facture ${num} créée avec le détail des articles ! Retrouvez-la dans Administration.`);
  renderPage();renderNav();
}

function renderBccCataloguePicker(filter){
  const box=document.getElementById("bcc-cat-picker");
  if(!box)return;
  const chips=document.getElementById("bcc-cat-picker-chips");
  if(chips) chips.innerHTML=renderPickerChips("bcc");
  _pickerProduits=produitsUnifies();
  const filtered=pickerFiltrer(_pickerProduits.map((p,i)=>({...p,idx:i})),filter);
  const cpt=document.getElementById("bcc-cat-picker-cpt");
  if(cpt) cpt.textContent=`${filtered.length} / ${_pickerProduits.length}`;
  if(filtered.length===0){box.innerHTML=`<div style="padding:12px;color:#94a3b8;font-size:12px;width:100%;text-align:center">Aucun produit ne correspond.</div>`;return;}
  box.innerHTML=filtered.map(p=>pickerCard(p,`addProduitToBCC(${p.idx})`)).join("");
}
function addProduitToBCC(idx){
  const p=_pickerProduits[idx];
  if(!p)return;
  const det=[p.marque,p.modele].filter(Boolean).join(" ");
  const ligne={ref:p.ref||"",desc:p.nom,det:(p.desc||"")||(det?det:""),unite:p.unite||"unité",qte:1,pu:p.pu,pa:p.pa||0};
  const empty=window._bccLignes.findIndex(l=>!l.desc&&!l.pu);
  if(empty!==-1){window._bccLignes[empty]=ligne;}else{window._bccLignes.push(ligne);}
  renderBccLignes();
}
function toggleBccLigneDet(i){ window._bccLignes[i]._det=!window._bccLignes[i]._det; renderBccLignes(); }
function addBccLigne(){ window._bccLignes.push({ref:"",desc:"",det:"",unite:"unité",qte:1,pu:0,pa:0}); renderBccLignes(); }
function renderBccLignes(){
  const box=document.getElementById("bcc-lignes");
  if(!box)return;
  const L=window._bccLignes;
  if(L.length===0){box.innerHTML=`<div style="padding:16px;text-align:center;color:#94a3b8;font-size:12.5px">Aucune ligne. Choisissez un produit ci-dessus ou ajoutez une ligne vide.</div>`;updateBccTotaux();return;}
  box.innerHTML=L.map((l,i)=>{
    const total=(l.qte||0)*(l.pu||0);
    const cout=(l.qte||0)*(l.pa||0);
    const marge=total-cout;
    const pct=total>0?(marge/total*100):0;
    const mCol=marge>0?"#15803d":marge<0?"#991b1b":"#94a3b8";
    const ouvert=l._det||!!(l.det||"").trim();
    return `<div style="border:1.5px solid #e2e8f0;border-radius:10px;padding:9px;margin-bottom:8px;background:#fff">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
        <input value="${(l.ref||"").replace(/"/g,'&quot;')}" placeholder="Réf." oninput="window._bccLignes[${i}].ref=this.value" style="width:82px;${INPUT_L};font-size:11.5px;font-weight:700;color:#64748b;flex-shrink:0"/>
        <input value="${(l.desc||"").replace(/"/g,'&quot;')}" placeholder="Désignation" oninput="window._bccLignes[${i}].desc=this.value;updateBccTotaux()" style="flex:1;${INPUT_L}"/>
        <button type="button" onclick="toggleBccLigneDet(${i})" title="Descriptif détaillé" style="width:30px;height:30px;border-radius:7px;border:1.5px solid ${ouvert?TH.c1:"#e2e8f0"};background:${ouvert?TH.c1+"12":"#fff"};color:${ouvert?TH.c1:"#94a3b8"};cursor:pointer;flex-shrink:0;font-size:12px">📄</button>
        <button type="button" onclick="window._bccLignes.splice(${i},1);renderBccLignes()" style="width:30px;height:30px;border-radius:7px;border:1.5px solid #fecaca;background:#fef2f2;color:#991b1b;cursor:pointer;flex-shrink:0;font-size:13px">✕</button>
      </div>
      ${ouvert?`<textarea placeholder="Descriptif détaillé (imprimé sous la désignation)" oninput="window._bccLignes[${i}].det=this.value" style="width:100%;box-sizing:border-box;${INPUT_L};font-size:12px;min-height:54px;resize:vertical;margin-bottom:6px">${(l.det||"")}</textarea>`:""}
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <input type="number" step="any" value="${l.qte}" placeholder="Qté" oninput="window._bccLignes[${i}].qte=parseFloat(this.value)||0;updateBccTotaux()" style="width:58px;${INPUT_L};text-align:center;flex-shrink:0"/>
        <input list="dv-unites" value="${(l.unite||"unité").replace(/"/g,'&quot;')}" placeholder="Unité" oninput="window._bccLignes[${i}].unite=this.value" style="width:76px;${INPUT_L};font-size:12px;flex-shrink:0"/>
        <input type="number" step="any" value="${l.pa||0}" placeholder="P.A." title="Prix d'achat HT (interne, non imprimé)" oninput="window._bccLignes[${i}].pa=parseFloat(this.value)||0;updateBccTotaux()" style="width:70px;${INPUT_L};text-align:right;background:#f8fafc;color:#64748b;flex-shrink:0"/>
        <input type="number" step="any" value="${l.pu}" placeholder="P.U." oninput="window._bccLignes[${i}].pu=parseFloat(this.value)||0;updateBccTotaux()" style="width:82px;${INPUT_L};text-align:right;font-weight:700;flex-shrink:0"/>
        <div style="flex:1;min-width:110px;text-align:right;font-size:12.5px">
          <span style="font-weight:800;color:${TH.txt}">${fMoney(total)}</span>
          ${cout>0?`<span style="margin-left:7px;font-size:11px;font-weight:700;color:${mCol}">${marge>=0?"+":""}${fMoney(marge)} · ${pct.toFixed(0)} %</span>`:""}
        </div>
      </div>
    </div>`;
  }).join("")+`<datalist id="dv-unites">${UNITES.map(u=>`<option value="${u}"></option>`).join("")}</datalist>`;
  updateBccTotaux();
}
function updateBccTotaux(){
  const box=document.getElementById("bcc-totaux");
  if(!box)return;
  const tva=parseFloat(document.getElementById("bcc-tva")?.value)||0;
  const ht=window._bccLignes.reduce((s,l)=>s+(l.qte||0)*(l.pu||0),0);
  const cout=window._bccLignes.reduce((s,l)=>s+(l.qte||0)*(l.pa||0),0);
  const mtva=ht*tva/100;
  box.innerHTML=`${cout>0?ligneMarge(ht,cout):""}<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="color:#64748b">Total HT</span><span style="font-weight:600">${fMoney(ht)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:#64748b">TVA ${fTaux(tva)}</span><span style="font-weight:600">${fMoney(mtva)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:15px;padding-top:6px;border-top:1px solid #ddd"><span style="font-weight:700;color:${TH.txt}">Total TTC</span><span style="font-weight:800;color:${TH.c1}">${fMoney(ht+mtva)}</span></div>`;
}
function saveBCC(id){
  const clientId=document.getElementById("bcc-client").value;
  if(!clientId){alert("Veuillez choisir un client");return;}
  const lignes=window._bccLignes.filter(l=>l.desc||l.pu).map(l=>{const c={...l};delete c._det;return c;});
  if(lignes.length===0){alert("Ajoutez au moins une ligne");return;}
  const obj={
    num:(document.getElementById("bcc-num").value||"").trim(),
    clientId,
    date:document.getElementById("bcc-date").value,
    statut:document.getElementById("bcc-statut").value,
    refChantier:(document.getElementById("bcc-chantier")?.value||"").trim(),

    lignes
  };
  if(id){BCCLIENTS=BCCLIENTS.map(b=>b.id===id?{...b,...obj}:b);logActivity("Modification bon de commande",obj.num);}
  else{BCCLIENTS.push({...obj,id:uid(),devisNum:"",paiements:[]});logActivity("Création bon de commande",obj.num);}
  saveData();
  closeModal();renderPage();renderNav();
}

// ── Bons de commande clients : devis accepté → BC → facture ──────────────
function devisVersBC(id){
  const d=DEVIS.find(x=>x.id===id);if(!d)return;
  const deja=BCCLIENTS.some(b=>b.devisId===id);
  if(!confirm(deja?"Un bon de commande existe déjà pour ce devis. En créer un autre ?":"Valider ce devis et créer le bon de commande ?"))return;
  const num=prochainNumero("BCC",BCCLIENTS);
  BCCLIENTS.push({
    id:uid(),num,
    devisId:d.id,devisNum:d.num,
    clientId:d.clientId,
    refChantier:d.refChantier||"",
    date:TODAY,
    statut:"en_cours",
    tva:(d.tva!==undefined&&d.tva!==null)?d.tva:TVA_DEFAUT,
    lignes:JSON.parse(JSON.stringify(d.lignes||[]))
  });
  DEVIS=DEVIS.map(x=>x.id===id?{...x,statut:"transforme",bccNum:num}:x);
  saveData();
  logActivity("Devis→Bon de commande",`${d.num} → ${num} (devis archivé)`);
  alert(`Bon de commande ${num} créé !\nLe devis ${d.num} a été archivé (filtre « Archives »).`);
  renderPage();renderNav();
}
function bccLivre(id){
  const b=BCCLIENTS.find(x=>x.id===id);if(!b)return;
  if(!confirm("Marquer ce chantier comme livré ? Vous pourrez ensuite le transformer en facture."))return;
  b.statut="livre";
  saveData();
  logActivity("Chantier livré",b.num);
  renderPage();
}
function bccVersFacture(id){
  const b=BCCLIENTS.find(x=>x.id===id);if(!b)return;
  const cli=CLIENTS.find(c=>c.id===b.clientId);
  if(!confirm("Créer la facture à partir de ce bon de commande ?"))return;
  const num=prochainNumero("FAC",FACTURES);
  FACTURES.push({
    id:uid(),num,date:TODAY,
    client:cli?cli.nom:"",
    clientId:b.clientId,
    refChantier:b.refChantier||"",
    ech:addDays(TODAY,30),
    statut:"envoyee",
    tva:(b.tva!==undefined&&b.tva!==null)?b.tva:TVA_DEFAUT,
    lignes:JSON.parse(JSON.stringify(b.lignes||[])),
    paiements:JSON.parse(JSON.stringify(b.paiements||[])),  // reprend les règlements du BC
    ttc:Math.round(devisTTC(b))
  });
  // Statut cohérent avec les règlements repris
  const nf=FACTURES[FACTURES.length-1];
  if(facEstPayee(nf))nf.statut="payee";
  else if(facPaye(nf)>0)nf.statut="partiel";
  b.statut="facture";
  b.factureNum=num;
  saveData();
  logActivity("BC→Facture",`${b.num} → ${num} (BC archivé)`);
  alert(`Facture ${num} créée !\nLe bon de commande ${b.num} a été archivé.`);
  renderPage();renderNav();
}
function delBCC(id){
  const b=BCCLIENTS.find(x=>x.id===id);
  confirmDel("Supprimer ce bon de commande ?",function(){BCCLIENTS=BCCLIENTS.filter(x=>x.id!==id);logActivity("Suppression bon de commande",b?b.num:"");renderPage();});
}

function addPaiementBCC(id){
  const montant=parseFloat(document.getElementById("bcc-pay-montant").value)||0;
  const date=document.getElementById("bcc-pay-date").value||TODAY;
  const mode=document.getElementById("bcc-pay-mode").value;
  if(montant<=0){alert("Montant invalide");return;}
  const b=BCCLIENTS.find(x=>x.id===id);if(!b)return;
  if(!b.paiements)b.paiements=[];
  b.paiements.push({date,montant,mode});
  saveData();
  logActivity("Règlement BC enregistré",`${fMoney(montant)} sur ${b.num} (${mode})`);
  modalPaiementBCC(id);renderPage();
}
function delPaiementBCC(id,idx){
  const b=BCCLIENTS.find(x=>x.id===id);if(!b||!b.paiements)return;
  if(!confirm("Supprimer ce règlement ?"))return;
  b.paiements.splice(idx,1);
  saveData();
  logActivity("Règlement BC supprimé",b.num);
  modalPaiementBCC(id);renderPage();
}

// HTML complet du devis (impression ou conversion en PDF pour l'envoi par e-mail)
// ══════════════════════════════════════════════════════════
// ── SIGNATURE EN LIGNE DES DEVIS ──────────────────────────
// ══════════════════════════════════════════════════════════
// Un lien secret (signer.html?t=…) permet au client de consulter une copie figée du devis
// et de le signer. La preuve est gardée dans la table devis_signatures ; l'appli la récupère
// et passe le devis en « Accepté ».
let SIGN_CACHE={};      // devisId → dernier lien connu (sans la copie du devis ni l'image de signature)
let signSyncTs=0, signSyncEnCours=false;
const SIGN_COLS="id,token,devis_id,devis_num,statut,created_at,expires_at,consulte_le,signe_le,signataire,ip,snapshot_hash,client_email";
function sgE(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function urlSignature(token){return location.href.split("#")[0].split("?")[0].replace(/[^/]*$/,"")+"signer.html?t="+token;}
async function sha256Hex(txt){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}catch(e){return "";}
}
function dtFr(iso){return iso?new Date(iso).toLocaleString("fr-FR",{dateStyle:"medium",timeStyle:"short"}):"—";}

// Crée (ou réutilise si le devis n'a pas changé) le lien de signature d'un devis
async function creerLienSignature(devisId){
  const d=DEVIS.find(x=>x.id===devisId);if(!d) throw new Error("Devis introuvable");
  if(!currentUser||!currentUser.tenant_id) throw new Error("Session invalide, reconnectez-vous.");
  const cli=CLIENTS.find(c=>c.id===d.clientId);
  const html=devisDocHTML(d,false);
  const hash=await sha256Hex(html);
  const {data:exist}=await sbClient.from("devis_signatures").select(SIGN_COLS).eq("devis_id",d.id).eq("statut","en_attente");
  const meme=(exist||[]).find(r=>r.snapshot_hash===hash&&(!r.expires_at||new Date(r.expires_at)>new Date()));
  if(meme){SIGN_CACHE[d.id]=meme;return urlSignature(meme.token);}
  // le devis a changé : les anciens liens sont annulés pour qu'une seule version soit signable
  for(const r of (exist||[])) await sbClient.from("devis_signatures").update({statut:"annule"}).eq("id",r.id);
  const fin=d.validite&&d.validite>=getToday()?d.validite+"T23:59:59":new Date(Date.now()+30*864e5).toISOString();
  const {data,error}=await sbClient.from("devis_signatures").insert({tenant_id:currentUser.tenant_id,devis_id:d.id,devis_num:d.num,
    client_nom:cli?cli.nom:"",client_email:cli&&cli.email||null,montant_ttc:Math.round(devisTTC(d)*100)/100,
    snapshot_html:html,snapshot_hash:hash,expires_at:fin}).select(SIGN_COLS).single();
  if(error) throw new Error(error.message.includes("devis_signatures")?"La signature en ligne n'est pas encore activée sur le serveur.":error.message);
  SIGN_CACHE[d.id]=data;
  d.signEnLigne={id:data.id,cree:getToday()};
  logActivity("Lien de signature créé",`${d.num}${cli?" — "+cli.nom:""}`);
  saveData();
  return urlSignature(data.token);
}

// Récupère les signatures faites par les clients et met les devis à jour
async function syncSignaturesDevis(force){
  if(!currentUser||!currentUser.tenant_id||signSyncEnCours) return;
  if(!force&&Date.now()-signSyncTs<60000) return;
  signSyncEnCours=true;signSyncTs=Date.now();
  try{
    const {data,error}=await sbClient.from("devis_signatures").select(SIGN_COLS).order("created_at",{ascending:true}).limit(1000);
    if(error||!data) return;
    const signes=[];
    SIGN_CACHE={};
    data.forEach(r=>{const prev=SIGN_CACHE[r.devis_id];if(!prev||prev.statut!=="signe"||r.statut==="signe")SIGN_CACHE[r.devis_id]=r;});
    data.filter(r=>r.statut==="signe").forEach(r=>{
      const d=DEVIS.find(x=>x.id===r.devis_id);if(!d)return;
      if(d.signatureElec&&d.signatureElec.id===r.id)return;
      d.signatureElec={id:r.id,date:r.signe_le,nom:r.signataire,ip:r.ip||"",hash:r.snapshot_hash||""};
      if(["brouillon","envoye","expire"].includes(d.statut)) d.statut="accepte";
      logActivity("Devis signé en ligne",`${d.num} par ${r.signataire} le ${dtFr(r.signe_le)}`);
      signes.push(d);
    });
    if(signes.length){
      saveData();renderPage();renderNav();
      setTimeout(()=>alert(`✍️ ${signes.length>1?signes.length+" devis signés":"Devis signé"} en ligne :\n\n`+signes.map(d=>{const c=CLIENTS.find(x=>x.id===d.clientId);return `• ${d.num}${c?" — "+c.nom:""} (signé par ${d.signatureElec.nom})`;}).join("\n")+"\n\nIl"+(signes.length>1?"s sont passés":" est passé")+" en « Accepté »."),300);
    }else if(["devis","client-fiche"].includes(currentPage)){
      // mise à jour des pastilles « consulté / en attente »
      const c=document.getElementById("content");if(c&&!document.querySelector(".modal-overlay"))renderPage();
    }
  }catch(e){}finally{signSyncEnCours=false;}
}
setInterval(()=>{if(document.visibilityState==="visible")syncSignaturesDevis();},120000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncSignaturesDevis();});

// Le PDF est fabriqué dans l'appli (html2canvas + jsPDF), puis la fonction Supabase
// « relances-auto » (action "email") l'envoie depuis l'adresse professionnelle.
const PDF_LIBS=[
  "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
];
let pdfLibsPromise=null;
function chargerLibsPDF(){
  if(pdfLibsPromise) return pdfLibsPromise;
  pdfLibsPromise=PDF_LIBS.reduce((p,src)=>p.then(()=>new Promise((ok,ko)=>{
    const sc=document.createElement("script"); sc.src=src; sc.onload=ok;
    sc.onerror=()=>{pdfLibsPromise=null;ko(new Error("Chargement de l'outil PDF impossible (connexion internet ?)"));};
    document.head.appendChild(sc);
  })),Promise.resolve());
  return pdfLibsPromise;
}
// Convertit un document HTML A4 en PDF (base64, sans en-tête data:)
async function htmlVersPdfBase64(html){
  await chargerLibsPDF();
  const LARG=794, HAUT=1123; // A4 à 96 dpi
  const ifr=document.createElement("iframe");
  ifr.style.cssText=`position:fixed;left:-10000px;top:0;width:${LARG}px;height:${HAUT}px;border:0;visibility:hidden`;
  document.body.appendChild(ifr);
  try{
    await new Promise(ok=>{ ifr.onload=ok; ifr.srcdoc=html; });
    const doc=ifr.contentDocument;
    await Promise.all([...doc.images].map(im=>im.complete?null:new Promise(ok=>{im.onload=im.onerror=ok;})));
    if(doc.fonts&&doc.fonts.ready) await doc.fonts.ready;
    const hauteur=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight);
    ifr.style.height=hauteur+"px";
    const canvas=await html2canvas(doc.body,{scale:2,useCORS:true,backgroundColor:"#ffffff",width:LARG,windowWidth:LARG,height:hauteur,windowHeight:hauteur});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
    const pxParPage=Math.floor(canvas.width*HAUT/LARG);
    const nbPages=Math.max(1,Math.ceil((canvas.height-8)/pxParPage));
    for(let i=0;i<nbPages;i++){
      const h=Math.min(pxParPage,canvas.height-i*pxParPage);
      const part=document.createElement("canvas"); part.width=canvas.width; part.height=h;
      const ctx=part.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,part.width,h);
      ctx.drawImage(canvas,0,i*pxParPage,canvas.width,h,0,0,canvas.width,h);
      if(i>0) pdf.addPage();
      pdf.addImage(part.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,210*h/canvas.width);
    }
    return pdf.output("datauristring").split(",")[1];
  }finally{ ifr.remove(); }
}
