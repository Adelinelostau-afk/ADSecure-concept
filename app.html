<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AD Management</title>
<!-- ══ PWA — Application installable ══ -->
<meta name="theme-color" content="#1A2118"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AD Management"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="apple-touch-icon" href="logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* ══ DESIGN TOKENS — alignés sur le site vitrine ══════════════════════════ */
:root{
  --nuit:#1A2118;
  --teal1:#3286A0;
  --teal2:#299AC3;
  --sand:#DED3BC;
  --cream:#F7F4ED;
  --paper:#FFFFFF;
  --ink:rgba(26,33,24,1);
  --ink2:rgba(26,33,24,0.62);
  --ink3:rgba(26,33,24,0.38);
  --line:rgba(26,33,24,0.1);
  --line-med:rgba(26,33,24,0.15);
  --display:'Lora',Georgia,serif;
  --body:'Inter',-apple-system,sans-serif;
  --sidebar-w:240px;
  --sidebar-collapsed:60px;
  --topbar-h:60px;
  --radius:14px;
  --shadow:0 1px 3px rgba(26,33,24,0.08),0 4px 16px rgba(26,33,24,0.04);
  --shadow-md:0 8px 32px rgba(26,33,24,0.12);
}

/* ══ RESET ════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;width:100%;}
body{font-family:var(--body);background:#F7F4ED;color:#1A2118;min-height:100vh;width:100%;max-width:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
#app-screen{background:#F7F4ED;min-height:100vh;width:100%;max-width:100%;overflow-x:hidden;position:relative;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:var(--body);}

/* ══ SIDEBAR ══════════════════════════════════════════════════════════════ */
#sidebar{
  width:var(--sidebar-w);
  background:var(--nuit);
  display:flex;flex-direction:column;
  position:fixed;top:0;bottom:0;left:0;z-index:200;
  box-shadow:2px 0 24px rgba(0,0,0,0.18);
  transition:width 0.25s ease;
  overflow:hidden;
}
#sidebar-header{
  padding:22px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  text-align:center;
  flex-shrink:0;
}
#logo-placeholder{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--teal1),var(--teal2));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 10px;font-size:24px;
  transition:opacity 0.2s,max-height 0.25s;overflow:hidden;
}
#app-name{
  font-family:var(--display);color:var(--sand);
  font-weight:700;font-size:17px;line-height:1.2;
  transition:opacity 0.2s,max-height 0.2s;overflow:hidden;
}
#app-sub{
  color:var(--teal2);font-size:10px;
  letter-spacing:0.2em;text-transform:uppercase;
  margin-top:3px;
  transition:opacity 0.2s,max-height 0.2s;overflow:hidden;
}
#sidebar-divider{
  width:40px;height:1px;
  background:linear-gradient(90deg,transparent,var(--teal1),transparent);
  margin:10px auto 0;
  transition:opacity 0.2s;
}
#nav{flex:1;padding:10px 8px;overflow-y:auto;}
#nav::-webkit-scrollbar{width:3px;}
#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px;}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:9px;border:none;
  background:transparent;color:rgba(222,211,188,0.48);
  cursor:pointer;font-size:13px;font-weight:500;
  margin-bottom:2px;text-align:left;
  font-family:var(--body);
  transition:all 0.15s;white-space:nowrap;overflow:hidden;
}
.nav-btn:hover{background:rgba(255,255,255,0.06);color:rgba(222,211,188,0.88);}
.nav-btn.active{
  background:rgba(50,134,160,0.22);
  color:var(--teal2);font-weight:700;
}
.nav-badge{
  background:#ef4444;color:#fff;
  font-size:10px;font-weight:800;
  padding:1px 6px;border-radius:10px;margin-left:auto;flex-shrink:0;
}
.sidebar-label{transition:opacity 0.2s,max-width 0.2s;white-space:nowrap;overflow:hidden;flex:1;}
#sidebar-bottom{
  padding:8px 8px 12px;
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;gap:2px;
  flex-shrink:0;
  transition:opacity 0.2s;
}
#sidebar-toggle{
  width:32px;height:32px;border-radius:7px;
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.06);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all 0.2s;
  color:rgba(222,211,188,0.6);flex-shrink:0;
}
#sidebar-toggle:hover{background:rgba(255,255,255,0.12);color:var(--sand);}

/* ══ MAIN ═════════════════════════════════════════════════════════════════ */
#main{margin-left:240px;min-height:100vh;transition:margin-left 0.25s ease;}
@media(min-width:769px) and (max-width:1100px){#main{margin-left:200px!important;}#sidebar{width:200px!important;}}

/* ══ TOPBAR ═══════════════════════════════════════════════════════════════ */
#topbar{
  background:rgba(247,244,237,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:0 24px 0 20px;
  height:var(--topbar-h);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  gap:12px;
}
#page-title{
  font-family:var(--display);font-size:16px;font-weight:700;
  color:var(--nuit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(50,134,160,0.1);
  border:1.5px solid rgba(50,134,160,0.2);
  cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;color:var(--teal1);
}
.icon-btn:hover{background:var(--nuit);color:#fff;border-color:var(--nuit);}
#alert-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;
  border:1.5px solid #fca5a5;background:#fef2f2;
  color:#991b1b;cursor:pointer;font-weight:700;font-size:12px;
  transition:all 0.2s;
}
#alert-btn:hover{background:#fee2e2;}
#burger-btn{
  display:none;width:38px;height:38px;border-radius:9px;
  border:1.5px solid var(--line-med);background:var(--paper);
  align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;flex-shrink:0;
  color:var(--nuit);
}
#back-btn{
  width:34px;height:34px;border-radius:9px;
  border:1.5px solid var(--line);background:var(--paper);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--ink2);transition:all 0.2s;
}
#back-btn:hover{background:var(--cream);border-color:var(--line-med);}

/* ══ CONTENT ══════════════════════════════════════════════════════════════ */
#content{padding:28px 32px;background:#F7F4ED;min-height:calc(100vh - 60px);}
#main{background:#F7F4ED;}

/* ══ KPI CARDS ════════════════════════════════════════════════════════════ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi{
  background:#FFFFFF;border-radius:var(--radius);
  padding:16px 20px;border:1px solid rgba(26,33,24,0.1);
  box-shadow:var(--shadow);
  transition:box-shadow 0.2s,transform 0.2s;
}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.kpi-label{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.08em;margin-bottom:8px;color:rgba(26,33,24,0.38);
}
.kpi-value{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;}
.kpi-value.small{font-size:18px;}

/* ══ SECTION CARDS ════════════════════════════════════════════════════════ */
.section-card{
  background:#FFFFFF;border-radius:var(--radius);
  border:1px solid rgba(26,33,24,0.1);overflow:hidden;
  margin-bottom:18px;box-shadow:var(--shadow);
}
.section-head{
  padding:16px 20px 14px;
  border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:8px;
}
.section-title{
  font-family:var(--display);font-weight:700;font-size:15px;color:var(--nuit);
}
.section-sub{font-size:11px;color:var(--ink3);margin-top:2px;}

/* ══ LAYOUT ═══════════════════════════════════════════════════════════════ */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.db-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;row-gap:0;align-items:start;grid-auto-rows:8px;}
.db-grid>.db-w{margin-bottom:18px;}
.db-grid.db-edit{column-gap:26px;padding-top:10px;}
.db-grid.db-edit>.db-w{margin-bottom:26px;}
.db-w{position:relative;min-width:0;}
.db-w.full{grid-column:1 / -1;}
@media (max-width:620px){ .db-grid{grid-template-columns:1fr;grid-auto-rows:auto!important;} .db-w{grid-column:1 / -1!important;grid-row-end:auto!important;} }
.db-w>.section-card,.db-w>.db-hero{margin-bottom:0!important;}
.db-w.reduit>.section-card>*:not(.section-head),.db-w.reduit>.db-hero>*:not(:first-child){display:none!important;}
.db-w.reduit>.section-card{padding-bottom:0;}
.db-edit .db-w{outline:2px dashed rgba(50,134,160,0.45);outline-offset:5px;border-radius:14px;animation:dbwiggle 2.6s ease-in-out infinite;}
.db-edit .db-w:nth-child(even){animation-delay:-1.3s;}
@keyframes dbwiggle{0%,100%{transform:rotate(-0.22deg)}50%{transform:rotate(0.22deg)}}
.db-w-bar{position:absolute;top:-13px;left:14px;z-index:6;display:flex;gap:4px;background:#fff;border:1.5px solid #e2e8f0;border-radius:999px;padding:3px 5px;box-shadow:0 3px 10px rgba(0,0,0,0.10);}
.db-w-btn{min-width:26px;height:26px;border-radius:999px;border:none;background:#f1f5f9;color:#475569;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-family:'Inter',sans-serif;font-weight:700;}
.db-w-btn:hover{background:#e2e8f0;}
.db-w-btn[disabled]{opacity:0.28;cursor:default;}
.db-edit .db-w>*{pointer-events:none;}
.db-edit .db-w>.db-w-bar{pointer-events:auto;}
.db-reduce{position:absolute;top:10px;left:10px;z-index:4;width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(0,0,0,0.08);background:rgba(255,255,255,0.85);color:#64748b;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;}
.db-hero .db-reduce{background:rgba(255,255,255,0.18);color:#fff;border-color:rgba(255,255,255,0.3);}

/* ══ BADGE ════════════════════════════════════════════════════════════════ */
.badge{
  font-size:11px;font-weight:700;padding:3px 9px;
  border-radius:999px;white-space:nowrap;
}

/* ══ BUTTONS ══════════════════════════════════════════════════════════════ */
.btn-add{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:999px;border:none;
  cursor:pointer;font-size:13px;font-weight:700;
  font-family:var(--body);transition:all 0.2s;
}
.btn-add:hover{transform:translateY(-1px);filter:brightness(1.08);}
.btn-sm{
  padding:5px 10px;border-radius:7px;
  border:1.5px solid var(--line-med);
  background:var(--cream);cursor:pointer;font-size:12px;
  font-family:var(--body);transition:all 0.15s;color:var(--ink2);
}
.btn-sm:hover{background:var(--paper);border-color:var(--teal1);color:var(--teal1);}
.btn-danger{border-color:#fecaca!important;background:#fef2f2!important;color:#991b1b!important;}
.btn-danger:hover{background:#fee2e2!important;border-color:#f87171!important;}
.btn-edit{border-color:#bfdbfe!important;background:#eff6ff!important;color:#1d4ed8!important;}
.btn-edit:hover{background:#dbeafe!important;}

/* ══ TABLES ═══════════════════════════════════════════════════════════════ */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  padding:11px 18px;text-align:left;
  font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.07em;white-space:nowrap;
  border-bottom:1px solid var(--line);
  color:var(--ink3);background:var(--cream);
}
td{
  padding:12px 18px;
  border-bottom:1px solid rgba(26,33,24,0.06);
  color:var(--ink);
}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(50,134,160,0.03);}

/* ══ HERO DASHBOARD ══════════════════════════════════════════════════════ */
.db-hero{
  border-radius:20px;padding:28px 32px;margin-bottom:22px;
  color:#fff;position:relative;overflow:hidden;
}
.db-hero::before{
  content:"";position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='400' height='200' viewBox='0 0 400 200' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='350' cy='50' r='180' fill='rgba(255,255,255,0.04)'/%3E%3Ccircle cx='380' cy='160' r='100' fill='rgba(255,255,255,0.03)'/%3E%3C/svg%3E") right center no-repeat;
  pointer-events:none;
}
.hero-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;}
.hero-kpi{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:11px;padding:12px 14px;cursor:pointer;
  transition:background 0.15s;
}
.hero-kpi:hover{background:rgba(255,255,255,0.16);}
.hero-kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;opacity:0.65;font-weight:600;}
.hero-kpi-value{font-family:var(--display);font-size:22px;font-weight:700;}

/* ══ ALERT BARS ═══════════════════════════════════════════════════════════ */
.alert-bar{
  border-radius:12px;padding:13px 18px;
  display:flex;gap:12px;align-items:center;
  cursor:pointer;margin-bottom:12px;
  border:1.5px solid;
  transition:filter 0.2s;
}
.alert-bar:hover{filter:brightness(0.97);}

/* ══ PLANNING ═════════════════════════════════════════════════════════════ */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 10px 16px;}
.day-col{padding:4px;}
.day-header{text-align:center;margin-bottom:8px;}
.day-name{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ink3);}
.day-num{
  width:28px;height:28px;border-radius:50%;
  font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  margin:2px auto;color:var(--ink);
}
.day-num.today{background:var(--teal1);color:#fff;}
.ev-pill{
  border-left:3px solid;border-radius:6px;
  padding:4px 6px;margin-bottom:3px;cursor:pointer;
  position:relative;
}
.ev-title{font-weight:700;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev-time{font-size:10px;color:var(--ink3);}
.ev-del{position:absolute;top:2px;right:2px;font-size:10px;cursor:pointer;opacity:0.6;display:none;}
.ev-pill:hover .ev-del{display:block;}

/* ══ STOCK ════════════════════════════════════════════════════════════════ */
.stock-bar-bg{height:4px;border-radius:3px;background:var(--line);margin-top:4px;}
.stock-bar{height:100%;border-radius:3px;}

/* ══ TACHES ══════════════════════════════════════════════════════════════ */
.tache-row{
  padding:10px 20px;border-bottom:1px solid rgba(26,33,24,0.06);
  display:flex;gap:10px;align-items:center;
}
.tache-row:last-child{border-bottom:none;}
.tache-check{
  width:18px;height:18px;border-radius:5px;
  border:2px solid var(--line-med);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:10px;color:#fff;background:transparent;
  transition:all 0.15s;
}
.tache-check:hover{border-color:var(--teal1);}
.tache-check.done{background:#15803d;border-color:#15803d;}
.prio-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ══ QUICK GRID ══════════════════════════════════════════════════════════ */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.quick-btn{
  background:var(--paper);border-radius:var(--radius);
  padding:20px;cursor:pointer;text-align:left;
  width:100%;transition:all 0.18s;
  font-family:var(--body);border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.quick-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:rgba(50,134,160,0.25);}

/* ══ CMD ROWS ════════════════════════════════════════════════════════════ */
.cmd-row{
  padding:12px 20px;border-bottom:1px solid rgba(26,33,24,0.06);
  display:flex;justify-content:space-between;align-items:center;
}
.cmd-row:last-child{border-bottom:none;}

/* ══ LOGIN ════════════════════════════════════════════════════════════════ */
#login-screen{
  min-height:100vh;width:100%;
  align-items:center;justify-content:center;
  background:#0f172a;
  position:relative;overflow:auto;
}
#login-screen::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 900px 600px at 75% 40%,rgba(100,116,139,0.22),transparent 65%),
             radial-gradient(ellipse 500px 500px at 20% 80%,rgba(148,163,184,0.10),transparent 60%);
  pointer-events:none;
}
.login-card{
  background:var(--paper);border-radius:24px;
  padding:40px 32px;width:100%;max-width:420px;
  box-shadow:0 32px 80px rgba(0,0,0,0.3);
  margin:20px;box-sizing:border-box;
  position:relative;z-index:1;
}
.login-card .eyebrow{
  display:flex;align-items:center;gap:9px;
  font-size:10.5px;font-weight:700;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--teal1);margin-bottom:6px;
}
.login-card .eyebrow::before{
  content:"";width:6px;height:6px;border-radius:50%;
  background:var(--teal2);box-shadow:0 0 0 3px rgba(41,154,195,0.18);
  flex-shrink:0;
}

/* ══ MODAL ════════════════════════════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;z-index:600;
  background:rgba(26,33,24,0.45);
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(4px);
}
.modal{
  background:var(--paper);border-radius:20px;
  width:100%;max-width:520px;max-height:90vh;
  overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,0.2);
}
.modal-head{
  padding:20px 24px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:var(--paper);z-index:1;
}
.modal-title{font-family:var(--display);font-weight:700;font-size:16px;color:var(--nuit);}
.modal-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--ink3);transition:color 0.2s;}
.modal-close:hover{color:var(--nuit);}
.modal-body{padding:22px 24px;}
.modal-footer{
  padding:16px 24px;border-top:1px solid var(--line);
  display:flex;gap:8px;justify-content:flex-end;
}
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:11px;font-weight:700;color:var(--ink3);
  text-transform:uppercase;letter-spacing:0.07em;margin-bottom:7px;
}
.field input,.field select,.field textarea{
  width:100%;padding:10px 14px;border-radius:10px;
  border:1.5px solid var(--line-med);font-size:13.5px;
  color:var(--nuit);background:var(--cream);outline:none;
  font-family:var(--body);box-sizing:border-box;transition:border-color 0.2s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--teal1);background:var(--paper);
}
.field input[type=checkbox],.field input[type=radio]{
  width:20px;height:20px;min-width:20px;flex:none;padding:0;margin:0;
  border-radius:5px;accent-color:var(--teal1);
}
.field textarea{min-height:80px;resize:vertical;}

<script>
// ── Helpers ───────────────────────────────────────────────────────────────────
// ── Utilisateurs ─────────────────────────────────────────────────────────────
// ── Mobile sidebar ───────────────────────────────────────────────────────────
function toggleMobileSidebar(){
  const sb=document.getElementById("sidebar");
  const ov=document.getElementById("sidebar-overlay");
  if(sb.classList.contains("open")){
    sb.classList.remove("open");
    ov.classList.remove("open");
  } else {
    setSidebarVisuals(true);
    sb.classList.add("open");
    ov.classList.add("open");
  }
}
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-overlay").classList.remove("open");
}


// Les comptes vivent dans Supabase Auth + la table profiles.
// PROFILES est un cache local rechargé à l'ouverture des réglages — jamais synchronisé.
let PROFILES=[];
let currentUser=null;
let isLoggedIn=false;

// ── Hiérarchie des rôles : super_admin > admin > user ───────────────────────
const ROLE_RANK={user:1,admin:2,super_admin:3};
// hasRole("admin") est vrai pour un admin ET pour un super_admin
function hasRole(min){
  if(!currentUser) return false;
  return (ROLE_RANK[currentUser.role]||0) >= (ROLE_RANK[min]||99);
}
function roleLabel(r){
  return {super_admin:"Super administrateur",admin:"Administrateur",user:"Utilisateur"}[r]||r||"—";
}

// ── Journal d'activité ──────────────────────────────────────────────────────
let JOURNAL=[];
let INTERVENTIONS=[]; // rapports d'intervention
let RAPPRO={};        // rapprochement bancaire Qonto : idTransaction → document
function logActivity(action,details){
  JOURNAL.unshift({
    id:uid(),
    ts:new Date().toISOString(),
    user:currentUser?currentUser.nom:"Système",
    login:currentUser?(currentUser.login||currentUser.email||"—"):"—",
    action,
    details:details||""
  });
  if(JOURNAL.length>200) JOURNAL=JOURNAL.slice(0,200); // garder les 200 derniers
  saveData();
}

// ── Historique des documents générés (PDF) ──────────────────────────────────
let DOCSHIST=[];
let docsFilter="tous";
const DOC_TYPES={
  devis:  {icon:"📝",lbl:"Devis"},
  facture:{icon:"🧾",lbl:"Facture"},
  bcc:    {icon:"📋",lbl:"BC client"},
  bcf:    {icon:"📦",lbl:"BC fournisseur"},
  intervention:{icon:"🛠️",lbl:"Rapport d'intervention"},
  remise:{icon:"📘",lbl:"Dossier de remise"}
};
function logDocument(type,sourceId,ref,tiers,montant){
  DOCSHIST.unshift({
    id:uid(),
    ts:new Date().toISOString(),
    user:currentUser?currentUser.nom:"Système",
    type,sourceId,
    ref:ref||"",
    tiers:tiers||"",
    montant:montant||0
  });
  if(DOCSHIST.length>300) DOCSHIST=DOCSHIST.slice(0,300); // garder les 300 derniers
  saveData();
}
// Re-générer un document depuis l'historique (si la source existe encore)
function regenDocument(histId){
  const h=DOCSHIST.find(x=>x.id===histId);if(!h)return;
  if(h.type==="facture"){ if(FACTURES.some(f=>f.id===h.sourceId)) return genererFacturePDF(h.sourceId); }
  else if(h.type==="devis"){ if(DEVIS.some(d=>d.id===h.sourceId)) return genererDevisPDF(h.sourceId); }
  else if(h.type==="bcc"){ if(BCCLIENTS.some(b=>b.id===h.sourceId)) return genererBCClientPDF(h.sourceId); }
  else if(h.type==="bcf"){ if(COMMANDES.some(c=>c.id===h.sourceId)) return genererBonCommandePDF(h.sourceId); }
  else if(h.type==="intervention"){ if(INTERVENTIONS.some(r=>r.id===h.sourceId)) return genererRIPDF(h.sourceId); }
  else if(h.type==="remise"){ if(CLIENTS.some(c=>c.id===h.sourceId)) return modalDossierRemise(h.sourceId); }
  alert("Le document d'origine a été supprimé : impossible de le régénérer.");
}

function checkLogin(){
  const saved=sessionStorage.getItem("gp_user");
  if(saved){currentUser=JSON.parse(saved);isLoggedIn=true;loadWidgets();return true;}
  return false;
}
async function loadProfileAndTenant(userId){
  // Récupère le profil (rôle, tenant) et les infos du tenant associé — protégé par RLS
  const {data:profile,error}=await sbClient.from("profiles")
    .select("id,tenant_id,role,nom,actif,tenants(id,nom,plan,statut_abonnement,theme)")
    .eq("id",userId).maybeSingle();
  if(error || !profile) return null;
  return profile;
}

async function doLogin(){
  const email=document.getElementById("login-input").value.trim();
  const pwd=document.getElementById("pwd-input").value.trim();
  const err=document.getElementById("login-error");
  err.textContent="Vérification…";err.style.display="block";err.style.color="#64748b";err.style.background="#f1f5f9";err.style.borderColor="#cbd5e1";

  const {data:authData,error:authErr}=await sbClient.auth.signInWithPassword({email,password:pwd});
  if(authErr || !authData || !authData.user){
    err.textContent="Identifiants incorrects";err.style.display="block";err.style.color="";err.style.background="";err.style.borderColor="";
    document.getElementById("pwd-input").value="";
    return;
  }

  const profile=await loadProfileAndTenant(authData.user.id);
  if(!profile || profile.actif===false || !profile.tenant_id){
    err.textContent=!profile?"Compte non configuré, contactez l'administrateur"
      :(profile.actif===false?"Ce compte est désactivé"
      :"Compte non rattaché à une entreprise, contactez l'administrateur");

// Helpers de calcul facture (compatibles avec anciennes factures à montant global)
// Prochain numéro de document : plus grand numéro de l'année + 1 (jamais de doublon, même après une suppression)
function prochainNumero(prefixe,liste){
  const an=new Date().getFullYear(), re=new RegExp("^"+prefixe+"-"+an+"-(\\d+)$");
  const max=(liste||[]).reduce((m,x)=>{const r=re.exec(String(x.num||"").trim());return r?Math.max(m,Number(r[1])):m;},0);
  return prefixe+"-"+an+"-"+String(max+1).padStart(3,"0");
}
// Date d'émission d'une facture (anciennes factures sans date : estimée à 30 jours avant l'échéance)
function facDate(f){ return f.date||(f.ech?addDays(f.ech,-30):""); }
// Date de démarrage de la comptabilité (Réglages) : ce qui est antérieur est ignoré dans les chiffres
function comptaDepuis(){ return (typeof TH!=="undefined"&&TH&&TH.compteDepuis)||""; }
function dateEnCompta(d){ const dd=comptaDepuis(); return !dd||!d||String(d).slice(0,10)>=dd; }
function facEnCompta(f){ return dateEnCompta(facDate(f)); }
// Taux de TVA par défaut des ventes (Martinique : 8,5 %)
const TVA_DEFAUT=8.5;
function fTaux(t){ return String(Number(t)||0).replace(".",",")+" %"; }
function facTauxTVA(f){ return (f.tva!==undefined&&f.tva!==null)?f.tva:TVA_DEFAUT; }
function facHT(f){
  if(f.lignes&&f.lignes.length) return f.lignes.reduce((s,l)=>s+(l.qte||0)*(l.pu||0),0);
  return Math.round((f.ttc||0)/(1+(facTauxTVA(f)/100))); // rétrocompat : déduit le HT du TTC
}
function facTVA(f){ return facHT(f)*(facTauxTVA(f)/100); }
function facTTC(f){
  if(f.lignes&&f.lignes.length) return facHT(f)+facTVA(f);
  return f.ttc||0; // ancienne facture : on garde le ttc stocké
}

function facPaye(f){ return (f.paiements||[]).reduce((s,p)=>s+(p.montant||0),0); }
function facReste(f){ return Math.max(0,Math.round((facTTC(f)-facPaye(f))*100)/100); }

// Fusionne les rubriques sauvegardées avec celles du code :
// garde les personnalisations existantes, ajoute les nouvelles rubriques manquantes
function mergeRubs(savedRubs){
  if(!Array.isArray(savedRubs)||savedRubs.length===0) return JSON.parse(JSON.stringify(DEF_RUBS));
  const result=savedRubs.map(r=>({...r}));
  DEF_RUBS.forEach(defRub=>{
    if(!result.some(r=>r.id===defRub.id)){
      result.push({...defRub}); // rubrique nouvelle (ex: Devis) → on l'ajoute
    }
  });
  return result;
}

(function setupPWA(){
  try{
    // Manifest généré dynamiquement (data URL)
    const manifest={
      name:"AD Management",
      short_name:"AD Management",
      description:"AD Management — logiciel de gestion",
      start_url:".",
      display:"standalone",
      background_color:"#1A2118",
      theme_color:"#1A2118",
      orientation:"any",
      icons:[
        {src:"logo.png",sizes:"192x192",type:"image/png",purpose:"any maskable"},
        {src:"logo.png",sizes:"512x512",type:"image/png",purpose:"any maskable"}
      ]
    };
    const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
    const link=document.createElement("link");
    link.rel="manifest";
    link.href=URL.createObjectURL(blob);
    document.head.appendChild(link);

    // Service worker minimal (cache de l'app pour fonctionnement hors-ligne)
    if("serviceWorker" in navigator){
      const swCode=`
        const CACHE="adsecure-v1";
        self.addEventListener("install",e=>{self.skipWaiting();});
        self.addEventListener("activate",e=>{e.waitUntil(clients.claim());});
        self.addEventListener("fetch",e=>{
          if(e.request.method!=="GET")return;
          e.respondWith(
            fetch(e.request).then(res=>{
              const copy=res.clone();
              caches.open(CACHE).then(c=>c.put(e.request,copy)).catch(()=>{});
              return res;
            }).catch(()=>caches.match(e.request))
          );
        });
      `;
      const swBlob=new Blob([swCode],{type:"application/javascript"});
      const swUrl=URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(err=>console.warn("SW non enregistré:",err));
    }
  }catch(e){ console.warn("PWA setup échec:",e); }
})();

// Envoyer les données vers Supabase (scopé au tenant courant, protégé par RLS)
async function syncPush(){
  if(!currentUser || !currentUser.tenant_id){ setSyncBadge("error"); return false; }
  setSyncBadge("syncing");
  try{
    const {data:upd,error}=await sbClient.from("app_data")
      .update({data:getDataObject(),updated_at:new Date().toISOString()})
      .eq("tenant_id",currentUser.tenant_id)
      .select("tenant_id");
    if(error){ console.warn("Sync push échec:",error); setSyncBadge("error"); return false; }
    // Aucune ligne existante (nouveau projet) → on la crée
    if(!upd || upd.length===0){
      const ins=await syncInsert();
      if(!ins){ setSyncBadge("error"); return false; }
    }
    setSyncBadge("ok");
    return true;
  }catch(e){
    console.warn("Sync push échec:",e);
    setSyncBadge("offline");
    return false;
  }
}
async function syncInsert(){
  if(!currentUser || !currentUser.tenant_id) return false;
  const {error}=await sbClient.from("app_data").insert({
    tenant_id:currentUser.tenant_id,
    data:getDataObject(),
    updated_at:new Date().toISOString()
  });
  return !error;
}

// Récupérer les données depuis Supabase (scopé au tenant courant)
async function syncPull(){
  if(!currentUser || !currentUser.tenant_id){ setSyncBadge("error"); return false; }
  setSyncBadge("syncing");
  try{
    const {data:rows,error}=await sbClient.from("app_data")
      .select("data")
      .eq("tenant_id",currentUser.tenant_id)
      .maybeSingle();
    if(error){setSyncBadge("error");return false;}
    if(rows && rows.data){
      applyDataObject(rows.data);
      await syncRelancesLog();
      saveDataLocal();
      setSyncBadge("ok");
      return true;
    }
    // Aucune donnée en ligne → on pousse les données locales
    await syncInsert();
    setSyncBadge("ok");
    return true;
  }catch(e){
    console.warn("Sync pull échec:",e);
    setSyncBadge("offline");
    return false;
  }
}

const BACKUP_KEEP=30; // nombre de sauvegardes conservées

// Toutes les requêtes passent par sbClient : le JWT de session est utilisé,
// jamais la clé anon. Les données restent cloisonnées par tenant via RLS.

// Liste les sauvegardes (date desc), sans le champ data (léger)
async function listBackups(){
  try{
    if(!currentUser||!currentUser.tenant_id) return [];
    const {data,error}=await sbClient.from("app_backups")
      .select("id,created_at,label")
      .eq("tenant_id",currentUser.tenant_id)
      .order("created_at",{ascending:false});
    if(error){ console.warn("listBackups échec:",error); return []; }
    return data||[];
  }catch(e){ console.warn("listBackups échec:",e); return []; }
}

// Crée un snapshot horodaté (1 par jour max sauf si force=true)
async function createBackupSnapshot(force,label){
  try{
    if(!currentUser||!currentUser.tenant_id) return false;
    const existing=await listBackups();
    if(!force && existing.length>0){
      const lastDay=(existing[0].created_at||"").split("T")[0];
      if(lastDay===getToday()) return false; // déjà une sauvegarde aujourd'hui
    }
    const {error}=await sbClient.from("app_backups").insert({
      tenant_id:currentUser.tenant_id,
      data:getDataObject(),
      label:label||(force?"Manuelle":"Automatique")
    });
    if(error){ console.warn("createBackupSnapshot échec:",error); return false; }
    // Purge : ne garder que les BACKUP_KEEP plus récentes
    await purgeOldBackups();
    return true;
  }catch(e){ console.warn("createBackupSnapshot échec:",e); return false; }
}

// Supprime les sauvegardes au-delà des BACKUP_KEEP plus récentes
async function purgeOldBackups(){
  try{
    const all=await listBackups();
    if(all.length<=BACKUP_KEEP) return;
    const ids=all.slice(BACKUP_KEEP).map(b=>b.id); // les plus anciennes
    if(!ids.length) return;
    const {error}=await sbClient.from("app_backups").delete().in("id",ids);
    if(error) console.warn("purgeOldBackups échec:",error);
  }catch(e){ console.warn("purgeOldBackups échec:",e); }
}

// Récupère le contenu complet d'une sauvegarde
async function fetchBackupData(id){
  try{
    const {data,error}=await sbClient.from("app_backups")
      .select("data")
      .eq("id",id)
      .maybeSingle();
    if(error){ console.warn("fetchBackupData échec:",error); return null; }
    return data?data.data:null;
  }catch(e){ console.warn("fetchBackupData échec:",e); return null; }
}

// Restaure une sauvegarde (admin uniquement)
async function restoreBackup(id){
  if(!hasRole("admin")){alert("Action réservée aux administrateurs.");return;}
  const data=await fetchBackupData(id);
  if(!data){alert("Impossible de récupérer cette sauvegarde.");return;}
  // Filet de sécurité : snapshot de l'état courant AVANT de remplacer
  await createBackupSnapshot(true,"Avant restauration");
  applyDataObject(data);
  saveDataLocal();
  await syncPush(); // pousse l'état restauré vers app_data
  logActivity("Restauration sauvegarde","Sauvegarde #"+id+" restaurée");
  closePanel();
  applyTheme();renderNav();renderPage();
  alert("✓ Sauvegarde restaurée avec succès.");
}

function importData(ev){
  const file=ev.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.CLIENTS && !d.PROSPECTS){alert("Fichier invalide : ce n'est pas une sauvegarde AD Management.");return;}
      if(!confirm("Importer cette sauvegarde ? Vos données actuelles seront remplacées.")) return;
      applyDataObject(d);
      saveDataLocal();
      logActivity("Import","Sauvegarde importée");
      // Envoi immédiat vers le cloud AVANT rechargement (sinon la synchro écraserait l'import)
      const ok=await syncPush();
      alert(ok?"Importation réussie et synchronisée ! L'application va se recharger.":"Import appliqué sur cet appareil, mais la synchronisation cloud a échoué. Vérifiez la connexion puis réessayez.");
      if(ok) location.reload();
    }catch(err){
      alert("Erreur lors de la lecture du fichier : "+err.message);
    }
  };
  reader.readAsText(file);
}

function badge(label,bg,color){return `<span class="badge" style="background:${bg};color:${color}">${label}</span>`;}
function alertCount(){return FACTURES.filter(f=>facEnCompta(f)&&facStatutReel(f)==="retard").length+STOCK.filter(s=>s.qte<s.seuil).length+TACHES.filter(t=>!t.done&&t.prio==="haute").length;}
function activeRubs(){return [...RUBS].sort((a,b)=>a.ordre-b.ordre).filter(r=>r.actif);}
function kpi(label,value,color,small){return`<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value${small?" small":""}" style="color:${color||TH.c1}">${value}</div></div>`;}
function weekStart(offset){const d=new Date();const day=d.getDay()===0?6:d.getDay()-1;d.setDate(d.getDate()-day+(offset||0)*7);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

// ── Nav ───────────────────────────────────────────────────────────────────────
function renderNav(){
  const nav=document.getElementById("nav");
  const ac=alertCount();
  nav.innerHTML=activeRubs().map(r=>{
    const isAct=currentPage===r.id;
    const bc=isAct?`background:${TH.c1}28`:"";
    const tc=isAct?TH.c2:`${TH.sand}80`;
    const bdg=r.id==="db"&&ac>0?`<span class="nav-badge">${ac}</span>`:"";
    return`<button class="nav-btn${isAct?" active":""}" onclick="goTo('${r.id}')" style="color:${tc};${bc};font-family:'${TH.police}',Georgia,serif">
      <span>${r.icon}</span><span class="sidebar-label" style="flex:1">${r.label}</span>${bdg}
    </button>`;}).join("");
  const ab=document.getElementById("alert-btn");
  if(ab){ab.style.display=ac>0?"flex":"none";const span=document.getElementById("alert-count");if(span)span.textContent=ac;}
  const bb=document.getElementById("back-btn");
  if(bb){bb.style.opacity=pageHistory.length>0?"1":"0.3";bb.style.cursor=pageHistory.length>0?"pointer":"default";}
  const av=document.getElementById("user-avatar");
  if(av&&currentUser){
    if(currentUser.avatar){
      av.innerHTML=`<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>`;
      av.style.padding="0";av.style.overflow="hidden";
    } else {
      av.textContent=currentUser.nom.charAt(0).toUpperCase();
    }
    av.title=currentUser.nom+" · Réglages";
  }
  const pt=document.getElementById("page-title");
  if(pt){
    let title="Tableau de bord";
    if(currentPage==="client-fiche"&&selectedClientId){const c=CLIENTS.find(x=>x.id===selectedClientId);title=c?c.nom:"Fiche client";}
    else if(currentPage==="client-fiche"&&selectedClientId){const cli=CLIENTS.find(x=>x.id===selectedClientId);title=cli?cli.nom:"Fiche client";}

    pt.textContent=title;pt.style.fontFamily=`'${TH.police}',Georgia,serif`;pt.style.color=TH.txt;
  }

}

function closeSearch(){ document.getElementById("modal-container").innerHTML=""; }
function runSearch(q){
  q=q.toLowerCase().trim();
  const box=document.getElementById("search-results");
  if(!q||q.length<2){box.innerHTML=`<div style="padding:30px;text-align:center;color:#94a3b8;font-size:13px">Tapez au moins 2 caractères</div>`;return;}
  const results=[];
  CLIENTS.forEach(c=>{if([c.nom,c.contact,c.email,c.tel].filter(Boolean).join(" ").toLowerCase().includes(q))results.push({icon:"👥",label:c.nom,sub:(c.contact||"")+" · "+fMoney(c.ca||0),type:"Client",action:`openClientFiche('${c.id}')`});});
  PROSPECTS.forEach(p=>{if([p.name,p.company,p.email].filter(Boolean).join(" ").toLowerCase().includes(q))results.push({icon:"🎯",label:p.name,sub:(p.company||"")+" · "+fMoney(p.amount||0),type:"Prospect",action:`goTo('pipeline')`});});
  FACTURES.forEach(f=>{if([f.num,f.client].filter(Boolean).join(" ").toLowerCase().includes(q))results.push({icon:"🧾",label:f.num,sub:f.client+" · "+fMoney(f.ttc||0),type:"Facture",action:`goTo('factures')`});});
  (typeof COMMANDES!=="undefined"?COMMANDES:[]).forEach(c=>{if([c.ref,c.four].filter(Boolean).join(" ").toLowerCase().includes(q))results.push({icon:"📦",label:c.ref||"Bon de commande",sub:(c.four||"")+" · "+fMoney(bcTotal(c)),type:"Bon de commande",action:`goTo('stock')`});});
  (typeof TRANSMISSIONS!=="undefined"?TRANSMISSIONS:[]).forEach(t=>{const cli=CLIENTS.find(c=>c.id===t.clientId);if((t.texte||"").toLowerCase().includes(q)||(cli&&cli.nom.toLowerCase().includes(q))){const ty=TYPES_TRANS[t.type]||TYPES_TRANS.note;results.push({icon:ty.icon,label:(t.texte||"").slice(0,60),sub:(cli?cli.nom+" · ":"")+fDateHeure(t.date),type:"Transmission",action:cli?`openClientFiche('${cli.id}')`:`goTo('db')`});}});
  (typeof BCCLIENTS!=="undefined"?BCCLIENTS:[]).forEach(b=>{const cli=CLIENTS.find(c=>c.id===b.clientId);if([b.num,b.refChantier,b.devisNum,cli?cli.nom:""].filter(Boolean).join(" ").toLowerCase().includes(q))results.push({icon:"📋",label:b.num,sub:(cli?cli.nom:"")+" · "+fMoney(devisTTC(b)),type:"BC client",action:`goTo('devis')`});});
  STOCK.forEach(s=>{if((s.nom||"").toLowerCase().includes(q))results.push({icon:"📦",label:s.nom,sub:"Qté "+s.qte+" · "+fMoney(s.prix||0),type:"Stock",action:`goTo('stock')`});});
  EVENTS.forEach(e=>{if([e.titre,e.client].filter(Boolean).join(" ").toLowerCase().includes(q))results.push({icon:"📅",label:e.titre,sub:(e.client||"")+" · "+(e.date||""),type:"Événement",action:`goTo('plan')`});});
  if(results.length===0){box.innerHTML=`<div style="padding:30px;text-align:center;color:#94a3b8;font-size:13px">Aucun résultat pour "${q}"</div>`;return;}
  box.innerHTML=results.slice(0,30).map(r=>`<button onclick="closeSearch();${r.action}" style="width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;border:none;background:none;cursor:pointer;border-radius:9px;text-align:left;font-family:'Inter',sans-serif" onmouseover="this.style.background='#F7F4ED'" onmouseout="this.style.background='none'">
    <span style="font-size:18px;flex-shrink:0">${r.icon}</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:600;color:#1A2118">${r.label}</div>
      <div style="font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.sub}</div>
    </div>
    <span style="font-size:10px;font-weight:700;color:#94a3b8;background:#f1f5f9;padding:2px 8px;border-radius:10px;flex-shrink:0">${r.type}</span>
  </button>`).join("")+(results.length>30?`<div style="padding:10px;text-align:center;color:#94a3b8;font-size:11px">${results.length-30} autre(s) résultat(s)…</div>`:"");
}

function goTo(id){
  closeSidebar();
  const r=RUBS.find(x=>x.id===id);
  const newPage=(r&&r.actif)?id:"db";
  if(newPage!==currentPage) pageHistory.push(currentPage);
  currentPage=newPage;
  if(newPage!=="client-fiche") selectedClientId=null;
  closeModal();
  renderNav();
  renderPage();
}
function openClientFiche(clientId){
  selectedClientId=clientId;
  pageHistory.push(currentPage);
  currentPage="client-fiche";
  closeModal();
  renderNav();
  renderPage();
}
function goBack(){
  if(pageHistory.length===0) return;
  currentPage=pageHistory.pop();
  renderNav();
  renderPage();
}

let cliVue="kanban";        // "kanban" ou "liste"
let cliQ="";                // recherche
let cliCat="";              // filtre catégorie
let cliStatut="";           // filtre statut (vue liste)
let cliTri="nom";           // nom | ca | date | trans

// CA réel d'un client, calculé sur ses factures et devis acceptés
function cliCA(c){
  const facs=FACTURES.filter(f=>facEnCompta(f)&&(f.clientId===c.id||(!f.clientId&&f.client&&f.client===c.nom))&&!["brouillon","annulee"].includes(f.statut)).reduce((s,f)=>s+facTTC(f),0);
  return facs>0?Math.round(facs*100)/100:(c.ca||0);
}
// Devis acceptés (y compris passés en bon de commande) et commandes en cours non facturées
function cliDevisAcceptes(c){ return DEVIS.filter(d=>d.clientId===c.id&&(["accepte","transforme"].includes(d.statut)||BCCLIENTS.some(b=>b.devisId===d.id))); }
function cliEnCommande(c){ return Math.round(BCCLIENTS.filter(b=>b.clientId===c.id&&b.statut!=="facture").reduce((s,b)=>s+devisTTC(b),0)*100)/100; }
function cliDerniereCommande(c){
  const d=[c.dernCmd||"",...BCCLIENTS.filter(b=>b.clientId===c.id).map(b=>b.date||""),...cliDevisAcceptes(c).map(x=>x.date||""),
    ...FACTURES.filter(f=>f.clientId===c.id).map(f=>facDate(f)||"")].filter(Boolean).sort();
  return d.pop()||"";
}
function cliDernierContact(c){
  const tr=transDuClient(c.id);
  const dates=[c.dernCmd||"",...(tr.length?[(tr[0].date||"").slice(0,10)]:[])].filter(Boolean);
  return dates.sort().pop()||"";
}
function clientsFiltres(){
  const q=(cliQ||"").toLowerCase().trim();
  let L=CLIENTS.filter(c=>{
    if(cliCat && c.cat!==cliCat) return false;
    if(cliStatut && c.status!==cliStatut) return false;
    if(!q) return true;
    return [c.nom,c.contact,c.tel,c.email,c.adresse,c.cat].filter(Boolean).join(" ").toLowerCase().includes(q);
  });
  const cmp={
    nom:(a,b)=>(a.nom||"").localeCompare(b.nom||""),
    ca:(a,b)=>cliCA(b)-cliCA(a),
    date:(a,b)=>(cliDernierContact(b)||"").localeCompare(cliDernierContact(a)||""),
    trans:(a,b)=>transDuClient(b.id).length-transDuClient(a.id).length
  }[cliTri]||((a,b)=>0);
  return [...L].sort(cmp);
}
function setCliFiltre(champ,val){
  if(champ==="q") cliQ=val;
  else if(champ==="cat") cliCat=(cliCat===val?"":val);
  else if(champ==="statut") cliStatut=(cliStatut===val?"":val);
  else if(champ==="tri") cliTri=val;
  else if(champ==="vue") cliVue=val;
  if(champ==="q"){
    const z=document.getElementById("cli-zone"); if(z) z.innerHTML=renderClientsZone();
    const cpt=document.getElementById("cli-cpt"); if(cpt) cpt.textContent=renderClientsCompteur();
    return;
  }
  renderPage();
}
function resetCliFiltres(){ cliQ="";cliCat="";cliStatut="";cliTri="nom"; renderPage(); }

function renderClientsCompteur(){
  const n=clientsFiltres().length;
  return `${n} client${n>1?"s":""} affiché${n>1?"s":""} sur ${CLIENTS.length}`;
}

let cliDragId=null;
function cliOnDrop(e,statusKey){
  e.preventDefault();
  if(!cliDragId) return;
  CLIENTS=CLIENTS.map(c=>c.id===cliDragId?{...c,status:statusKey}:c);
  cliDragId=null;
  saveData();
  renderPage();renderNav();
}
// ── Drag tactile clients ──────────────────────────────────────
let cliTouchMoved=false;
function cliTouchStart(e,id){
  cliDragId=id;cliTouchMoved=false;
  const card=e.currentTarget;
  card._holdTimer=setTimeout(()=>{
    card.classList.add("dragging");cliTouchMoved=true;
    if(navigator.vibrate)navigator.vibrate(30);
  },180);
}
function cliTouchMove(e){
  if(!cliDragId||!cliTouchMoved)return;
  e.preventDefault();
  const t=e.touches[0];
  document.querySelectorAll(".cli-col-cards").forEach(c=>c.classList.remove("cli-col-drop"));
  const el=document.elementFromPoint(t.clientX,t.clientY);
  const col=el&&el.closest?el.closest(".cli-col-cards"):null;
  if(col)col.classList.add("cli-col-drop");
}
function cliTouchEnd(e){
  const card=e.currentTarget;
  if(card._holdTimer)clearTimeout(card._holdTimer);
  card.classList.remove("dragging");
  if(!cliDragId||!cliTouchMoved){cliDragId=null;return;}
  const t=e.changedTouches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);
  const col=el&&el.closest?el.closest(".cli-col-cards"):null;
  document.querySelectorAll(".cli-col-cards").forEach(c=>c.classList.remove("cli-col-drop"));
  if(col){
    const statusKey=col.getAttribute("data-status");
    if(statusKey){CLIENTS=CLIENTS.map(c=>c.id===cliDragId?{...c,status:statusKey}:c);saveData();}
  }
  cliDragId=null;cliTouchMoved=false;renderPage();renderNav();
}

  return `

// Drag & drop planning
function dragEvent(event, id){
  event.dataTransfer.setData("evId", id);
  event.target.style.opacity="0.4";
}
function dropEvent(event, newDate){
  event.preventDefault();
  const id=event.dataTransfer.getData("evId");
  if(!id) return;
  EVENTS=EVENTS.map(e=>e.id===id?{...e,date:newDate}:e);
  renderPage();
}
function modalEvent(id,defaultDate){
  const e=id?EVENTS.find(x=>x.id===id):{id:"",type:"rdv",titre:"",client:"",date:defaultDate||TODAY,heure:"09:00",notes:""};
  showModal(id?"Modifier l'événement":"Nouvel événement",`
    <div class="field-row">

      <div class="field"><label>Heure</label><input type="time" id="e-heure" value="${e.heure}"/></div>
    </div>
    <div class="field"><label>Titre</label><input id="e-titre" value="${e.titre}" placeholder="Ex : Réunion commerciale"/></div>
    <div class="field-row">
      <div class="field"><label>Client / Intervenant</label><input id="e-client" value="${e.client}" placeholder="Nom du client"/></div>
      <div class="field"><label>Date</label><input type="date" id="e-date" value="${e.date}"/></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="e-notes">${e.notes}</textarea></div>`,
    `<button class="btn-cancel" onclick="closeModal()">Annuler</button>
     ${id?`<button class="btn-save" style="background:#991b1b;margin-right:auto" onclick="delEvent('${id}')">Supprimer</button>`:""}
     ${id&&e.riId&&INTERVENTIONS.some(r=>r.id===e.riId)?`<button class="btn-cancel" onclick="modalRI('${e.riId}')">🛠️ Voir le rapport</button>`:id&&["chantier","maintenance"].includes(e.type)||id&&e.contratId?`<button class="btn-cancel" onclick="nouveauRIDepuisEvent('${id}')">🛠️ Rapport</button>`:""}
     <button class="btn-save" style="background:${TH.c1}" onclick="saveEvent('${id||""}')">Enregistrer</button>`
  );
}
function modalEventDate(date){modalEvent(null,date);}
function saveEvent(id){
  const obj={type:document.getElementById("e-type").value,titre:document.getElementById("e-titre").value,client:document.getElementById("e-client").value,date:document.getElementById("e-date").value,heure:document.getElementById("e-heure").value,notes:document.getElementById("e-notes").value};
  if(id){EVENTS=EVENTS.map(e=>e.id===id?{...e,...obj}:e);}else{EVENTS.push({...obj,id:uid()});}
  closeModal();renderPage();
}
function delEvent(id){EVENTS=EVENTS.filter(e=>e.id!==id);closeModal();renderPage();}

// Helpers bons de commande
const BC_STATUTS={
  brouillon:{lbl:"Brouillon",bg:"#f1f5f9",col:"#64748b",icon:"📝"},
  envoyee:  {lbl:"Envoyé",   bg:"#fef3c7",col:"#b45309",icon:"📤"},
  recue:    {lbl:"Reçu",     bg:"#dcfce7",col:"#15803d",icon:"📥"}
};
function bcTotal(c){return (c.lignes||[]).reduce((s,l)=>s+(Number(l.qte)||0)*(Number(l.pu)||0),0);}

// ── Factures fournisseurs ────────────────────────────────────────────────
let FACFOURN=[];
const FF_STATUTS={
  brouillon:{lbl:"Brouillon",bg:"#f1f5f9",col:"#64748b",icon:"📝"},
  a_payer:  {lbl:"À payer",  bg:"#fef3c7",col:"#b45309",icon:"⏳"},
  partiel:  {lbl:"Partiel",  bg:"#e8f4f8",col:"#3286A0",icon:"◐"},
  payee:    {lbl:"Payée",    bg:"#dcfce7",col:"#15803d",icon:"✓"},
  retard:   {lbl:"En retard",bg:"#fee2e2",col:"#991b1b",icon:"⚠️"}
};
function ffTauxTVA(f){ return (f.tva!==undefined&&f.tva!==null)?f.tva:20; }
function ffHT(f){ return (f.lignes||[]).reduce((s,l)=>s+(Number(l.qte)||0)*(Number(l.pu)||0),0); }
function ffTTC(f){ return Math.round(ffHT(f)*(1+ffTauxTVA(f)/100)*100)/100; }
function ffPaye(f){ return (f.paiements||[]).reduce((s,p)=>s+(p.montant||0),0); }
function ffReste(f){ return Math.max(0,Math.round((ffTTC(f)-ffPaye(f))*100)/100); }
function ffEstPayee(f){ return ffReste(f)<=0 && ffTTC(f)>0; }
function ffStatutReel(f){
  if(f.statut==="brouillon") return "brouillon";
  if(ffEstPayee(f)) return "payee";
  if(ffPaye(f)>0) return "partiel";
  if(f.ech && f.ech<getToday()) return "retard";
  return "a_payer";
}
function nextFfRef(){
  const y=new Date().getFullYear();
  const nums=FACFOURN.map(f=>{const m=(f.num||"").match(/FF-\d{4}-(\d+)/);return m?parseInt(m[1]):0;});
  return `FF-${y}-${String((nums.length?Math.max(...nums):0)+1).padStart(3,"0")}`;
}
function nextBcRef(){
  const y=new Date().getFullYear();
  const nums=COMMANDES.map(c=>{const m=(c.ref||"").match(/BC-\d{4}-(\d+)/);return m?parseInt(m[1]):0;});
  const max=nums.length?Math.max(...nums):0;
  return `BC-${y}-${String(max+1).padStart(3,"0")}`;
}

// Met à jour le prix d'achat des produits du stock d'après les lignes facturées
function majPrixAchatDepuisFF(ff){
  const maj=[];
  (ff.lignes||[]).forEach(l=>{
    const pu=Number(l.pu)||0;if(pu<=0)return;
    const s=STOCK.find(x=>(l.ref&&x.ref===l.ref)||(x.nom||"").toLowerCase()===(l.desc||"").toLowerCase());
    if(s && Math.abs((s.prixAchat||0)-pu)>0.001) maj.push({s,ancien:s.prixAchat||0,nouveau:pu});
  });
  if(maj.length===0){saveData();renderPage();renderNav();return;}
  showModal("💶 Mise à jour des prix d'achat",
    `<p style="font-size:13.5px;color:${TH.txt}BB;line-height:1.6;margin-bottom:12px">Les prix facturés diffèrent des prix d'achat enregistrés. Mettre à jour la fiche produit ?</p>
     ${maj.map((m,i)=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:9px;margin-bottom:7px;font-size:13px;cursor:pointer;min-height:44px;box-sizing:border-box">
       <input type="checkbox" class="ffmaj-cb" data-i="${i}" checked style="width:20px;height:20px;min-width:20px;flex:none;accent-color:${TH.c1}"/>
       <span style="min-width:0;overflow-wrap:anywhere"><strong>${m.s.nom}</strong><br/><span style="color:${TH.txt}88">${fMoney(m.ancien)} → <strong style="color:${TH.c1}">${fMoney(m.nouveau)}</strong></span></span>
     </label>`).join("")}
     <p style="font-size:11.5px;color:${TH.txt}77;margin-top:10px">Le prix de revient suivra le prix d'achat s'il n'a pas été personnalisé.</p>`,
    `<button class="btn-cancel" onclick="closeModal();renderPage();renderNav()">Ignorer</button>
     <button class="btn-save" style="background:${TH.c1}" onclick="appliquerMajPrixAchat()">Mettre à jour</button>`
  );
  window._ffMaj=maj;
}
function appliquerMajPrixAchat(){
  const maj=window._ffMaj||[];
  Array.from(document.querySelectorAll(".ffmaj-cb:checked")).forEach(cb=>{
    const m=maj[Number(cb.dataset.i)];if(!m)return;
    const suitAchat=!m.s.prixRevient||Math.abs(m.s.prixRevient-m.ancien)<0.001;
    m.s.prixAchat=m.nouveau;
    if(suitAchat)m.s.prixRevient=m.nouveau;
  });
  window._ffMaj=null;
  saveData();closeModal();renderPage();renderNav();
}

function proposerReceptionStock(lignes,ref){
  const liees=lignes.filter(l=>l.ref&&STOCK.find(s=>s.ref===l.ref));
  if(liees.length===0){logActivity("Bon de commande",`Reçu : ${ref}`);renderPage();return;}
  showModal("📥 Réception — mise à jour du stock",
    `<p style="font-size:14px;color:#475569;line-height:1.6;margin-bottom:12px">Le bon <strong>${ref}</strong> est marqué « Reçu ». Voulez-vous ajouter les quantités reçues au stock ?</p>
     <div style="background:#f8fafc;border-radius:10px;padding:12px">
       ${liees.map(l=>{const s=STOCK.find(x=>x.ref===l.ref);return`<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #eef2f7"><span>${s.nom}</span><span style="font-weight:700;color:#15803d">${s.qte} → ${s.qte+Number(l.qte)} ${s.unite}</span></div>`;}).join("")}
     </div>`,
    `<button class="btn-cancel" onclick="closeModal();renderPage()">Non, ignorer</button>
     <button class="btn-save" style="background:#15803d" onclick="appliquerReceptionStock(${JSON.stringify(liees).replace(/"/g,"&quot;")},'${ref}')">✓ Ajouter au stock</button>`
  );

function appliquerReceptionStock(liees,ref){
  liees.forEach(l=>{STOCK=STOCK.map(s=>s.ref===l.ref?{...s,qte:s.qte+Number(l.qte)}:s);});
  logActivity("Réception stock",`Bon ${ref} : ${liees.length} article(s) ajouté(s) au stock`);
  closeModal();renderPage();
}

    </div>
    <div class="field" style="margin-bottom:4px"><label>Prix de vente (€)</label><input type="number" id="s-prix" value="${s.prix}" step="0.01" min="0" oninput="updateStockMarge()"/></div>
    <div style="font-size:11px;color:${TH.txt}77;margin-bottom:10px">Prix de revient = prix d'achat + frais annexes éventuels (transport, etc.). Sert de base au calcul du bénéfice réel.</div>

    `<button class="btn-cancel" onclick="closeModal()">Annuler</button>
     <button class="btn-save" style="background:${TH.c1}" onclick="saveStock('${id||""}')">Enregistrer</button>`
  );
  updateStockMarge();

function stockAchatChanged(){
  const rev=document.getElementById("s-prixrevient");
  const achat=Number(document.getElementById("s-prixachat").value)||0;
  // Si le prix de revient n'a jamais été personnalisé (égal à l'ancien prix d'achat ou vide), on le suit automatiquement
  if(!rev.dataset.touched) rev.value=achat;
  updateStockMarge();
}
function updateStockMarge(){
  const box=document.getElementById("s-marge-box");if(!box)return;
  const revEl=document.getElementById("s-prixrevient");
  if(revEl && document.activeElement===revEl) revEl.dataset.touched="1";
  const revient=Number(document.getElementById("s-prixrevient")?.value)||0;
  const vente=Number(document.getElementById("s-prix")?.value)||0;
  const marge=vente-revient;
  const margePct=vente>0?(marge/vente*100):0;
  const col=marge>0?"#15803d":marge<0?"#991b1b":"#64748b";
  box.innerHTML=`<div style="background:${col}0F;border:1.5px solid ${col}33;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:12px;font-weight:700;color:${TH.txt}">Bénéfice réel estimé</span>
    <span style="font-size:14px;font-weight:800;color:${col}">${fMoney(marge)} ${vente>0?"· "+margePct.toFixed(1)+"%":""}</span>
  </div>`;
}
function saveStock(id){
  const fournisseurs=Array.from(document.querySelectorAll(".s-four-cb:checked")).map(cb=>cb.value);
  const prixAchat=Number(document.getElementById("s-prixachat").value)||0;
  const prixRevient=Number(document.getElementById("s-prixrevient").value)||prixAchat;
  const obj={ref:document.getElementById("s-ref").value,nom:document.getElementById("s-nom").value,cat:document.getElementById("s-cat").value,unite:document.getElementById("s-unite").value,fournisseurs,four:fournisseurs[0]||"",qte:Number(document.getElementById("s-qte").value),seuil:Number(document.getElementById("s-seuil").value),prixAchat,prixRevient,prix:Number(document.getElementById("s-prix").value)};
  if(id){STOCK=STOCK.map(s=>s.id===id?{...s,...obj}:s);}else{STOCK.push({...obj,id:uid()});}
  closeModal();renderPage();renderNav();
}
function delStock(id){confirmDel("Supprimer ce produit ?",function(){STOCK=STOCK.filter(s=>s.id!==id);renderPage();renderNav();});}

function renderConfigPanel(){
  const chip=(val,type,i)=>`<div style="display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #e2e8f0;border-radius:999px;padding:5px 6px 5px 13px;margin:0 6px 8px 0">

  return`<div class="panel-overlay">

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">⚙️ Catégories & Unités</div>
        <button class="panel-close" onclick="closeConfigPanel()">✕</button>
      </div>
      <div class="panel-body">
        <div class="info-box">Personnalisez les catégories de produits et les unités utilisées dans votre stock.</div>

        <div style="margin-bottom:8px;font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em">📂 Catégories de produits</div>
        <div style="margin-bottom:10px">${CAT_STOCK.map((c,i)=>chip(c,"cat",i)).join("")}</div>
        <button onclick="addConfigItem('cat')" style="width:100%;padding:9px;border-radius:8px;border:1.5px dashed ${TH.c1};background:${TH.c1}08;color:${TH.c1};cursor:pointer;font-weight:600;font-size:13px;font-family:'Inter',sans-serif;margin-bottom:22px">＋ Ajouter une catégorie</button>

        <div style="margin-bottom:8px;font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em">📏 Unités</div>
        <div style="margin-bottom:10px">${UNITES.map((u,i)=>chip(u,"unite",i)).join("")}</div>
        <button onclick="addConfigItem('unite')" style="width:100%;padding:9px;border-radius:8px;border:1.5px dashed ${TH.c1};background:${TH.c1}08;color:${TH.c1};cursor:pointer;font-weight:600;font-size:13px;font-family:'Inter',sans-serif">＋ Ajouter une unité</button>
      </div>
    </div>
  </div>`;
}
function addConfigItem(type){
  const label=type==="cat"?"catégorie":"unité";
  const val=prompt(`Nouvelle ${label} :`);
  if(!val||!val.trim())return;
  const arr=type==="cat"?CAT_STOCK:UNITES;
  if(arr.includes(val.trim())){alert("Cette valeur existe déjà");return;}
  arr.push(val.trim());
  saveData();openPanelConfig();
}
function delConfigItem(type,i){
  const arr=type==="cat"?CAT_STOCK:UNITES;
  if(arr.length<=1){alert("Vous devez garder au moins une valeur");return;}
  if(!confirm(`Supprimer « ${arr[i]} » ?`))return;
  arr.splice(i,1);
  saveData();openPanelConfig();
}

// Page Factures dédiée (raccourci barre latérale)
function renderFactures(){
  const actives=FACTURES.filter(f=>facEnCompta(f)&&!["brouillon","annulee"].includes(f.statut));
  const totalEncaisse=actives.reduce((s,f)=>s+facPaye(f),0);
  const totalReste=actives.filter(f=>facStatutReel(f)!=="payee").reduce((s,f)=>s+facReste(f),0);
  const enRetard=FACTURES.filter(f=>facEnCompta(f)&&facStatutReel(f)==="retard");
  const resteRetard=enRetard.reduce((s,f)=>s+facReste(f),0);
  return `
    <div class="kpi-grid">
      ${kpi("Encaissé",fMoney(totalEncaisse),"#15803d",true)}
      ${kpi("Reste à encaisser",fMoney(totalReste),"#b45309",true)}
      ${kpi("En retard",fMoney(resteRetard),"#991b1b",true)}
      ${kpi("Factures impayées",actives.filter(f=>!facEstPayee(f)).length,TH.c1)}
    </div>
    ${enRetard.length>0?`<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">

// ── BANQUE (Qonto) ────────────────────────────────────────
// ══════════════════════════════════════════════════════════
async function fetchBanque(){
  banqueLoading=true; banqueErreur=null;
  if(currentPage==="banque") document.getElementById("content").innerHTML=renderBanque();
  try{
    const {data,error}=await sbClient.functions.invoke("qonto-solde",{});
    if(error) throw new Error(error.message);
    if(data&&data.error) throw new Error(data.error);
    BANQUE_DATA=data;
  }catch(e){
    banqueErreur=e.message||"Connexion à Qonto impossible.";
  }finally{
    banqueLoading=false;
    if(currentPage==="banque") document.getElementById("content").innerHTML=renderBanque();
  }
}
function fMontantSigne(t){
  const v=Number(t.montant||0);
  return (t.sens==="debit"?"-":"+")+v.toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
}
function fDateTrans(iso){
  if(!iso) return "—";
  const d=new Date(iso);
  if(isNaN(d)) return "—";
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
}
function renderBanque(){
  const refreshBtn=`<button onclick="fetchBanque()" ${banqueLoading?"disabled":""} style="padding:8px 14px;border-radius:9px;border:1.5px solid ${TH.c1};background:#fff;color:${TH.c1};cursor:pointer;font-size:13px;font-weight:700;font-family:'Inter',sans-serif">${banqueLoading?"⟳ Actualisation…":"🔄 Actualiser"}</button>`;

  if(banqueLoading&&!BANQUE_DATA){
    return `<div class="section-card"><div style="padding:40px 20px;text-align:center;color:${TH.txt}99">⟳ Connexion à Qonto…</div></div>`;
  }
  if(banqueErreur){
    return `<div class="section-card">
      <div class="section-head"><div class="section-title">🏦 Banque</div>${refreshBtn}</div>
      <div style="padding:20px">
        <div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:11px;padding:14px 16px;color:#991b1b;font-size:13px;margin-bottom:10px">
          <strong>Connexion Qonto impossible.</strong><br/>${banqueErreur}
        </div>
        <div style="font-size:12px;color:${TH.txt}80">Vérifie que la fonction Supabase <code>qonto-solde</code> est déployée et que les identifiants Qonto (QONTO_LOGIN / QONTO_SECRET_KEY) sont bien enregistrés dans ses secrets.</div>
      </div>
    </div>`;
  }
  if(!BANQUE_DATA){
    return `<div class="section-card"><div style="padding:40px 20px;text-align:center;color:${TH.txt}99">Aucune donnée bancaire pour le moment.${refreshBtn}</div></div>`;
  }
  const comptes=BANQUE_DATA.comptes||[];
  const transactions=BANQUE_DATA.transactions||[];
  const soldeTotal=comptes.reduce((s,c)=>s+Number(c.solde||0),0);

  return `
    <div class="kpi-grid">
      ${kpi("Solde total Qonto",fMoney(soldeTotal),"#15803d",true)}
      ${comptes.map(c=>kpi(c.nom||"Compte",fMoney(c.solde),TH.c1,true)).join("")}
    </div>
    <div class="section-card">
      <div class="section-head">
        <div><div class="section-title">🏦 Comptes Qonto</div><div class="section-sub">${comptes.length} compte(s) connecté(s)</div></div>
        ${refreshBtn}
      </div>
      <div style="padding:14px 20px">
        ${comptes.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)">
          <div><div style="font-weight:700;font-size:13.5px">${c.nom||"Compte"}</div><div style="font-size:11.5px;color:${TH.txt}80;font-family:monospace">${c.iban||""}</div></div>
          <div style="font-weight:800;font-size:16px;color:${Number(c.solde)>=0?"#15803d":"#991b1b"}">${fMoney(c.solde)}</div>
        </div>`).join("")||`<div style="padding:14px 0;color:${TH.txt}80;font-size:13px">Aucun compte trouvé.</div>`}
      </div>
    </div>
    ${renderRapprochement(transactions)}`;
}

// ── CAISSE : journal de toutes les transactions + comptage des espèces ──
// ══════════════════════════════════════════════════════════
// Le journal réunit automatiquement les règlements déjà saisis dans l'appli
// (factures clients, bons de commande non facturés, factures fournisseurs)
// et les mouvements saisis à la main dans la caisse (CAISSE.mouvements).
// Les comptages d'espèces (CAISSE.comptages) comparent le contenu réel de la
// caisse au solde espèces théorique calculé à partir du journal.
let CAISSE={mouvements:[],comptages:[]};
let caisseOnglet="journal";
let caisseFiltre={periode:"mois",du:"",au:"",sens:"tous",mode:"tous",q:""};
const CAISSE_CAT_ENTREE=["Vente comptoir","Encaissement divers","Apport de fonds","Retrait banque vers caisse","Remboursement reçu","Autre recette"];
const CAISSE_CAT_SORTIE=["Achat matériel","Fournitures","Carburant / déplacement","Frais divers","Dépôt en banque","Remboursement versé","Autre dépense"];
const CAISSE_BILLETS=[50000,20000,10000,5000,2000,1000,500];        // en centimes
const CAISSE_PIECES=[200,100,50,20,10,5,2,1];
const CAISSE_TYPES_CPT={ouverture:"Ouverture",cloture:"Clôture",controle:"Contrôle"};

function caisseNorm(){
  if(!CAISSE||typeof CAISSE!=="object") CAISSE={mouvements:[],comptages:[]};
  if(!Array.isArray(CAISSE.mouvements)) CAISSE.mouvements=[];
  if(!Array.isArray(CAISSE.comptages)) CAISSE.comptages=[];
}
function cEur(n){return (Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});}
function cEsc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function cCts(n){return Math.round((Number(n)||0)*100);}
function cDateLong(s){return s?new Date(s+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}):"—";}
function cCoupureLbl(c){return c>=100?(c/100)+" €":c+" c";}

// Toutes les transactions de l'entreprise, triées de la plus récente à la plus ancienne
function caisseLignes(){
  caisseNorm();
  const L=[];
  FACTURES.forEach(f=>(f.paiements||[]).forEach((p,i)=>L.push({
    id:"fac-"+f.id+"-"+i,date:p.date||f.date||"",sens:"entree",montant:Number(p.montant)||0,mode:p.mode||"Autre",
    cat:"Encaissement client",libelle:"Règlement facture "+(f.num||""),tiers:f.client||"",source:"Facture",ref:f.num||"",auto:true,srcType:"fac",srcId:f.id})));
  BCCLIENTS.filter(b=>b.statut!=="facture").forEach(b=>{
    const cli=CLIENTS.find(c=>c.id===b.clientId);
    (b.paiements||[]).forEach((p,i)=>L.push({
      id:"bcc-"+b.id+"-"+i,date:p.date||b.date||"",sens:"entree",montant:Number(p.montant)||0,mode:p.mode||"Autre",
      cat:"Acompte client",libelle:"Règlement bon de commande "+(b.num||""),tiers:cli?cli.nom:(b.client||""),source:"Bon de commande",ref:b.num||"",auto:true,srcType:"bcc",srcId:b.id}));
  });
  FACFOURN.forEach(f=>(f.paiements||[]).forEach((p,i)=>L.push({
    id:"ff-"+f.id+"-"+i,date:p.date||f.date||"",sens:"sortie",montant:Number(p.montant)||0,mode:p.mode||"Autre",
    cat:"Achat fournisseur",libelle:"Règlement facture fournisseur "+(f.numFour||f.num||""),tiers:f.four||"",source:"Facture fournisseur",ref:f.num||"",auto:true,srcType:"ff",srcId:f.id})));
  CAISSE.mouvements.forEach(m=>L.push({...m,montant:Number(m.montant)||0,source:"Caisse",ref:m.ref||"",auto:false}));
  return L.filter(l=>dateEnCompta(l.date)).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.ts||"").localeCompare(a.ts||""));
}
// Solde espèces théorique (toutes dates confondues, ou jusqu'à une date incluse)
function caisseSoldeEspeces(jusqua){
  return caisseLignes().filter(l=>l.mode==="Espèces"&&(!jusqua||(l.date||"")<=jusqua))
    .reduce((s,l)=>s+(l.sens==="entree"?cCts(l.montant):-cCts(l.montant)),0)/100;
}
function caisseBornes(){
  const t=getToday(),f=caisseFiltre,d=new Date(t+"T00:00:00");
  const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if(f.periode==="jour") return [t,t];
  if(f.periode==="semaine") return [weekStart(0),t];
  if(f.periode==="mois") return [t.slice(0,7)+"-01",t];
  if(f.periode==="moisprec"){const a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);return [iso(a),iso(b)];}
  if(f.periode==="annee") return [t.slice(0,4)+"-01-01",t];
  if(f.periode==="perso") return [f.du||"0000-01-01",f.au||"9999-12-31"];
  return ["0000-01-01","9999-12-31"];
}
function caisseLibPeriode(){
  const f=caisseFiltre;
  return {jour:"aujourd'hui",semaine:"cette semaine",mois:"ce mois-ci",moisprec:"le mois dernier",annee:"cette année",tout:"depuis le début",
    perso:(f.du?"du "+cDateLong(f.du):"")+(f.au?" au "+cDateLong(f.au):"")||"période choisie"}[f.periode]||"";
}
function caisseFiltrees(){
  const [du,au]=caisseBornes(),f=caisseFiltre,q=(f.q||"").trim().toLowerCase();
  return caisseLignes().filter(l=>{
    if((l.date||"")<du||(l.date||"")>au) return false;
    if(f.sens!=="tous"&&l.sens!==f.sens) return false;
    if(f.mode!=="tous"&&l.mode!==f.mode) return false;
    if(q&&![l.libelle,l.tiers,l.cat,l.ref,l.mode,l.note].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
}

// ── Page ──────────────────────────────────────────────────
function renderCaisse(){
  caisseNorm();
  const esp=caisseSoldeEspeces();
  const dernier=[...CAISSE.comptages].sort((a,b)=>(b.ts||"").localeCompare(a.ts||""))[0];
  const tab=(id,lbl)=>`<button onclick="caisseOnglet='${id}';renderPage()" style="padding:9px 16px;border-radius:999px;border:1.5px solid ${caisseOnglet===id?TH.c1:"#e2e8f0"};background:${caisseOnglet===id?TH.c1:"#fff"};color:${caisseOnglet===id?"#fff":"#475569"};cursor:pointer;font-size:13px;font-weight:700;font-family:'Inter',sans-serif">${lbl}</button>`;
  return `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
      ${tab("journal","📒 Journal des transactions")}${tab("comptage","🪙 Comptage des espèces")}
      <div style="flex:1"></div>
      <button class="btn-add" style="background:#15803d;color:#fff" onclick="modalCaisseMvt(null,'entree')">＋ Entrée</button>
      <button class="btn-add" style="background:#991b1b;color:#fff" onclick="modalCaisseMvt(null,'sortie')">－ Sortie</button>
    </div>
    ${caisseOnglet==="comptage"?renderCaisseComptage(esp,dernier):renderCaisseJournal(esp,dernier)}`;
}

function renderCaisseJournal(esp,dernier){
  const lignes=caisseFiltrees();
  const ent=lignes.filter(l=>l.sens==="entree").reduce((s,l)=>s+cCts(l.montant),0)/100;
  const sor=lignes.filter(l=>l.sens==="sortie").reduce((s,l)=>s+cCts(l.montant),0)/100;
  const modes=[...new Set([...MODES_PAIEMENT,...caisseLignes().map(l=>l.mode)])].filter(Boolean);
  const f=caisseFiltre;
  const sel=(id,val,opts)=>`<select onchange="caisseFiltre.${id}=this.value;renderPage()" style="padding:8px 10px;border-radius:9px;border:1.5px solid #e2e8f0;font-size:13px;background:#fff;font-family:'Inter',sans-serif">${opts.map(([v,l])=>`<option value="${v}" ${v===val?"selected":""}>${l}</option>`).join("")}</select>`;
  // Répartition par mode de paiement sur la période
  const parMode={};lignes.forEach(l=>{const k=l.mode||"Autre";parMode[k]=(parMode[k]||0)+(l.sens==="entree"?cCts(l.montant):-cCts(l.montant));});
  // Regroupement par jour
  const jours={};lignes.forEach(l=>{(jours[l.date||"—"]=jours[l.date||"—"]||[]).push(l);});
  const listeJours=Object.keys(jours).sort((a,b)=>b.localeCompare(a));
  return `
    <div class="kpi-grid">
      ${kpi("Entrées "+caisseLibPeriode(),cEur(ent),"#15803d",true)}
      ${kpi("Sorties "+caisseLibPeriode(),cEur(sor),"#991b1b",true)}
      ${kpi("Solde de la période",cEur(ent-sor),ent-sor>=0?TH.c1:"#991b1b",true)}
      ${kpi("Espèces en caisse (théorique)",cEur(esp),"#8a6d3b",true)}
    </div>
    ${dernier?`<div style="font-size:12px;color:#64748b;margin:-10px 0 16px">Dernier comptage : ${CAISSE_TYPES_CPT[dernier.type]||""} du ${cDateLong(dernier.date)} — ${cEur(dernier.total)}${Math.abs(dernier.ecart||0)>=0.005?` · écart ${dernier.ecart>0?"+":""}${cEur(dernier.ecart)}`:" · sans écart"}</div>`:""}
    <div class="section-card">
      <div class="section-head">
        <div><div class="section-title">📒 Journal de caisse</div><div class="section-sub">${lignes.length} transaction(s) ${caisseLibPeriode()}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn-sm" onclick="caisseExportCSV()">⬇️ Export CSV</button>
          <button class="btn-sm" onclick="caisseImprimerJournal()">🖨️ Imprimer / PDF</button>
        </div>
      </div>
      <div style="padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);align-items:center">
        ${sel("periode",f.periode,[["jour","Aujourd'hui"],["semaine","Cette semaine"],["mois","Ce mois-ci"],["moisprec","Mois dernier"],["annee","Cette année"],["tout","Tout"],["perso","Dates au choix…"]])}
        ${f.periode==="perso"?`<input type="date" value="${f.du}" onchange="caisseFiltre.du=this.value;renderPage()" style="padding:7px 9px;border-radius:9px;border:1.5px solid #e2e8f0;font-size:13px"/><input type="date" value="${f.au}" onchange="caisseFiltre.au=this.value;renderPage()" style="padding:7px 9px;border-radius:9px;border:1.5px solid #e2e8f0;font-size:13px"/>`:""}
        ${sel("sens",f.sens,[["tous","Entrées et sorties"],["entree","Entrées"],["sortie","Sorties"]])}
        ${sel("mode",f.mode,[["tous","Tous les modes"],...modes.map(m=>[m,m])])}
        <input id="caisse-q" placeholder="🔍 Rechercher…" value="${cEsc(f.q)}" onchange="caisseFiltre.q=this.value;renderPage()" style="flex:1;min-width:140px;padding:8px 12px;border-radius:9px;border:1.5px solid #e2e8f0;font-size:13px;font-family:'Inter',sans-serif"/>
      </div>
      ${Object.keys(parMode).length?`<div style="padding:10px 20px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)">
        ${Object.entries(parMode).map(([m,v])=>`<span style="font-size:11.5px;padding:4px 10px;border-radius:999px;background:#F7F4ED;color:#475569"><strong>${cEsc(m)}</strong> ${v>=0?"+":""}${cEur(v/100)}</span>`).join("")}
      </div>`:""}
      <div style="padding:4px 20px 14px">
        ${listeJours.length===0?`<div style="padding:30px 0;text-align:center;color:#94a3b8;font-size:13px">Aucune transaction sur cette période.</div>`:
        listeJours.map(j=>{
          const tot=jours[j].reduce((s,l)=>s+(l.sens==="entree"?cCts(l.montant):-cCts(l.montant)),0)/100;
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#94a3b8">
              <span>${j==="—"?"Sans date":new Date(j+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</span>
              <span style="color:${tot>=0?"#15803d":"#991b1b"}">${tot>=0?"+":""}${cEur(tot)}</span></div>
            ${jours[j].map(caisseLigneHTML).join("")}`;
        }).join("")}
      </div>
    </div>`;
}
function caisseLigneHTML(l){
  const ent=l.sens==="entree";
  const clic=l.auto?`caisseOuvrirSource('${l.srcType}','${l.srcId}')`:`modalCaisseMvt('${l.id}')`;
  return `<div onclick="${clic}" style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer">

      <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cEsc(l.libelle||l.cat||"—")}${l.piece?" 📎":""}</div>
      <div style="font-size:11px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cEsc(l.mode)} · ${cEsc(l.cat||"")}${l.tiers?" · "+cEsc(l.tiers):""}${l.auto?` · <span style="color:${TH.c1}">${cEsc(l.source)}</span>`:""}</div>
    </div>
    <div style="font-weight:800;font-size:14px;color:${ent?"#15803d":"#991b1b"};white-space:nowrap">${ent?"+":"−"}${cEur(l.montant)}</div>
  </div>`;
}
function caisseOuvrirSource(type,id){
  if(type==="fac") modalPaiement(id);
  else if(type==="bcc") modalPaiementBCC(id);
  else if(type==="ff") modalPaiementFF(id);
}

async function saveCaisseMvt(id){
  caisseNorm();
  const montant=Math.round((parseFloat(String(document.getElementById("cm-montant").value).replace(/\s/g,"").replace(",","."))||0)*100)/100;
  if(montant<=0){cmMsg("Indiquez un montant supérieur à 0.");return;}
  const ancien=id?CAISSE.mouvements.find(x=>x.id===id):null;
  const obj={
    sens:document.getElementById("cm-sens").value,
    montant,
    date:document.getElementById("cm-date").value||getToday(),
    mode:document.getElementById("cm-mode").value,
    cat:document.getElementById("cm-cat").value,
    libelle:document.getElementById("cm-lib").value.trim(),
    tiers:document.getElementById("cm-tiers").value.trim(),
    ref:document.getElementById("cm-ref").value.trim(),
    note:document.getElementById("cm-note").value.trim(),
  };
  if(!obj.libelle) obj.libelle=obj.cat;
  const mid=ancien?ancien.id:uid();
  const fichier=document.getElementById("cm-file").files[0];
  if(fichier){
    if(fichier.size>DOCS_MAX_MO*1048576){cmMsg(`Fichier trop lourd (${fTaille(fichier.size)}). Maximum ${DOCS_MAX_MO} Mo.`);return;}
    if(!currentUser||!currentUser.tenant_id){cmMsg("Session invalide, reconnectez-vous.");return;}
    const btn=document.getElementById("cm-btn");if(btn){btn.disabled=true;btn.textContent="⟳ Envoi du justificatif…";}
    const ext=(fichier.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
    const path=`${currentUser.tenant_id}/caisse/${mid}-${Date.now()}.${ext}`;
    try{
      const {error}=await sbClient.storage.from(DOCS_BUCKET).upload(path,fichier,{contentType:fichier.type||"application/octet-stream",upsert:false});
      if(error) throw error;
      if(ancien&&ancien.piece&&ancien.piece.path) sbClient.storage.from(DOCS_BUCKET).remove([ancien.piece.path]).catch(()=>{});
      obj.piece={path,nom:fichier.name,type:fichier.type,taille:fichier.size};
    }catch(e){
      cmMsg("Envoi du justificatif impossible : "+(e.message||e));
      if(btn){btn.disabled=false;btn.textContent="✓ Enregistrer";}
      return;
    }
  }
  if(ancien){
    Object.assign(ancien,obj);
    logActivity("Caisse — mouvement modifié",`${obj.sens==="entree"?"+":"−"}${cEur(montant)} · ${obj.libelle}`);
  }else{
    CAISSE.mouvements.push({id:mid,ts:new Date().toISOString(),par:currentUser?currentUser.nom:"",...obj});
    logActivity(obj.sens==="entree"?"Caisse — entrée":"Caisse — sortie",`${cEur(montant)} (${obj.mode}) · ${obj.libelle}`);
  }
  saveData();closeModal();renderPage();
}
function supprCaisseMvt(id){
  const m=CAISSE.mouvements.find(x=>x.id===id);if(!m)return;
  if(!confirm(`Supprimer ce mouvement de ${cEur(m.montant)} ?`))return;
  if(m.piece&&m.piece.path) sbClient.storage.from(DOCS_BUCKET).remove([m.piece.path]).catch(()=>{});
  CAISSE.mouvements=CAISSE.mouvements.filter(x=>x.id!==id);
  logActivity("Caisse — mouvement supprimé",`${m.sens==="entree"?"+":"−"}${cEur(m.montant)} · ${m.libelle||""}`);
  saveData();closeModal();renderPage();
}
async function caisseVoirPiece(id){
  const m=CAISSE.mouvements.find(x=>x.id===id);if(!m||!m.piece)return;
  const {data,error}=await sbClient.storage.from(DOCS_BUCKET).createSignedUrl(m.piece.path,3600);
  if(error||!data){alert("Impossible d'ouvrir le justificatif : "+(error?error.message:"introuvable"));return;}
  window.open(data.signedUrl,"_blank");
}
