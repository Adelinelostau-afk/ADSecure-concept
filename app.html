async function envoyerDoc(type,id){
  const T=DOC_ENVOI[type], d=T.liste().find(x=>x.id===id); if(!d) return;
  const cli=T.client(d);
  const to=document.getElementById("ev-to").value.trim();
  const sujet=document.getElementById("ev-sujet").value.trim()||`${T.prefixe} ${d.num}`;
  let texte=document.getElementById("ev-msg").value;
  const copie=document.getElementById("ev-copie").checked;
  const avecLien=type==="devis"&&document.getElementById("ev-signer")&&document.getElementById("ev-signer").checked;
  const err=document.getElementById("ev-msg-err"), btn=document.getElementById("ev-btn");
  const erreur=m=>{err.textContent="⚠️ "+m; err.style.display="block"; btn.disabled=false; btn.textContent="✉️ Envoyer";};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) return erreur("Adresse e-mail du destinataire invalide.");
  err.style.display="none"; btn.disabled=true; btn.textContent="⟳ Préparation du PDF…";
  try{
    if(avecLien){
      btn.textContent="⟳ Création du lien de signature…";
      const url=await creerLienSignature(d.id);
      texte=texte.replace(/\s+$/,"");
      const i=texte.search(/\n\s*Cordialement/i);
      const ajout=`\n\n✍️ Pour accepter ce devis, vous pouvez le signer en ligne en quelques secondes :\n${url}`;
      texte=i>=0?texte.slice(0,i)+ajout+texte.slice(i):texte+ajout;
    }
    const pdf=await htmlVersPdfBase64(T.html(d));
    btn.textContent="⟳ Envoi…";
    const nomFichier=`${T.prefixe} ${d.num}.pdf`.replace(/[\\/:*?"<>|]/g,"-");
    const {data,error}=await sbClient.functions.invoke("relances-auto",{body:{action:"email",to,subject:sujet,text:texte,copie,pieceJointe:{nom:nomFichier,contenu:pdf}}});
    let msg=data&&data.error;
    if(error){ try{ const b=await error.context.json(); msg=b.error||error.message; }catch(_){ msg=error.message; } }
    if(msg) return erreur(msg);
    d.envois=d.envois||[]; d.envois.push({date:getToday(),to});
    T.apresEnvoi(d);
    if(cli&&!cli.email) cli.email=to;
    logActivity(`${T.prefixe} envoyé${type==="facture"?"e":""} par e-mail`,`${d.num} → ${to}`);
    logDocument(type,d.id,d.num,cli?cli.nom:(d.client||""),T.ttc(d));
    saveData(); closeModal(); renderPage();
    alert(`✅ ${T.prefixe} ${d.num} envoyé${type==="facture"?"e":""} à ${to}.`);
  }catch(e){ erreur(e.message||String(e)); }
}

// Calcule le CA encaissé par mois sur les 6 derniers mois (depuis FACTURES payées)
function caParMois(){
  const mois=[];
  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=d.toISOString().slice(0,7);
    const label=d.toLocaleDateString("fr-FR",{month:"short"});
    // CA encaissé du mois = somme des règlements DATÉS dans ce mois
    const total=FACTURES.filter(f=>facEnCompta(f)&&!["brouillon","annulee"].includes(f.statut))
      .reduce((s,f)=>s+(f.paiements||[])
        .filter(p=>p.date&&p.date.slice(0,7)===key)
        .reduce((a,p)=>a+(p.montant||0),0),0);
    mois.push({key,label,total});
  }
  return mois;
}

// Graphique en courbe (CA par mois)
function lineChart(data,color,height){
  height=height||160;
  const w=520, h=height, padL=48, padB=28, padT=14, padR=12;
  const max=Math.max(...data.map(d=>d.total),1);
  const niceMax=Math.ceil(max/1000)*1000||1000;
  const cw=w-padL-padR, ch=h-padT-padB;
  const px=i=>padL+(data.length<=1?cw/2:i*cw/(data.length-1));
  const py=v=>padT+ch-(v/niceMax)*ch;
  const pts=data.map((d,i)=>`${px(i)},${py(d.total)}`).join(" ");
  const area=`${padL},${padT+ch} ${pts} ${px(data.length-1)},${padT+ch}`;
  // lignes de grille
  let grid="";
  for(let g=0;g<=3;g++){
    const y=padT+ch-(g/3)*ch;
    const val=Math.round(niceMax*g/3);
    grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e8e4dc" stroke-width="1"/>`;
    grid+=`<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#94a3b8">${val>=1000?(val/1000)+"k":val}</text>`;
  }
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    ${grid}
    <polygon points="${area}" fill="${color}" opacity="0.1"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${data.map((d,i)=>`<circle cx="${px(i)}" cy="${py(d.total)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/>

// Donut chart (répartition pipeline)
function donutChart(segments,centerLabel,centerValue){
  const total=segments.reduce((s,x)=>s+x.value,0)||1;
  const cx=80,cy=80,r=60,sw=22;
  let acc=0;
  const arcs=segments.filter(s=>s.value>0).map(s=>{
    const frac=s.value/total;
    const start=acc*2*Math.PI-Math.PI/2;
    acc+=frac;
    const end=acc*2*Math.PI-Math.PI/2;
    const large=frac>0.5?1:0;
    const x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start);
    const x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);
    return`<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${s.color}" stroke-width="${sw}"/>`;
  }).join("");
  return`<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
    <svg viewBox="0 0 160 160" style="width:140px;height:140px;flex-shrink:0">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f1ede5" stroke-width="${sw}"/>
      ${arcs}
      <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="20" font-weight="700" fill="#1A2118">${centerValue}</text>
      <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="9" fill="#94a3b8">${centerLabel}</text>
    </svg>
    <div style="flex:1;min-width:120px">
      ${segments.map(s=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="width:11px;height:11px;border-radius:3px;background:${s.color};flex-shrink:0"></span>
        <span style="font-size:12px;color:#475569;flex:1">${s.label}</span>
        <span style="font-size:12px;font-weight:700;color:#1A2118">${s.value}</span>
      </div>`).join("")}
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════
// ── FICHE CLIENT ────────────────────────────────────────
// ════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════
// ── GRAND LIVRE CLIENT (compte client dans la fiche) ──────
// ══════════════════════════════════════════════════════════
// Débit = ce que le client doit (factures émises), crédit = ce qu'il a réglé
// (règlements des factures + acomptes versés sur un bon de commande pas encore facturé).
// Solde > 0 : compte débiteur (le client doit de l'argent) ; solde < 0 : compte créditeur (avance).
let glcFiltre={};   // période par client : {clientId:"tout"|"annee"|...}
function glcEsc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function glcEur(n){return (Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});}
function glcR(n){return Math.round((Number(n)||0)*100)/100;}
function glcFacturesClient(c){
  return FACTURES.filter(f=>facEnCompta(f)&&(f.clientId===c.id||(!f.clientId&&f.client&&f.client===c.nom))&&f.statut!=="brouillon"&&f.statut!=="annulee");
}
function glcBCClient(c){ return BCCLIENTS.filter(b=>b.clientId===c.id); }
// Retrouve la chaîne devis → bon de commande → facture
function glcChaineFacture(f){
  const bc=BCCLIENTS.find(b=>b.factureNum&&b.factureNum===f.num&&(b.clientId===f.clientId||!f.clientId));
  const dv=bc&&bc.devisId?DEVIS.find(d=>d.id===bc.devisId):null;
  return {bc,dv:dv||null,devisNum:dv?dv.num:(bc&&bc.devisNum)||f.devisNum||""};
}
function glcEcritures(c){
  const E=[];
  glcFacturesClient(c).forEach(f=>{
    const ch=glcChaineFacture(f);
    E.push({date:facDate(f)||"",ordre:0,piece:f.num,type:"fac",id:f.id,
      libelle:"Facture"+(f.refChantier?" — "+f.refChantier:"")+(ch.devisNum?" (devis "+ch.devisNum+")":""),
      debit:glcR(facTTC(f)),credit:0,ech:f.ech||"",statut:facStatutReel(f)});
    (f.paiements||[]).forEach(p=>E.push({date:p.date||facDate(f)||"",ordre:1,piece:f.num,type:"reg",id:f.id,
      libelle:"Règlement "+(p.mode||"")+" sur "+f.num,debit:0,credit:glcR(p.montant)}));
    // Facture marquée « Payée » à la main sans détail du règlement : on solde le reste
    if(f.statut==="payee"&&facReste(f)>0.004) E.push({date:facDate(f)||"",ordre:2,piece:f.num,type:"reg",id:f.id,
      libelle:"Règlement (facture marquée payée, mode non renseigné)",debit:0,credit:glcR(facReste(f))});
  });
  glcBCClient(c).filter(b=>b.statut!=="facture").forEach(b=>(b.paiements||[]).filter(p=>dateEnCompta(p.date||b.date)).forEach(p=>E.push({
    date:p.date||b.date||"",ordre:1,piece:b.num,type:"acompte",id:b.id,
    libelle:"Acompte "+(p.mode||"")+" sur "+b.num+(b.devisNum?" (devis "+b.devisNum+")":""),debit:0,credit:glcR(p.montant)})));
  const E2=E.filter(e=>e.type==='fac'||dateEnCompta(e.date)||glcFacturesClient(c).some(f=>f.num===e.piece));E.length=0;E.push(...E2);
  E.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.ordre-b.ordre);
  let s=0;E.forEach(e=>{s=glcR(s+e.debit-e.credit);e.solde=s;});
  return E;
}
function glcSynthese(c){
  const E=glcEcritures(c);
  const debit=glcR(E.reduce((s,e)=>s+e.debit,0)),credit=glcR(E.reduce((s,e)=>s+e.credit,0));
  const solde=glcR(debit-credit);
  const facs=glcFacturesClient(c);
  const enRetard=facs.filter(f=>facStatutReel(f)!=="payee"&&facReste(f)>0&&f.ech&&f.ech<getToday());
  const echu=glcR(enRetard.reduce((s,f)=>s+facReste(f),0));
  const nbRetard=enRetard.length;
  // Devis acceptés pas encore transformés en BC ni facturés = carnet de commandes à venir
  const aVenir=glcR(DEVIS.filter(d=>d.clientId===c.id&&d.statut==="accepte"&&!BCCLIENTS.some(b=>b.devisId===d.id)).reduce((s,d)=>s+glcR(devisTTC(d)),0)
    +glcBCClient(c).filter(b=>b.statut!=="facture").reduce((s,b)=>s+glcR(devisTTC(b)),0));
  const acomptes=glcR(E.filter(e=>e.type==="acompte").reduce((s,e)=>s+e.credit,0));
  return {E,debit,credit,solde,echu,nbRetard,aVenir,acomptes};
}
function glcEtat(solde,acomptes){
  if(solde>0.004) return {lbl:"Débiteur",bg:"#fee2e2",col:"#991b1b",txt:"Le client vous doit"};
  if(solde<-0.004&&acomptes>0.004&&Math.abs(solde)<=acomptes+0.004) return {lbl:"Acompte reçu",bg:"#e8f4f8",col:"#3286A0",txt:"À déduire de la future facture"};
  if(solde<-0.004) return {lbl:"Créditeur",bg:"#e8f4f8",col:"#3286A0",txt:"Avance du client"};
  return {lbl:"Soldé",bg:"#dcfce7",col:"#15803d",txt:"Compte à jour"};
}

  const debut=per==="annee"?t.slice(0,4)+"-01-01":per==="12m"?addDays(t,-365):"";
  // Report à nouveau : solde des écritures antérieures à la période affichée
  const avant=debut?S.E.filter(e=>(e.date||"")<debut):[];

  const clic=e=>e.type==="acompte"?`modalPaiementBCC('${e.id}')`:e.type==="reg"?`modalPaiement('${e.id}')`:`modalFacture('${e.id}')`;
  return `<div class="section-card" style="background:${TH.card}">
    <div class="section-head">
      <div><div class="section-title" style="color:${TH.txt}">📒 Grand livre client</div><div class="section-sub">Factures, règlements et acomptes de ${glcEsc(c.nom)}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn-sm" onclick="glcImprimer('${c.id}')">📄 Relevé de compte PDF</button>
        <button class="btn-sm" onclick="glcExportCSV('${c.id}')">⬇️ CSV</button>
      </div>
    </div>
    <div style="padding:16px 18px 6px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">
      <div style="background:${et.bg};border-radius:12px;padding:12px 14px">
        <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:${et.col}">Solde · ${et.lbl}</div>
        <div style="font-size:20px;font-weight:800;color:${et.col};margin-top:2px">${glcEur(Math.abs(S.solde))}</div>
        <div style="font-size:11px;color:${et.col}">${et.txt}</div>
      </div>
      <div style="background:#F7F4ED;border-radius:12px;padding:12px 14px">
        <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#64748b">Total facturé</div>
        <div style="font-size:17px;font-weight:800;margin-top:2px">${glcEur(S.debit)}</div></div>
      <div style="background:#F7F4ED;border-radius:12px;padding:12px 14px">
        <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#64748b">Total réglé</div>
        <div style="font-size:17px;font-weight:800;color:#15803d;margin-top:2px">${glcEur(S.credit)}</div></div>
      <div style="background:${S.echu>0?"#fef2f2":"#F7F4ED"};border-radius:12px;padding:12px 14px">
        <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:${S.echu>0?"#991b1b":"#64748b"}">Échu impayé</div>

function glcFacDuBC(bc){
  if(!bc.factureNum) return null;
  return FACTURES.find(x=>x.num===bc.factureNum&&x.clientId===bc.clientId)||FACTURES.find(x=>x.num===bc.factureNum)||null;
}
// Correspondance devis → bon de commande → facture → règlements
function renderGlcCorrespondances(c){
  const devis=DEVIS.filter(d=>d.clientId===c.id&&["accepte","transforme"].includes(d.statut)||(d.clientId===c.id&&BCCLIENTS.some(b=>b.devisId===d.id)));
  const vus=new Set();
  const chaines=[];
  devis.forEach(d=>{
    const bcs=BCCLIENTS.filter(b=>b.devisId===d.id);
    if(bcs.length===0) chaines.push({d,bc:null,f:null});
    bcs.forEach(bc=>{const f=glcFacDuBC(bc);if(f)vus.add(f.id);vus.add("bc"+bc.id);chaines.push({d,bc,f});});
  });
  glcBCClient(c).filter(b=>!vus.has("bc"+b.id)).forEach(bc=>{const f=glcFacDuBC(bc);if(f)vus.add(f.id);chaines.push({d:null,bc,f});});
  glcFacturesClient(c).filter(f=>!vus.has(f.id)).forEach(f=>chaines.push({d:null,bc:null,f}));
  if(!chaines.length) return "";
  const etape=(ico,lbl,num,montant,sub,onclick,actif)=>`<div onclick="${onclick||""}" style="flex:1;min-width:120px;padding:9px 11px;border-radius:10px;border:1.5px solid ${actif?TH.c1+"55":"#e2e8f0"};background:${actif?"#fff":"#f8fafc"};cursor:${onclick?"pointer":"default"};opacity:${actif?1:0.55}">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#94a3b8">${ico} ${lbl}</div>
      <div style="font-weight:700;font-size:12.5px;color:${actif?TH.c1:"#94a3b8"}">${num?glcEsc(num):"—"}</div>
      ${montant!==null?`<div style="font-size:12px;font-weight:700">${glcEur(montant)}</div>`:""}
      ${sub?`<div style="font-size:10.5px;color:#64748b">${sub}</div>`:""}</div>`;
  const fl=`<div style="align-self:center;color:#cbd5e1;font-size:14px">→</div>`;
  return `<div style="padding:4px 18px 16px">
    <div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em;margin:6px 0 8px">Correspondance des documents</div>
    ${chaines.sort((a,b)=>((b.f&&facDate(b.f))||(b.bc&&b.bc.date)||(b.d&&b.d.date)||"").localeCompare((a.f&&facDate(a.f))||(a.bc&&a.bc.date)||(a.d&&a.d.date)||"")).map(({d,bc,f})=>{
      const payeBC=bc&&bc.statut!=="facture"?bccPaye(bc):0;
      const regle=glcR(f?(f.statut==="payee"?Math.max(facPaye(f),facTTC(f)):facPaye(f)):payeBC), du=glcR(f?facTTC(f):(bc?devisTTC(bc):(d?devisTTC(d):0)));
      const reste=glcR(Math.max(0,du-regle));
      const fst=f?facStatutReel(f):"";
      return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:stretch">
        ${etape("📝","Devis",d&&d.num,d?devisTTC(d):null,d?fDate(d.date):"",d?`modalDevis('${d.id}')`:"",!!d)}${fl}
        ${etape("📋","Bon de commande",bc&&bc.num,null,bc?fDate(bc.date):"",bc?`modalBCC('${bc.id}')`:"",!!bc)}${fl}
        ${etape("🧾","Facture",f&&f.num,f?facTTC(f):null,f?fDate(facDate(f)):"",f?`modalFacture('${f.id}')`:"",!!f)}${fl}
        ${etape("💶","Réglé",regle>0?glcEur(regle):"",null,reste>0.004?`<span style="color:${fst==="retard"?"#991b1b":"#b45309"};font-weight:700">Reste ${glcEur(reste)}</span>`:(du>0?`<span style="color:#15803d;font-weight:700">✓ Soldé</span>`:""),f?`modalPaiement('${f.id}')`:(bc?`modalPaiementBCC('${bc.id}')`:""),regle>0)}
      </div>`;}).join("")}
  </div>`;
}

function glcExportCSV(clientId){
  const c=CLIENTS.find(x=>x.id===clientId);if(!c)return;
  const E=glcEcritures(c);
  const n=v=>v?(Number(v).toFixed(2).replace(".",",")):"";
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const rows=[["Date","Pièce","Libellé","Débit","Crédit","Solde"]].concat(E.map(e=>[e.date,e.piece,e.libelle,n(e.debit),n(e.credit),Number(e.solde).toFixed(2).replace(".",",")]));
  const blob=new Blob(["﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`grand-livre_${c.nom.replace(/[^a-z0-9]+/gi,"-")}_${getToday()}.csv`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

// ── PARC INSTALLÉ (équipements posés chez chaque client) ──
// ══════════════════════════════════════════════════════════
// Stocké dans la fiche client : c.parc = [{id,type,marque,modele,ref,serie,mac,ip,emplacement,dateInstall,garantieMois,statut,notes,source}]
const PARC_TYPES=["Caméra","Enregistreur","Disque dur","Switch / réseau","Alarme","Domotique","Écran","Onduleur","Autre"];
const PARC_ICON={"Caméra":"📷","Enregistreur":"📼","Disque dur":"💽","Switch / réseau":"🔌","Alarme":"🚨","Domotique":"💡","Écran":"🖥️","Onduleur":"🔋","Autre":"🔧"};
const PARC_ST={actif:["#dcfce7","#15803d","En service"],surveiller:["#fef9c3","#a16207","À surveiller"],hs:["#fee2e2","#991b1b","Hors service"],remplace:["#f1f5f9","#64748b","Remplacé"],retire:["#f1f5f9","#94a3b8","Retiré"]};
const PARC_CAT_TYPE={"Caméras":"Caméra","Enregistreurs":"Enregistreur","Réseau":"Switch / réseau","Alarme":"Alarme","Domotique":"Domotique"};
function pE(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function parcGarantieFin(x){
  if(!x.dateInstall) return "";
  const m=Number(x.garantieMois!=null&&x.garantieMois!==""?x.garantieMois:24)||0;
  const d=new Date(x.dateInstall+"T12:00:00");d.setMonth(d.getMonth()+m);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function parcGarantieBadge(x){
  const fin=parcGarantieFin(x);
  if(!fin) return `<span style="font-size:11px;color:#94a3b8">garantie n.c.</span>`;
  const j=daysDiff(fin);
  if(j<0) return badge("Garantie expirée","#f1f5f9","#64748b");
  if(j<=60) return badge("Garantie → "+fDate(fin),"#fef9c3","#a16207");
  return badge("Garantie → "+fDate(fin)+" "+fin.slice(0,4),"#e8f4f8","#3286A0");
}
function parcActifs(c){return (c.parc||[]).filter(x=>!["remplace","retire"].includes(x.statut));}

function renderParcSection(c){
  const parc=(c.parc||[]);
  const actifs=parcActifs(c);
  const anciens=parc.filter(x=>["remplace","retire"].includes(x.statut));
  const parType={};actifs.forEach(x=>{(parType[x.type||"Autre"]=parType[x.type||"Autre"]||[]).push(x);});
  const resume=PARC_TYPES.filter(t=>parType[t]).map(t=>`${PARC_ICON[t]} ${parType[t].length} ${t.toLowerCase()}${parType[t].length>1&&!/s$/.test(t)?"s":""}`).join(" · ");
  const sousGarantie=actifs.filter(x=>{const f=parcGarantieFin(x);return f&&f>=getToday();}).length;
  const ligne=x=>{const st=PARC_ST[x.statut||"actif"]||PARC_ST.actif;return `<div onclick="modalParc('${c.id}','${x.id}')" style="padding:10px 18px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap">

        <div style="font-size:11px;color:#64748b">${x.serie?"S/N "+pE(x.serie):"N° de série non renseigné"}${x.ip?" · IP "+pE(x.ip):""}${x.dateInstall?" · posé le "+fDate(x.dateInstall)+" "+x.dateInstall.slice(0,4):""}</div>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">${badge(st[2],st[0],st[1])}${parcGarantieBadge(x)}</div>
    </div>`;};
  return `<div class="section-card" style="background:${TH.card}">
    <div class="section-head">
      <div><div class="section-title" style="color:${TH.txt}">📦 Parc installé</div><div class="section-sub">${actifs.length} équipement(s) en place${sousGarantie?" · "+sousGarantie+" sous garantie":""}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${parc.length?`<button class="btn-sm" onclick="imprimerParc('${c.id}')">📄 Fiche PDF</button>`:""}
        <button class="btn-sm" onclick="modalDossierRemise('${c.id}')" style="border-color:${TH.c1}55;color:${TH.c1};font-weight:700">📘 Dossier de remise</button>
        <button class="btn-sm" onclick="modalImportParc('${c.id}')">⬇️ Depuis une facture</button>
        <button class="btn-add" style="background:${TH.c1};color:#fff" onclick="modalParc('${c.id}','')">＋ Équipement</button>
      </div>
    </div>
    ${resume?`<div style="padding:10px 18px;font-size:12px;color:#475569;border-bottom:1px solid #f1f5f9">${resume}</div>`:""}
    ${parc.length===0?`<div style="padding:26px;text-align:center;color:${TH.txt}66;font-size:13px">Aucun équipement enregistré.<br/>Ajoutez-les un par un ou importez-les depuis une facture.</div>`:""}
    ${PARC_TYPES.filter(t=>parType[t]).map(t=>parType[t].map(ligne).join("")).join("")}
    ${anciens.length?`<details style="padding:6px 18px 10px"><summary style="cursor:pointer;font-size:12px;color:#64748b;padding:6px 0">${anciens.length} équipement(s) remplacé(s) ou retiré(s)</summary>${anciens.map(ligne).join("")}</details>`:""}
  </div>`;
}

  else{c.parc.push({id:uid(),source:"manuel",...obj});logActivity("Équipement ajouté",`${c.nom} — ${obj.type} ${obj.marque} ${obj.modele}`);}

function validerImportParc(clientId){

function riCompresser(file){
  return new Promise((ok,ko)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const max=1400;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      const data=cv.toDataURL("image/jpeg",0.78);cv.toBlob(b=>b?ok({blob:b,data}):ko(new Error("Compression impossible")),"image/jpeg",0.78);};
    img.onerror=()=>{URL.revokeObjectURL(url);ko(new Error("Image illisible"));};img.src=url;
  });
}
async function riAjouterPhotos(files){
  const r=window._ri;if(!files||!files.length)return;
  if(!currentUser||!currentUser.tenant_id){alert("Session invalide, reconnectez-vous.");return;}
  if(!r._tmpId) r._tmpId=r.id||uid();
  for(const f of [...files].slice(0,12)){
    const p={id:uid(),path:"",legende:"",envoi:true};r.photos.push(p);
    document.getElementById("ri-photos").innerHTML=riPhotosHTML();
    try{
      const {blob,data}=await riCompresser(f);
      p.path=`${currentUser.tenant_id}/interventions/${r._tmpId}/${p.id}.jpg`;
      RI_DATA[p.path]=data;
      const {error}=await sbClient.storage.from(DOCS_BUCKET).upload(p.path,blob,{contentType:"image/jpeg",upsert:false});
      if(error) throw error;
      delete p.envoi;
    }catch(e){
      r.photos=r.photos.filter(x=>x!==p);
      alert("Photo non enregistrée : "+(e.message||e));
    }
    const box=document.getElementById("ri-photos");if(box&&window._ri===r)box.innerHTML=riPhotosHTML();
  }
}
function riSupprPhoto(i){
  const r=window._ri,p=r.photos[i];if(!p)return;
  if(!confirm("Retirer cette photo ?"))return;
  if(p.path) sbClient.storage.from(DOCS_BUCKET).remove([p.path]).catch(()=>{});
  r.photos.splice(i,1);document.getElementById("ri-photos").innerHTML=riPhotosHTML();
  if(r.id){const o=INTERVENTIONS.find(x=>x.id===r.id);if(o){o.photos=(o.photos||[]).filter(x=>x.path!==p.path);saveData();}}
}
async function riChargerURLs(r){
  const manquants=(r.photos||[]).map(p=>p.path).filter(p=>p&&!RI_URLS[p]&&!RI_DATA[p]);
  if(!manquants.length)return;
  try{const {data}=await sbClient.storage.from(DOCS_BUCKET).createSignedUrls(manquants,3600);(data||[]).forEach(x=>{if(x.signedUrl)RI_URLS[x.path]=x.signedUrl;});}catch(e){}
}
// Images en data: pour fabriquer le PDF (évite les blocages d'images externes)
async function riPrechargerPhotos(r){
  await riChargerURLs(r);
  await Promise.all((r.photos||[]).filter(p=>p.path&&!RI_DATA[p.path]&&RI_URLS[p.path]).map(async p=>{
    try{const b=await (await fetch(RI_URLS[p.path])).blob();RI_DATA[p.path]=await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(b);});}catch(e){}
  }));
}

function riSigZoneHTML(){
  const r=window._ri;
  if(r.sigClient) return `<div style="border:1.5px solid #e2e8f0;border-radius:12px;background:#fff;padding:8px;text-align:center"><img src="${r.sigClient}" style="max-width:100%;height:140px;object-fit:contain"/>
    <div style="font-size:11px;color:#64748b">Signé le ${fDate(r.sigDate)} ${(r.sigDate||"").slice(0,4)}</div>
    <button type="button" class="btn-sm" style="margin-top:6px" onclick="window._ri.sigClient='';window._ri.sigDate='';document.getElementById('ri-sigzone').innerHTML=riSigZoneHTML();riInitSignature()">↺ Refaire la signature</button></div>`;
  return `<div style="position:relative"><canvas id="ri-canvas" style="width:100%;height:170px;border:2px dashed #cbd5e1;border-radius:12px;background:#fff;touch-action:none;display:block"></canvas>
    <div id="ri-canvas-hint" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:14px;pointer-events:none">Le client signe ici avec le doigt</div></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px"><span style="font-size:11px;color:#94a3b8">En signant, le client atteste de la réalisation de l'intervention.</span><button type="button" class="btn-sm" onclick="riEffacerSig()">Effacer</button></div>`;
}
function riInitSignature(){
  const cv=document.getElementById("ri-canvas");if(!cv)return;
  const ratio=Math.max(1,window.devicePixelRatio||1);
  const rect=cv.getBoundingClientRect();cv.width=Math.round(rect.width*ratio);cv.height=Math.round(rect.height*ratio);
  const ctx=cv.getContext("2d");ctx.scale(ratio,ratio);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#1A2118";
  let dessin=false,dernier=null;window._riSigVide=true;
  const pos=e=>{const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};};
  cv.onpointerdown=e=>{dessin=true;dernier=pos(e);cv.setPointerCapture(e.pointerId);const h=document.getElementById("ri-canvas-hint");if(h)h.style.display="none";
    ctx.beginPath();ctx.arc(dernier.x,dernier.y,1.2,0,Math.PI*2);ctx.fillStyle="#1A2118";ctx.fill();window._riSigVide=false;e.preventDefault();};
  cv.onpointermove=e=>{if(!dessin)return;const p=pos(e);ctx.beginPath();ctx.moveTo(dernier.x,dernier.y);ctx.lineTo(p.x,p.y);ctx.stroke();dernier=p;e.preventDefault();};
  cv.onpointerup=cv.onpointercancel=()=>{dessin=false;};
}
function riEffacerSig(){const cv=document.getElementById("ri-canvas");if(!cv)return;cv.getContext("2d").clearRect(0,0,cv.width,cv.height);window._riSigVide=true;const h=document.getElementById("ri-canvas-hint");if(h)h.style.display="flex";}
function riLireSignature(){
  const cv=document.getElementById("ri-canvas");if(!cv||window._riSigVide)return "";
  // version réduite (PNG) pour rester léger
  const out=document.createElement("canvas");const w=600,h=Math.round(600*cv.height/cv.width);out.width=w;out.height=h;
  const ctx=out.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(cv,0,0,w,h);
  return out.toDataURL("image/png");
}

function riMsg(t){const b=document.getElementById("ri-msg");if(!b)return;b.style.display="block";b.textContent=t;b.scrollIntoView({behavior:"smooth",block:"center"});}
function saveRI(final){
  const r=window._ri;if(!r)return;
  riLireChamps();
  if(r.photos.some(p=>p.envoi)){riMsg("Patientez : des photos sont encore en cours d'envoi.");return;}
  const sig=riLireSignature();
  if(sig){r.sigClient=sig;r.sigDate=getToday();}
  if(final&&r.statut!=="signe"){
    if(!r.travaux&&!r.checklist.some(x=>x.ok!==null)){riMsg("Renseignez au moins les travaux réalisés ou les points de contrôle.");return;}
    if(!r.sigClient){riMsg("La signature du client est nécessaire pour valider le rapport (ou enregistrez-le en brouillon).");return;}
    if(!r.sigNom){riMsg("Indiquez le nom du signataire.");return;}
    if(!r.hFin){const n=new Date();r.hFin=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");}
    r.statut="signe";
  }
  const c=riClient(r);
  // Report de l'état des équipements dans le parc du client
  if(c&&r.statut==="signe"){
    (r.equipements||[]).forEach(e=>{const x=(c.parc||[]).find(p=>p.id===e.parcId);if(!x)return;
      if(e.etat==="hs")x.statut="hs";else if(e.etat==="remplace")x.statut="remplace";else if(e.etat==="surveiller")x.statut="surveiller";else if(e.etat==="ok"&&["hs","surveiller"].includes(x.statut))x.statut="actif";});
  }
  const rec={...r};delete rec._nouveau;
  rec.equipements=(rec.equipements||[]).filter(e=>e.etat||e.note);
  rec.photos=(rec.photos||[]).map(p=>({id:p.id,path:p.path,legende:p.legende||""}));
  if(!rec.id){rec.id=r._tmpId||uid();delete rec._tmpId;INTERVENTIONS.push(rec);logActivity("Rapport d'intervention créé",`${rec.num} — ${c?c.nom:""}`);}
  else{delete rec._tmpId;const i=INTERVENTIONS.findIndex(x=>x.id===rec.id);if(i>=0)INTERVENTIONS[i]=rec;else INTERVENTIONS.push(rec);logActivity("Rapport d'intervention "+(final?"validé":"enregistré"),`${rec.num} — ${c?c.nom:""}`);}
  // L'intervention planifiée est marquée comme faite
  if(rec.eventId){const ev=EVENTS.find(x=>x.id===rec.eventId);if(ev){ev.riId=rec.id;}}
  saveData();renderPage();
  if(final&&rec.statut==="signe"){
    showModal("✅ Rapport validé",`<div style="text-align:center;padding:10px 0"><div style="font-size:40px">✍️</div>
      <div style="font-weight:700;font-size:15px;margin:6px 0">${pE(rec.num)} signé par ${pE(rec.sigNom)}</div>
      <div style="font-size:13px;color:#64748b">Le parc du client a été mis à jour.</div></div>`,
      `<button class="btn-cancel" onclick="closeModal()">Fermer</button>
       <button class="btn-cancel" onclick="genererRIPDF('${rec.id}')">📄 PDF</button>
       <button class="btn-save" style="background:${TH.c1}" onclick="modalEnvoiRI('${rec.id}')">✉️ Envoyer au client</button>`);
  }else{closeModal();}
}
function supprRI(id){
  const r=INTERVENTIONS.find(x=>x.id===id);if(!r)return;
  if(!confirm(`Supprimer définitivement le rapport ${r.num} et ses photos ?`))return;
  const paths=(r.photos||[]).map(p=>p.path).filter(Boolean);
  if(paths.length) sbClient.storage.from(DOCS_BUCKET).remove(paths).catch(()=>{});
  INTERVENTIONS=INTERVENTIONS.filter(x=>x.id!==id);
  EVENTS.forEach(e=>{if(e.riId===id)delete e.riId;});
  logActivity("Rapport d'intervention supprimé",r.num);
  saveData();closeModal();renderPage();
}

      ${ri.travaux?`<h2>Travaux réalisés</h2><div class="box">${pE(ri.travaux)}</div>`:""}
      ${ri.observations?`<h2>Observations</h2><div class="box">${pE(ri.observations)}</div>`:""}
      <p style="margin-top:18px">Le client reconnaît que l'installation a été mise en service, que son fonctionnement lui a été présenté et qu'il a reçu le présent dossier${ok.some(x=>x.ok===false)?", sous les réserves indiquées ci-dessus":", sans réserve"}.</p>
      <div style="display:flex;gap:24px;margin-top:16px">
        <div class="sig"><div class="lbl">Pour ${pE(ent)}</div><div style="margin-top:8px;font-weight:700">${pE(ri.technicien||"")}</div></div>

      <div class="bloc"><h2>Maintenance</h2><p>${contrat?`Votre contrat de maintenance${contrat.forfaitLabel?" (forfait "+pE(contrat.forfaitLabel)+")":""} prévoit une visite préventive tous les six mois : nettoyage, contrôle de l'enregistrement, mises à jour et tests. Vous êtes prévenu par e-mail avant chaque visite.`:`Une visite préventive tous les six mois (nettoyage des optiques, contrôle de l'enregistrement, mises à jour) prolonge la durée de vie de votre installation. Demandez-nous notre contrat de maintenance.`}</p></div>
      <div class="bloc contact"><h2>Nous contacter</h2>

        ${o.horaires?`<div style="margin-top:6px">🕘 ${pE(o.horaires)}</div>`:""}
        <p style="margin-top:10px;font-size:12px;color:#475569">Pour un dépannage plus rapide, indiquez le nom de la caméra concernée et, si possible, le numéro de série figurant dans la fiche du matériel.</p></div>`,++n));
  }
  return `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><base href="${location.href}"/><title>Dossier de remise — ${pE(c.nom)}</title><style>
    @page{size:A4;margin:0}

    h1{font-size:22px;margin:0 0 16px;display:flex;align-items:center;gap:12px}
    h1 .num{display:inline-flex;width:34px;height:34px;border-radius:50%;background:${TH.c1};color:#fff;font-size:16px;align-items:center;justify-content:center}

    .sig{flex:1;border:1px solid #e8e4dc;border-radius:8px;padding:10px 12px;min-height:120px}.sig .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;font-weight:700}

// ── DEVIS SIGNÉS (fichiers stockés dans Supabase Storage) ──

// Les fichiers vont dans le bucket privé "devis-signes", dossier = tenant_id.
// Seules les métadonnées (nom, chemin, date, devis lié) sont enregistrées dans la fiche client.
const DOCS_BUCKET="devis-signes";
const DOCS_MAX_MO=10;

function fTaille(o){ if(!o) return ""; return o>1048576?(o/1048576).toFixed(1)+" Mo":Math.round(o/1024)+" Ko"; }

function renderDocsSignesSection(c){
  const docs=(c.docsSignes||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return `<div class="section-card" style="background:${TH.card}">
    <div class="section-head">
      <div><div class="section-title" style="color:${TH.txt}">✍️ Devis signés</div><div class="section-sub">${docs.length} document(s)</div></div>
      <button class="btn-add" style="background:${TH.c1};color:#fff" onclick="modalDocSigne('${c.id}','')">＋ Ajouter un devis signé</button>
    </div>
    ${docs.length===0?`<div style="padding:28px;text-align:center;color:${TH.txt}66;font-size:13px">Aucun devis signé pour ce client.<br/>Photographiez ou importez le devis signé (PDF ou photo).</div>`:
    docs.map(x=>`<div style="padding:12px 18px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span style="font-size:22px">${(x.type||"").startsWith("image/")?"🖼️":"📄"}</span>
      <div style="flex:1;min-width:180px">
        <div style="font-weight:700;font-size:13px;color:${TH.txt}">${x.devisNum?x.devisNum+" — ":""}${x.nom||"Document"}</div>
        <div style="font-size:11px;color:${TH.txt}77">Signé le ${fDate(x.dateSignature||x.date)} · ajouté le ${fDate(x.date)}${x.taille?" · "+fTaille(x.taille):""}</div>
        ${x.note?`<div style="font-size:11px;color:${TH.txt}88;font-style:italic;margin-top:2px">${x.note}</div>`:""}
      </div>
      <div style="display:flex;gap:5px;flex-shrink:0">
        <button class="btn-sm" onclick="voirDocSigne('${c.id}','${x.id}')" title="Voir" style="border-color:#93c5fd;background:#eff6ff;color:#1d4ed8">👁️</button>
        <button class="btn-sm btn-danger" onclick="supprDocSigne('${c.id}','${x.id}')" title="Supprimer">🗑️</button>
      </div>
    </div>`).join("")}
  </div>`;
}

function modalDocSigne(clientId,devisId){
  const c=CLIENTS.find(x=>x.id===clientId); if(!c) return;
  const devisClient=DEVIS.filter(d=>d.clientId===c.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const opts=`<option value="">— Aucun (devis hors application) —</option>`+
    devisClient.map(d=>`<option value="${d.id}" ${d.id===devisId?"selected":""}>${d.num} · ${fMoney(devisTTC(d))} · ${fDate(d.date)}</option>`).join("");
  showModal("Ajouter un devis signé",`
    <div class="field"><label>Devis concerné</label><select id="ds-devis">${opts}</select></div>
    <div class="field"><label>Date de signature</label><input type="date" id="ds-date" value="${getToday()}"/></div>

// ── CONTRATS DE MAINTENANCE SIGNÉS ─────────────────────────
// ══════════════════════════════════════════════════════════
// Même bucket privé que les devis signés (chemin tenant_id/client_id/contrat-xxx.ext,
// donc mêmes règles d'accès). Métadonnées dans c.contratsSignes.
const CONTRAT_DUREE_MOIS=60;
const CONTRAT_NB_VISITES=10; // 2 visites / an pendant 60 mois
function ctrYMD(x){ return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
// Même quantième n mois plus tard (ramené au dernier jour du mois si besoin)
function ctrShiftMonths(d,n){ if(!d) return ""; const x=new Date(d+"T12:00:00"); const j=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+n); const dernier=new Date(x.getFullYear(),x.getMonth()+1,0,12).getDate(); x.setDate(Math.min(j,dernier)); return ctrYMD(x); }
// Dernier jour d'une période de n mois commençant le jour d
function ctrAddMonths(d,n){ if(!d) return ""; const x=new Date(d+"T12:00:00"); const j=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+n); const dernier=new Date(x.getFullYear(),x.getMonth()+1,0,12).getDate(); if(j>dernier){ x.setDate(dernier); } else { x.setDate(j); x.setDate(x.getDate()-1); } return ctrYMD(x); }
// Échéance de la période en cours (période ferme de 60 mois, puis reconductions de 12 mois)
function ctrEcheance(x){
  let fin=x.dateFin; if(!fin) return "";
  for(let i=0;i<30&&!x.resilie&&fin<getToday();i++) fin=ctrAddMonths(addDays(fin,1),12);
  return fin;
}
// Information obligatoire avant reconduction (art. L. 215-1 C. conso) — contrats particuliers.
// Date limite de refus = 1 mois avant l'échéance (art. 2 du contrat). Le courrier part
// au plus tôt 3 mois et au plus tard 1 mois avant cette date limite.
function ctrInfoL215(x){
  if(x.version!=="part"||x.resilie||!x.dateFin) return null;
  const ech=ctrEcheance(x);
  const limite=ctrShiftMonths(ech,-1);
  const debut=ctrShiftMonths(limite,-3), fin=ctrShiftMonths(limite,-1);
  const envoye=(x.infoReconduction||{})[ech];
  const t=getToday();
  const o={ech,limite,debut,fin,envoye};
  if(envoye) return {...o,etat:"envoye"};
  if(t<ctrShiftMonths(debut,-1)) return null;
  if(t<debut) return {...o,etat:"bientot"};
  if(t<=fin) return {...o,etat:"afaire"};
  return {...o,etat:"retard"};
}
function contratStatut(x){
  if(x.resilie) return ["#f1f5f9","#64748b","Résilié"];
  const ech=ctrEcheance(x);
  if(daysDiff(ech)<=90) return ["#fffbeb","#b45309","Échéance proche"];
  if(x.dateFin<getToday()) return ["#eff6ff","#1d4ed8","Reconduit"];
  return ["#f0fdf4","#15803d","En cours"];
}
function contratsAlertesL215(){
  const out=[];
  CLIENTS.forEach(c=>(c.contratsSignes||[]).forEach(x=>{const info=ctrInfoL215(x); if(info&&(info.etat==="afaire"||info.etat==="retard")) out.push({c,x,info});}));
  return out.sort((a,b)=>a.info.fin.localeCompare(b.info.fin));
}

// ── Visites préventives au Planning ──
function ctrJourOuvre(d){ const w=new Date(d+"T12:00:00").getDay(); return w===6?addDays(d,2):(w===0?addDays(d,1):d); }
function visitesContrat(x){ return EVENTS.filter(e=>e.contratId===x.id).sort((a,b)=>a.date.localeCompare(b.date)); }
// Visites à 3, 9, 15… 57 mois : 10 visites espacées de 6 mois, toutes dans la période ferme
function planifierVisitesContrat(c,x,depuis){
  let n=0;
  for(let k=1;k<=CONTRAT_NB_VISITES;k++){
    const d=ctrJourOuvre(ctrShiftMonths(x.dateSignature,6*k-3));
    if(depuis&&d<depuis) continue;
    if(EVENTS.some(e=>e.contratId===x.id&&e.visiteNum===k)) continue;
    EVENTS.push({id:uid(),type:"maintenance",titre:`Visite préventive ${k}/${CONTRAT_NB_VISITES}`,client:c.nom,date:d,heure:"09:00",
      notes:`Contrat de maintenance${x.forfaitLabel?" "+x.forfaitLabel:""}${c.adresse?" — "+c.adresse:""}`,contratId:x.id,clientId:c.id,visiteNum:k});
    n++;
  }
  return n;
}
function supprimerVisitesFutures(x){ const avant=EVENTS.length; EVENTS=EVENTS.filter(e=>!(e.contratId===x.id&&e.date>=getToday())); return avant-EVENTS.length; }
function planifierVisitesBtn(clientId,docId){
  const c=CLIENTS.find(y=>y.id===clientId); const x=c&&(c.contratsSignes||[]).find(y=>y.id===docId); if(!x) return;

  logActivity("Visites planifiées",`${c.nom} — ${n} visite(s)`);

}

  x.resilie=!x.resilie;
  const n=x.resilie?supprimerVisitesFutures(x):planifierVisitesContrat(c,x,getToday());
  logActivity(x.resilie?"Contrat résilié":"Contrat réactivé",`${c.nom} — ${x.forfaitLabel||""}${n?` (${n} visite(s) ${x.resilie?"retirée(s)":"replanifiée(s)"})`:""}`);
  saveData(); renderPage();
}
function supprContratSigne(clientId,docId){
  const c=CLIENTS.find(x=>x.id===clientId); const x=c&&(c.contratsSignes||[]).find(y=>y.id===docId); if(!x) return;
  if(!confirm(`Supprimer définitivement « ${x.nom} » ? Les visites à venir seront retirées du Planning.`)) return;
  sbClient.storage.from(DOCS_BUCKET).remove([x.path]).then(({error})=>{
    if(error){alert("Suppression impossible : "+error.message);return;}
    c.contratsSignes=c.contratsSignes.filter(y=>y.id!==docId);
    supprimerVisitesFutures(x);
    logActivity("Contrat signé supprimé",`${c.nom} — ${x.nom}`);
    saveData(); renderPage();
  });
}

function marquerInfoEnvoyee(clientId,docId){
  const c=CLIENTS.find(y=>y.id===clientId); const x=c&&(c.contratsSignes||[]).find(y=>y.id===docId); if(!x) return;
  const i=ctrInfoL215(x); if(!i) return;
  const d=prompt("Date d'envoi du courrier (JJ/MM/AAAA) :",fDate(getToday()));
  if(d===null) return;
  const m=d.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  const iso=m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:getToday();
  x.infoReconduction=x.infoReconduction||{};
  x.infoReconduction[i.ech]=iso;

}

const CONTRAT_TVA=8.5;
function ctrEur(n){ const s=(Math.round(Number(n||0)*100)/100).toFixed(2).replace(".",","); return (s.endsWith(",00")?s.slice(0,-3):s)+" €"; }
function ctrTTC(ht){ return Math.round(Number(ht||0)*(1+CONTRAT_TVA/100)*100)/100; }
function ctrPrixTxt(m){ return (m.forfait||m.prixPerso)?`${ctrEur(m.prixHT)} HT, soit ${ctrEur(ctrTTC(m.prixHT))} TTC`:"________ € HT, soit ________ € TTC"; }

// Annexe 4 (particulier uniquement) : texte légal collé depuis Légifrance dans Paramètres › Apparence
function CONTRAT_ANNEXE_L215(){
  const t=(TH.contratTexteL215||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  return t.length?t.map(s=>["p",s]):[["p","[À compléter : texte intégral des articles du Code de la consommation visés par l'article L. 215-4 (reconduction des contrats de prestation de services), à coller une fois pour toutes dans Paramètres › Apparence.]"]];
}
function contratForfaitAuto(nbCameras){
  if(nbCameras===""||nbCameras===null||nbCameras===undefined) return "";
  const n=Number(nbCameras); const fs=TH.contratForfaits||[];
  if(!n||!fs.length) return "";
  const f=fs.find(f=>n>=f.min&&(f.max==null||n<=f.max));
  if(f) return f.id;
  const last=fs[fs.length-1];
  return (last&&last.max!=null&&n>last.max)?last.id:"";
}
function contratMaxCameras(){ const fs=TH.contratForfaits||[]; const last=fs[fs.length-1]; return last&&last.max!=null?last.max:null; }
function forfaitLabel(f){
  if(f.max==null) return `${f.min} caméras et plus`;
  return f.min===f.max?`${f.min} caméra${f.min>1?"s":""}`:`${f.min} à ${f.max} caméras`;
}
function buildContratModel(clientId,opts){
  const c=CLIENTS.find(x=>x.id===clientId)||{};
  const part=opts.version?opts.version==="part":(c.cat!=="Pro");
  const forfaits=TH.contratForfaits||[];
  const forfaitId=opts.forfaitId||contratForfaitAuto(c.nbCameras)||(forfaits[0]&&forfaits[0].id)||"";
  const forfait=forfaits.find(f=>f.id===forfaitId);
  const perso=opts.prixPerso!==undefined&&opts.prixPerso!==null&&String(opts.prixPerso).trim()!==""&&!isNaN(Number(opts.prixPerso));
  const prixHT=perso?Number(opts.prixPerso):(forfait?forfait.prix:0);
  const prestNom=`${TH.nom} ${TH.sous}`.trim();
  const contactPrest=[TH.tel,TH.email].filter(Boolean).join(" · ");
  const contactCli=[c.tel,c.email].filter(Boolean).join(" · ");
  const adresse=opts.adresseSite||c.adresse||"[Adresse complète du site]";
  return {
    c, part, forfaits, forfaitId, forfait, prixHT, prixPerso:perso,
    prestataire:{nom:prestNom,siege:TH.contratSiege},
    prestRows:[
      ["Raison sociale",prestNom],
      ["Forme juridique","SAS"],
      ["Siège social",TH.contratSiege],
      ["SIREN",TH.contratSiren],
      ...(contactPrest?[["Téléphone / e-mail",contactPrest]]:[]),
      ["Représentée par",`${TH.contratRepresentant}, en qualité de ${TH.contratQualite}`],
      ["Ci-après dénommée","« le Prestataire »"],
    ],
    clientNom:c.nom||(part?"[Nom et prénom du Client]":"[Nom du Client]"),
    clientRows:part?[
      ["Nom et prénom",c.nom||"[Nom et prénom]"],
      ["Adresse",adresse],
      ["Téléphone / e-mail",contactCli||"—"],
      ["Ci-après dénommé","« le Client »"],
    ]:[
      ["Raison sociale / Nom",c.nom||"[Raison sociale]"],
      ["Forme juridique",c.formeJuridique||"—"],
      ["Adresse",adresse],
      ["SIRET",c.siret||"—"],
      ["Représenté par",c.contact?(c.contact+(c.representantQualite?", "+c.representantQualite:"")):"[Nom, Prénom – qualité]"],
      ["Ci-après dénommé","« le Client »"],
    ],
    dateEffet:opts.dateEffet||getToday(),
    delaiBloquant:TH.contratDelaiBloquant,
    delaiPartiel:TH.contratDelaiPartiel,
    tribunal:TH.contratTribunal,
    mediateur:TH.contratMediateur||"[nom, adresse et site internet du médiateur]",
    indemnitePct:TH.contratIndemnitePart!=null?TH.contratIndemnitePart:20,
  };
}
function contratRecapRows(m){
  const maxC=contratMaxCameras();
  return [
    ["Forfait souscrit par le Client",m.forfait?m.forfait.label:"—"],
    ["Mensualité appliquée",`${ctrPrixTxt(m)}${m.prixPerso?" (tarif sur devis)":""}`],
    ["Fréquence des visites préventives","2 visites / an (tous les 6 mois)"],
    ["TVA applicable",`${String(CONTRAT_TVA).replace(".",",")} % (Martinique)`],
    ["Délai panne bloquante",m.delaiBloquant],
    ["Délai panne partielle",m.delaiPartiel],
    ["Télésurveillance / télémaintenance","Non proposée — interventions sur site uniquement"],
  ].concat(maxC&&m.c.nbCameras>maxC?[["Nombre de caméras",`${m.c.nbCameras} (au-delà de ${maxC} : tarification sur devis)`]]:[]);
}
function contratNoteGrille(){
  const maxC=contratMaxCameras();
  return (maxC?`Au-delà de ${maxC} caméras, une tarification sur devis est établie. `:"")+"Chaque forfait comprend l'ensemble des prestations décrites à l'Article 3 du présent contrat.";
}
function contratAnnexe1(m){
  return `${m.c.nbCameras?`Système composé de ${m.c.nbCameras} caméra${m.c.nbCameras>1?"s":""}. `:""}[Compléter : marques/modèles, localisation, enregistreur(s), capacité de stockage, durée de conservation, schéma d'implantation le cas échéant.]`;
}

function blocksToHTML(blocks){

function buildContratDocx(m){
  const {Document,Paragraph,TextRun,HeadingLevel,AlignmentType,Table,TableRow,TableCell,WidthType,ShadingType,BorderStyle,Header,Footer,PageNumber,LevelFormat,convertInchesToTwip}=docx;
  const articles=CONTRAT_TEXTE(m);
  const NAVY=(TH.txt||"#37301F").replace("#",""),BLUE=(TH.c1||"#3286A0").replace("#",""),BEIGE=(TH.sand||"#DED3BC").replace("#","");
  const borders=()=>({top:{style:BorderStyle.SINGLE,size:2,color:"CCCCCC"},bottom:{style:BorderStyle.SINGLE,size:2,color:"CCCCCC"},left:{style:BorderStyle.SINGLE,size:2,color:"CCCCCC"},right:{style:BorderStyle.SINGLE,size:2,color:"CCCCCC"},insideHorizontal:{style:BorderStyle.SINGLE,size:2,color:"CCCCCC"},insideVertical:{style:BorderStyle.SINGLE,size:2,color:"CCCCCC"}});
  const heading=(text,pageBreakBefore)=>new Paragraph({heading:HeadingLevel.HEADING_1,pageBreakBefore:!!pageBreakBefore,spacing:{before:300,after:150},children:[new TextRun({text,bold:true,color:BLUE})]});
  const p=(text)=>new Paragraph({spacing:{after:120,line:300},children:[new TextRun({text})]});
  const bullet=(text)=>new Paragraph({numbering:{reference:"main-bullets",level:0},spacing:{after:80},children:[new TextRun({text})]});
  const sub=(text)=>new Paragraph({spacing:{before:100,after:80},children:[new TextRun({text,bold:true})]});
  const artNum=(n,title)=>new Paragraph({heading:HeadingLevel.HEADING_2,spacing:{before:260,after:120},children:[new TextRun({text:`Article ${n} – ${title}`,bold:true,color:NAVY})]});
  const fieldRow=(label,value)=>new TableRow({children:[
    new TableCell({width:{size:3000,type:WidthType.DXA},shading:{type:ShadingType.CLEAR,fill:BEIGE},margins:{top:80,bottom:80,left:120,right:120},children:[new Paragraph({children:[new TextRun({text:label,bold:true,size:20})]})]}),
    new TableCell({width:{size:6200,type:WidthType.DXA},margins:{top:80,bottom:80,left:120,right:120},children:[new Paragraph({children:[new TextRun({text:String(value),size:20})]})]}),
  ]});
  const rowsTable=(rows)=>new Table({width:{size:9200,type:WidthType.DXA},columnWidths:[3000,6200],borders:borders(),rows:rows.map(([l,v])=>fieldRow(l,v))});
  const blocksToDocx=(blocks)=>{const out=[];blocks.forEach(([type,val])=>{
    if(type==="p") out.push(p(val)); else if(type==="sub") out.push(sub(val)); else if(type==="bullets") val.forEach(x=>out.push(bullet(x)));
  });return out;};
  const articleParas=[];
  articles.forEach(a=>{articleParas.push(artNum(a.n,a.t));blocksToDocx(a.b).forEach(x=>articleParas.push(x));});

  const W=[1900,2100,1750,1750,1700];
  const headCell=(text,i)=>new TableCell({width:{size:W[i],type:WidthType.DXA},shading:{type:ShadingType.CLEAR,fill:BLUE},margins:{top:80,bottom:80,left:120,right:120},children:[new Paragraph({children:[new TextRun({text,bold:true,color:"FFFFFF",size:20})]})]});
  const cell=(text,i,bold)=>new TableCell({width:{size:W[i],type:WidthType.DXA},margins:{top:80,bottom:80,left:120,right:120},children:[new Paragraph({children:[new TextRun({text:String(text),bold:!!bold,size:20})]})]});
  const forfaitRows=[
    new TableRow({tableHeader:true,children:["Forfait","Système","Mensualité HT","Mensualité TTC","Sélection"].map((t,i)=>headCell(t,i))}),
    ...m.forfaits.map(f=>{const s=f.id===m.forfaitId;return new TableRow({children:[f.label,forfaitLabel(f),ctrEur(f.prix),ctrEur(ctrTTC(f.prix)),s?"☑":"☐"].map((t,i)=>cell(t,i,s))});}),
  ];
  const noBorders={top:{style:BorderStyle.NONE},bottom:{style:BorderStyle.NONE},left:{style:BorderStyle.NONE},right:{style:BorderStyle.NONE},insideHorizontal:{style:BorderStyle.NONE},insideVertical:{style:BorderStyle.NONE}};

  return new Document({
    numbering:{config:[{reference:"main-bullets",levels:[{level:0,format:LevelFormat.BULLET,text:"•",alignment:AlignmentType.LEFT,style:{paragraph:{indent:{left:convertInchesToTwip(0.3),hanging:convertInchesToTwip(0.15)}}}}]}]},
    sections:[{
      properties:{page:{size:{width:11906,height:16838},margin:{top:1000,bottom:1000,left:1100,right:1100}}},
      headers:{default:new Header({children:[new Paragraph({alignment:AlignmentType.RIGHT,border:{bottom:{style:BorderStyle.SINGLE,size:6,color:BLUE,space:4}},children:[new TextRun({text:"AD SECURE CONCEPT",bold:true,color:BLUE,size:20})]})]})},
      footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER,children:[
        new TextRun({text:`Contrat de maintenance – ${(TH.nom+" "+(TH.sous||"")).trim()}   |   Page `,size:16,color:"888888"}),
        new TextRun({children:[PageNumber.CURRENT],size:16,color:"888888"}),
        new TextRun({text:" / ",size:16,color:"888888"}),
        new TextRun({children:[PageNumber.TOTAL_PAGES],size:16,color:"888888"}),
      ]})]})},
      children:[
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:100},children:[new TextRun({text:"CONTRAT DE MAINTENANCE",bold:true,size:40,color:NAVY})]}),
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:100},children:[new TextRun({text:"Système de vidéosurveillance / vidéoprotection",size:26,color:BLUE})]}),
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:300},children:[new TextRun({text:`Durée : 60 mois · ${m.part?"Client particulier":"Client professionnel"}`,italics:true,size:22,color:"555555"})]}),
        heading("Entre les soussignés"),
        p("LE PRESTATAIRE :"),
        rowsTable(m.prestRows),
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:100,after:100},children:[new TextRun({text:"ET",bold:true})]}),
        p("LE CLIENT :"),

        new Table({width:{size:9200,type:WidthType.DXA},columnWidths:[4600,4600],borders:noBorders,rows:[new TableRow({children:[
          new TableCell({width:{size:4600,type:WidthType.DXA},children:[
            new Paragraph({children:[new TextRun({text:"Pour le Prestataire",bold:true,color:BLUE})]}),
            new Paragraph({children:[new TextRun({text:m.prestataire.nom,size:20})]}),
            new Paragraph({children:[new TextRun({text:`${TH.contratRepresentant}, ${TH.contratQualite}`,size:20})]}),
            new Paragraph({spacing:{before:600},children:[new TextRun({text:"Signature :",size:20})]}),
          ]}),
          new TableCell({width:{size:4600,type:WidthType.DXA},children:[

function doGenererContratWord(clientId,opts){

      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      a.download=`Contrat_Maintenance_${m.part?"Particulier":"Pro"}_${(m.clientNom||"Client").replace(/[^a-z0-9]+/gi,"_")}.docx`;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      logActivity("Génération contrat",`Contrat maintenance ${m.part?"particulier":"pro"} (Word) : ${m.clientNom}${m.forfait?" — "+m.forfait.label:""}`);

function previewAvatar(ev){
  const file=ev.target.files[0];if(!file)return;
  if(file.size>500000){alert("Image trop lourde (max 500 Ko)");return;}
  const reader=new FileReader();
  reader.onload=e=>{
    document.getElementById("u-avatar").value=e.target.result;
    const prev=document.getElementById("u-avatar-preview");
    if(prev)prev.innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover"/>`;
  };
  reader.readAsDataURL(file);
}
function updateAvatarInitial(name){
  const prev=document.getElementById("u-avatar-preview");
  const av=document.getElementById("u-avatar");
  if(prev&&av&&!av.value){prev.textContent=name?name.charAt(0).toUpperCase():"?";}
}

async function saveUser(id){
  const u=PROFILES.find(x=>x.id===id);
  if(!u)return;
  const isMe=currentUser&&id===currentUser.id;
  const nom=document.getElementById("u-nom").value.trim();
  if(!nom){alert("Le nom est obligatoire");return;}
  const patch={
    nom,
    poste:document.getElementById("u-poste").value.trim(),
    tel:document.getElementById("u-tel").value.trim(),
    avatar:document.getElementById("u-avatar").value
  };
  // Rôle et statut : jamais sur soi-même, pour éviter de se verrouiller dehors
  if(!isMe){
    patch.role=document.getElementById("u-role").value;
    patch.actif=document.getElementById("u-actif").value==="true";
  }
  const {error}=await sbClient.from("profiles").update(patch).eq("id",id);
  if(error){ alert("Enregistrement impossible : "+error.message); return; }
  logActivity("Modification utilisateur",`Profil de ${nom} mis à jour`);
  if(isMe){
    currentUser={...currentUser,nom,poste:patch.poste,tel:patch.tel,avatar:patch.avatar};
    sessionStorage.setItem("gp_user",JSON.stringify(currentUser));
  }
  closeModal();
  await loadProfiles();
  renderPanel();
  renderNav();
}

// dans le journal et les documents, et le compte Auth resterait actif.
async function delUser(id){
  const u=PROFILES.find(x=>x.id===id);
  if(!u)return;
  if(currentUser&&id===currentUser.id){alert("Vous ne pouvez pas désactiver votre propre compte.");return;}
  const actifs=PROFILES.filter(p=>p.actif!==false&&(p.role==="admin"||p.role==="super_admin"));
  if(u.actif!==false&&actifs.length<=1&&actifs[0]&&actifs[0].id===id){
    alert("Impossible de désactiver le dernier administrateur actif.");return;
  }
  confirmDel(`Désactiver le compte de ${u.nom||"cet utilisateur"} ? Il ne pourra plus se connecter, mais son historique est conservé.`,async function(){
    const {error}=await sbClient.from("profiles").update({actif:false}).eq("id",id);
    if(error){ alert("Action impossible : "+error.message); return; }
    logActivity("Désactivation utilisateur",`${u.nom||"Utilisateur"} désactivé`);
    await loadProfiles();
    renderPanel();
  });
}

// Réactivation d'un compte désactivé
async function reactivateUser(id){
  const u=PROFILES.find(x=>x.id===id);
  if(!u)return;
  const {error}=await sbClient.from("profiles").update({actif:true}).eq("id",id);
  if(error){ alert("Action impossible : "+error.message); return; }
  logActivity("Réactivation utilisateur",`${u.nom||"Utilisateur"} réactivé`);
  await loadProfiles();
  renderPanel();
}

function modalInviteUser(){
  const roles=hasRole("super_admin")
    ?[["user","Utilisateur"],["admin","Administrateur"],["super_admin","Super administrateur"]]
    :[["user","Utilisateur"],["admin","Administrateur"]];
  showModal("Inviter un utilisateur",`
    <div class="info-box" style="margin-bottom:16px">✉️ Un email d'invitation sera envoyé. L'utilisateur choisira son mot de passe lui-même et rejoindra automatiquement votre entreprise.</div>
    <div class="field"><label>Email *</label><input id="inv-email" type="email" placeholder="prenom.nom@exemple.fr"/></div>
    <div class="field"><label>Nom complet *</label><input id="inv-nom" placeholder="Prénom Nom"/></div>
    <div class="field-row">
      <div class="field"><label>Poste / Fonction</label><input id="inv-poste" placeholder="Commercial, Technicien..."/></div>
      <div class="field"><label>Rôle</label><select id="inv-role">
        ${roles.map(([k,l])=>`<option value="${k}"${k==="user"?" selected":""}>${l}</option>`).join("")}
      </select></div>
    </div>
    <div id="inv-msg" style="display:none;font-size:12.5px;font-weight:600;padding:10px 13px;border-radius:9px;margin-top:4px"></div>`,
    `<button class="btn-cancel" onclick="closeModal()">Annuler</button>
     <button class="btn-save" id="inv-btn" style="background:${TH.c1}" onclick="sendInvite()">✉️ Envoyer l'invitation</button>`
  );
}

function invMsg(texte,type){
  const box=document.getElementById("inv-msg");
  if(!box)return;
  const st=type==="ok"
    ?{c:"#15803d",bg:"#f0fdf4",bd:"#86efac"}
    :{c:"#991b1b",bg:"#fef2f2",bd:"#fca5a5"};
  box.textContent=texte;
  box.style.display="block";
  box.style.color=st.c;box.style.background=st.bg;box.style.border="1.5px solid "+st.bd;
}

async function sendInvite(){
  const email=document.getElementById("inv-email").value.trim();
  const nom=document.getElementById("inv-nom").value.trim();
  const poste=document.getElementById("inv-poste").value.trim();
  const role=document.getElementById("inv-role").value;
  if(!email||!email.includes("@")){invMsg("Adresse email invalide.","err");return;}
  if(!nom){invMsg("Le nom est obligatoire.","err");return;}

  const btn=document.getElementById("inv-btn");
  if(btn){btn.disabled=true;btn.textContent="⟳ Envoi…";}
  try{
    const {data,error}=await sbClient.functions.invoke("Invite-user",{
      body:{email,nom,poste,role,redirectTo:location.origin+location.pathname}
    });
    // L'erreur métier est renvoyée dans le corps de la réponse
    const msg=(data&&data.error)||(error&&error.message);
    if(msg){ invMsg(msg,"err"); if(btn){btn.disabled=false;btn.textContent="✉️ Envoyer l'invitation";} return; }
    invMsg("✓ Invitation envoyée à "+email,"ok");
    logActivity("Invitation utilisateur",`${nom} (${email}) — ${roleLabel(role)}`);
    await loadProfiles();
    renderPanel();
    setTimeout(closeModal,1400);
  }catch(e){
    invMsg("Envoi impossible : "+e.message,"err");
    if(btn){btn.disabled=false;btn.textContent="✉️ Envoyer l'invitation";}
  }
}

}

// ── Réglages de la signature des e-mails ──
function sigSet(k,v){
  if(!TH.sigMail||typeof TH.sigMail!=="object"){const c=SigMail.cfg(TH);TH.sigMail={actif:true,nom:"",poste:"",societe:c.societe,tel1:c.tel1,tel2:"",email:c.email,site:c.site,adresse:c.adresse,logoUrl:"",slogan:""};}
  TH.sigMail[k]=v;saveData();
  const ap=document.getElementById("sig-apercu");
  if(ap) ap.innerHTML=SigMail.cfg(TH).actif?SigMail.html(TH):`<div style="padding:12px 0;color:#94a3b8;font-size:12px">Signature désactivée : seuls le nom de l'entreprise et ses coordonnées figurent en texte simple.</div>`;
}
// Signatures personnelles : chaque utilisateur signe les devis et factures qu'il envoie
function sigUserSet(uid,k,v){
  TH.sigMailUsers=TH.sigMailUsers||{};TH.sigMailUsers[uid]=TH.sigMailUsers[uid]||{};
  TH.sigMailUsers[uid][k]=v;saveData();
  const ap=document.getElementById("sig-ap-"+uid);if(ap)ap.innerHTML=SigMail.html(TH,uid);
}

function bindPanel(){
  window.applyPreset=function(i){const p=PRESETS[i];Object.assign(TH,{c1:p.c1,c2:p.c2,sidebar:p.sb,bg:p.bg,card:p.card,txt:p.txt,sand:p.sand});applyTheme();renderNav();renderPanel();};
  window.handleLogo=function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{TH.logo=ev.target.result;applyTheme();renderPanel();};r.readAsDataURL(f);};
  window.dragStart=function(i){dragIdx=i;};
  window.dragOver=function(e,i){e.preventDefault();if(dragIdx===null||dragIdx===i)return;const sorted=[...RUBS].sort((a,b)=>a.ordre-b.ordre);const[m]=sorted.splice(dragIdx,1);sorted.splice(i,0,m);RUBS=sorted.map((r,idx)=>({...r,ordre:idx}));dragIdx=i;renderPanel();};
  window.dragEnd=function(){dragIdx=null;};
  window.toggleEmojiPicker=function(id){emojiPickerOpen=emojiPickerOpen===id?null:id;renderPanel();};
  window.setRubIcon=function(id,em){RUBS=RUBS.map(r=>r.id===id?{...r,icon:em}:r);emojiPickerOpen=null;renderPanel();};
  window.setRubLabel=function(id,v){RUBS=RUBS.map(r=>r.id===id?{...r,label:v}:r);};
  window.toggleRub=function(id){RUBS=RUBS.map(r=>r.id===id&&r.id!=="db"?{...r,actif:!r.actif}:r);renderPanel();};
}

// ── Sidebar toggle ──────────────────────────────────────────────────────────
function getSidebarW(){return 240;}

function setSidebarVisuals(open){
  const labels=document.querySelectorAll(".sidebar-label");
  const appName=document.getElementById("app-name");
  const appSub=document.getElementById("app-sub");
  const div=document.getElementById("sidebar-divider");
  const logo=document.getElementById("logo-placeholder")||document.getElementById("logo-img");
  const bot=document.getElementById("sidebar-bottom");
  const v=open?"1":"0";
  labels.forEach(l=>{l.style.opacity=v;l.style.maxWidth=open?"200px":"0";});
  if(appName){appName.style.opacity=v;appName.style.maxHeight=open?"40px":"0";}
  if(appSub){appSub.style.opacity=v;appSub.style.maxHeight=open?"30px":"0";}
  if(div)div.style.opacity=v;
  if(logo){logo.style.opacity=v;logo.style.maxHeight=open?"70px":"0";}
  if(bot)bot.style.opacity=v;
}

// Réduction/expansion sur DESKTOP uniquement (bouton ☰ dans la sidebar)
function toggleSidebar(){
  if(window.innerWidth<=768) return;
  document.getElementById("app-screen").classList.toggle("collapsed");
}

// Applique le bon layout selon la largeur d'écran
function applyLayout(){
  const sb=document.getElementById("sidebar");
  const main=document.getElementById("main");
  const app=document.getElementById("app-screen");
  if(window.innerWidth<=768){
    // MOBILE : effacer styles inline, retirer collapsed, laisser le CSS gérer
    sb.style.width="";
    main.style.marginLeft="";
    sb.classList.remove("open");
    if(app)app.classList.remove("collapsed");
    const ov=document.getElementById("sidebar-overlay");
    if(ov)ov.classList.remove("open");
    setSidebarVisuals(true);
  } else {
    // DESKTOP/TABLETTE : effacer les inline pour laisser le CSS gérer
    sb.style.width="";
    main.style.marginLeft="";
  }
}

function initSidebar(){ applyLayout(); }

let resizeTimer=null;
window.addEventListener("resize",function(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(applyLayout,150);
});

// Charger les données locales avant tout rendu
loadData();

// Vérifier la session Supabase Auth, puis synchroniser (scopé au tenant) avant d'afficher
async function bootApp(){
  if(checkLogin()){
    // La session sessionStorage existe : on vérifie qu'elle est toujours valide côté Supabase Auth
    const {data:sessionData}=await sbClient.auth.getSession();
    if(!sessionData || !sessionData.session){
      // Session expirée/invalide : retour à l'écran de connexion
      isLoggedIn=false;currentUser=null;CURRENT_TENANT=null;DBWIDGETS=[];dbEditMode=false;
      sessionStorage.removeItem("gp_user");
      document.getElementById("login-screen").style.display="flex";
      document.getElementById("app-screen").style.display="none";
      return;
    }
    document.getElementById("login-screen").style.display="none";
    document.getElementById("app-screen").style.display="flex";
    // Récupérer les données du cloud (scopées au tenant courant)
    await syncPull();
    applyTheme();
    initSidebar();
    renderNav();
    renderPage();
    // Snapshot quotidien automatique (1 par jour max, en arrière-plan)
    createBackupSnapshot(false);
  } else {
    document.getElementById("login-screen").style.display="flex";
    document.getElementById("app-screen").style.display="none";
  }
  // Mettre à jour le logo de connexion avec le thème synchronisé
  if(TH.logo){
    const ll=document.getElementById("login-logo");
    if(ll)ll.innerHTML=`<img src="${TH.logo}" style="width:60px;height:60px;object-fit:contain;filter:${TH.logoF}"/>`;
  }
}

// Afficher d'abord l'écran de connexion immédiatement (pas d'attente),
// puis synchroniser en arrière-plan
if(checkLogin()){
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app-screen").style.display="flex";
  applyTheme();
  initSidebar();
  renderNav();
  renderPage();
} else {
  document.getElementById("login-screen").style.display="flex";
  document.getElementById("app-screen").style.display="none";
}
if(TH.logo){
  const ll=document.getElementById("login-logo");
  if(ll)ll.innerHTML=`<img src="${TH.logo}" style="width:60px;height:60px;object-fit:contain;filter:${TH.logoF}"/>`;
}
// Puis on synchronise le cloud (récupère les utilisateurs créés ailleurs)
bootApp();
</script>
