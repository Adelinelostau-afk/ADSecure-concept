<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Signature du devis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet"/>
<style>
  :root{--c1:#3286A0;--ink:#1A2118;--muted:#64748b;--line:#e8e4dc;--bg:#F7F4ED}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header{background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
  header img{width:44px;height:auto}
  header .nom{font-family:'Lora',Georgia,serif;font-weight:700;font-size:18px}
  header .sub{font-size:12px;color:#DED3BC}
  main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
  .carte{background:#fff;border-radius:16px;border:1px solid rgba(26,33,24,0.1);box-shadow:0 2px 12px rgba(0,0,0,0.04);margin-bottom:18px;overflow:hidden}
  .tete{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .titre{font-family:'Lora',Georgia,serif;font-weight:700;font-size:17px}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
  iframe{width:100%;border:0;display:block;min-height:500px;background:#fff}
  .corps{padding:18px 20px}
  label.l{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
  input[type=text]{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid #e2e8f0;font-size:16px;font-family:inherit;background:var(--bg)}
  .zone{position:relative;margin-top:6px}
  canvas{width:100%;height:190px;border:2px dashed #cbd5e1;border-radius:14px;background:#fff;touch-action:none;display:block}
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:15px;pointer-events:none}
  .ligne{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px}
  .petit{font-size:12px;color:var(--muted);line-height:1.5}
  .accord{display:flex;gap:10px;align-items:flex-start;margin:18px 0;font-size:14px;line-height:1.5;cursor:pointer}
  .accord input{width:22px;height:22px;flex-shrink:0;margin-top:1px;accent-color:var(--c1)}
  button{font-family:inherit;cursor:pointer}
  .btn{width:100%;padding:15px;border:none;border-radius:12px;background:#15803d;color:#fff;font-size:16px;font-weight:800}
  .btn:disabled{opacity:0.5;cursor:default}
  .sec{padding:7px 12px;border-radius:9px;border:1.5px solid #e2e8f0;background:#fff;font-size:13px;color:#475569}
  .erreur{display:none;margin-top:12px;padding:12px 14px;border-radius:10px;background:#fef2f2;color:#991b1b;border:1.5px solid #fca5a5;font-size:14px}
  .total{font-size:22px;font-weight:800}
  .centre{text-align:center;padding:40px 20px}
  .ok{background:#f0fdf4;border:1.5px solid #86efac;color:#15803d;border-radius:14px;padding:16px 18px}
  .sigimg{max-width:100%;height:120px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:10px}
  footer{text-align:center;font-size:11px;color:#94a3b8;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<header><img id="logo" src="logo.png" alt="" onerror="this.style.display='none'"/><div><div class="nom" id="ent-nom">Signature électronique</div><div class="sub" id="ent-sub">Devis à signer</div></div></header>
<main id="app"><div class="carte centre"><div style="font-size:15px;color:var(--muted)">⟳ Chargement du devis…</div></div></main>
<script>
const FN="https://tcszogqlvqpxrtdirkto.supabase.co/functions/v1/signature-devis";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3pvZ3FsdnFweHJ0ZGlya3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzQ0MzMsImV4cCI6MjEwNTc1MDQzM30.nw3AhyUqsvlvYSDQCzx8eLFBMIvK2I1QUtgFD-t7Qyo";
const token=new URLSearchParams(location.search).get("t")||"";
const app=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const eur=n=>Number(n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const dateFr=iso=>new Date(iso).toLocaleString("fr-FR",{dateStyle:"long",timeStyle:"short"});
let D=null,sigVide=true;

async function appel(action,extra){
  const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ANON},body:JSON.stringify({action,token,...(extra||{})})});
  const j=await r.json().catch(()=>({error:"Réponse illisible du serveur."}));
  return j;
}
function marque(e){
  if(!e) return;
  if(e.nom){document.getElementById("ent-nom").textContent=e.nom;document.title="Signature du devis — "+e.nom;}
  if(e.c1) document.documentElement.style.setProperty("--c1",e.c1);
}
function erreurPage(msg){
  app.innerHTML=`<div class="carte centre"><div style="font-size:40px">🔒</div><div style="font-weight:700;font-size:16px;margin:8px 0">${esc(msg)}</div>
    <div class="petit">Si vous pensez qu'il s'agit d'une erreur, contactez l'entreprise qui vous a envoyé ce lien.</div></div>`;
}
function iframeDevis(){
  return `<iframe id="doc" sandbox="allow-same-origin" title="Devis ${esc(D.devis_num)}"></iframe>`;
}
function remplirIframe(){
  const f=document.getElementById("doc");if(!f)return;
  f.srcdoc=D.snapshot_html;
  f.onload=()=>{try{const h=f.contentDocument.documentElement.scrollHeight;f.style.height=Math.max(500,h+10)+"px";
    // le devis est conçu en A4 : on le réduit sur petit écran
    const w=f.clientWidth;if(w<794){const k=w/794;const b=f.contentDocument.body;b.style.transformOrigin="0 0";b.style.transform=`scale(${k})`;b.style.width="794px";f.style.height=Math.ceil((h+10)*k)+"px";}
  }catch(e){}};
}
function rendre(){
  const signe=D.statut==="signe",expire=D.statut==="expire";
  document.getElementById("ent-sub").textContent=signe?"Devis signé":"Devis à signer";
  app.innerHTML=`
    <div class="carte">
      <div class="tete"><div><div class="titre">Devis ${esc(D.devis_num)}</div><div class="petit">${esc(D.client_nom||"")}</div></div>
        <div style="text-align:right"><div class="petit">Montant TTC</div><div class="total">${eur(D.montant_ttc)}</div></div></div>
      ${iframeDevis()}
    </div>
    <div class="carte"><div class="corps" id="signature">${signe?blocSigne():expire?`<div class="centre" style="padding:20px"><div style="font-weight:700">Ce lien de signature a expiré.</div><div class="petit">Contactez l'entreprise pour recevoir un nouveau devis.</div></div>`:formulaire()}</div></div>
    <footer>Signature électronique simple. La date, l'heure, l'adresse IP, le nom du signataire et l'empreinte du document sont enregistrés comme preuve.${D.snapshot_hash?`<br/>Empreinte du devis : ${esc(D.snapshot_hash.slice(0,16))}…`:""}</footer>`;
  remplirIframe();
  if(!signe&&!expire) initCanvas();
}
function blocSigne(){
  return `<div class="ok"><div style="font-weight:800;font-size:16px">✓ Devis signé</div>
    <div style="font-size:14px;margin-top:4px">Signé par <strong>${esc(D.signataire)}</strong> le ${esc(dateFr(D.signe_le))}.</div></div>
    ${D.signature_png?`<img class="sigimg" src="${D.signature_png}" alt="Signature"/>`:""}
    <div class="petit" style="margin-top:10px">Merci pour votre confiance. Une confirmation vous a été envoyée par e-mail. Vous pouvez imprimer cette page pour vos archives.</div>
    <button class="sec" style="margin-top:12px" onclick="window.print()">🖨️ Imprimer</button>`;
}
function formulaire(){
  return `<div class="titre" style="margin-bottom:4px">Accepter et signer le devis</div>
    <div class="petit" style="margin-bottom:16px">Lisez le devis ci-dessus, puis signez dans le cadre avec le doigt ou la souris.</div>
    <label class="l" for="nom">Vos nom et prénom</label>
    <input type="text" id="nom" autocomplete="name" placeholder="Prénom NOM" value=""/>
    <label class="accord"><input type="checkbox" id="accepte"/> <span><strong>Bon pour accord.</strong> J'accepte le devis ${esc(D.devis_num)} d'un montant de ${eur(D.montant_ttc)} TTC et les conditions générales de vente qui y sont mentionnées.</span></label>
    <label class="l">Votre signature</label>
    <div class="zone"><canvas id="cv"></canvas><div class="hint" id="hint">Signez ici</div></div>
    <div class="ligne"><span class="petit">En signant, vous confirmez votre commande.</span><button class="sec" type="button" onclick="effacer()">Effacer</button></div>
    <div class="erreur" id="err"></div>
    <button class="btn" id="go" style="margin-top:18px" onclick="signer()">✍️ Signer le devis</button>`;
}
function initCanvas(){
  const cv=document.getElementById("cv");const ratio=Math.max(1,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect();cv.width=Math.round(r.width*ratio);cv.height=Math.round(r.height*ratio);
  const ctx=cv.getContext("2d");ctx.scale(ratio,ratio);ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#1A2118";
  let on=false,last=null,traits=0;
  const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};};
  cv.onpointerdown=e=>{on=true;last=pos(e);cv.setPointerCapture(e.pointerId);document.getElementById("hint").style.display="none";e.preventDefault();};
  cv.onpointermove=e=>{if(!on)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();traits+=Math.hypot(p.x-last.x,p.y-last.y);last=p;if(traits>40)sigVide=false;e.preventDefault();};
  cv.onpointerup=cv.onpointercancel=()=>{on=false;};
}
function effacer(){const cv=document.getElementById("cv");cv.getContext("2d").clearRect(0,0,cv.width,cv.height);sigVide=true;document.getElementById("hint").style.display="flex";}
function err(m){const b=document.getElementById("err");b.textContent=m;b.style.display="block";}
async function signer(){
  const nom=document.getElementById("nom").value.trim();
  if(nom.length<2) return err("Indiquez vos nom et prénom.");
  if(!document.getElementById("accepte").checked) return err("Cochez la case « Bon pour accord ».");
  if(sigVide) return err("Signez dans le cadre prévu.");
  const cv=document.getElementById("cv");
  const out=document.createElement("canvas");out.width=700;out.height=Math.round(700*cv.height/cv.width);
  const c=out.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,out.width,out.height);c.drawImage(cv,0,0,out.width,out.height);
  const btn=document.getElementById("go");btn.disabled=true;btn.textContent="⟳ Signature en cours…";
  try{
    const r=await appel("sign",{nom,accepte:true,signature:out.toDataURL("image/png"),lien:location.href});
    if(r.error){err(r.error);btn.disabled=false;btn.textContent="✍️ Signer le devis";return;}
    D.statut="signe";D.signataire=r.signataire;D.signe_le=r.signe_le;D.signature_png=out.toDataURL("image/png");
    document.getElementById("signature").innerHTML=blocSigne();
    document.getElementById("ent-sub").textContent="Devis signé";
    window.scrollTo({top:document.getElementById("signature").offsetTop-20,behavior:"smooth"});
  }catch(e){err("Connexion impossible. Vérifiez votre accès internet et réessayez.");btn.disabled=false;btn.textContent="✍️ Signer le devis";}
}
(async()=>{
  if(!token) return erreurPage("Lien de signature incomplet.");
  try{
    const r=await appel("get");
    marque(r.entreprise);
    if(r.error) return erreurPage(r.error);
    D=r;rendre();
  }catch(e){erreurPage("Impossible de charger le devis. Vérifiez votre connexion internet.");}
})();
</script>
</body>
</html>
