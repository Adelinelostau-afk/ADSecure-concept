<style>
  :root{--blue:#3286A0;--blue2:#299AC3;--blueDark:#1F6E87;--brown:#37301F;--beige:#F3EDE1;--paper:#FAF7F1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);font-family:Roboto,sans-serif;color:var(--brown);display:flex;justify-content:center;padding:24px 16px 40px}
  .card{width:100%;max-width:420px}
  .hero{background:var(--beige);border-radius:20px 20px 0 0;padding:36px 24px 28px;text-align:center;position:relative}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--blue)}
  .brand{font-family:Lora,serif;font-weight:600;font-size:26px;color:var(--brown);margin:14px 0 6px}
  .tag{font-family:Rufina,serif;font-size:14px;color:var(--blueDark);letter-spacing:1.5px;margin:0}
  .body{background:var(--brown);color:var(--beige);border-radius:0 0 20px 20px;padding:24px;box-shadow:0 8px 24px rgba(55,48,31,.15)}
  h1{font-family:Lora,serif;font-size:24px;margin:0 0 4px;color:var(--beige)}
  .role{font-size:12px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue2);margin:0 0 20px}
  .save{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:500 16px Roboto,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
  .save:hover{background:var(--blue2)}
  .msg{font-size:13px;color:var(--blue2);text-align:center;min-height:18px;margin:8px 0 4px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 20px}
  .act{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:72px;justify-content:center;border-radius:12px;background:#4a4230;color:var(--beige);text-decoration:none;font-size:12px;font-weight:500}
  .act:hover{background:#5a5139}
  .act svg{stroke:var(--blue2)}
  .list{list-style:none;margin:0;padding:0;border-top:1px solid #554c38}
  .list li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #554c38;font-size:15px}
  .list li svg{stroke:var(--blue2)}
  .list a{color:var(--beige);text-decoration:none;word-break:break-all}
  .list a:hover{color:#fff}
  .hours{font-size:13px;line-height:1.6;color:#cfc4ab;margin:16px 0 0}
  svg.i{flex:none}
  footer{text-align:center;font-size:12px;color:#6b6250;margin-top:16px}
</style>

  "BEGIN:VCARD","VERSION:3.0","N:Victorni;Daniel;;;","FN:Daniel Victorni",
  "ORG:AD Secure Concept","TITLE:Directeur général",
  "TEL;TYPE=CELL,VOICE:+596696439584","EMAIL;TYPE=WORK:contact@adsecureconcept.fr",
  "URL:https://adsecureconcept.fr","ADR;TYPE=WORK:;;Quartier Bellay;Sainte-Luce;;97228;Martinique",
  "NOTE:Vidéosurveillance IP haute résolution · IA","END:VCARD"
].join("\r\n");
const btn = document.getElementById("save"), msg = document.getElementById("msg");
btn.addEventListener("click", () => {
  const blob = new Blob([VCF], {type: "text/vcard"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (document.title.split(" ·")[0].replace(/ /g,"-")) + "-AD-Secure-Concept.vcf";
  document.body.appendChild(a); a.click(); a.remove();
  msg.textContent = "Ouvrez le fichier pour ajouter le contact.";
});
</script>
</body>
